<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>Lingel — Dispatch Team</title>
<meta name="theme-color" content="#13161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#ffce1f;--green:#22c55e;--red:#ef4444;--blue:#5b9bd5;--amber:#f0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Spline Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.who{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--hivis);font-family:'Archivo Narrow';text-transform:uppercase;letter-spacing:.03em;display:block}
.hdr{padding-bottom:14px;border-bottom:2px solid var(--line);margin-bottom:14px}
.hdr .t{font-family:Archivo;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.hdr .s{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.vtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.vtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:11px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.vtab.on{background:var(--hivis);color:#111}
.vtab .vb{display:inline-block;min-width:18px;padding:1px 6px;margin-left:5px;border-radius:9px;background:var(--panel-2);color:var(--text);font-size:11px;line-height:16px}
.vtab.on .vb{background:#111;color:var(--hivis)}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat.a{border-left:4px solid var(--amber)}.stat.g{border-left:4px solid var(--green)}.stat.b{border-left:4px solid var(--blue)}
.stat .n{font-family:Archivo;font-weight:900;font-size:23px;line-height:1}
.stat .l{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Spline Sans',sans-serif}
.chip small{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--hivis);border-color:var(--hivis);color:#111}.chip.on small{color:#333}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px 11px 36px;font-size:15px;background:var(--panel-2);color:var(--text);font-family:'Spline Sans',sans-serif}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.rf{flex:0 0 auto;width:46px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;font-size:18px;cursor:pointer}
.sync{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--green)}.dot.busy{background:var(--amber)}.dot.err{background:var(--red)}
.rsec{margin-bottom:18px}
.rhead{display:flex;align-items:baseline;gap:8px;font-family:Archivo;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.rhead .c{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.card.paid{border-left-color:var(--green)}.card.sent{border-left-color:var(--blue)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.off{font-family:Archivo;font-weight:900;font-size:16px;color:var(--hivis)}
.tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);margin-left:4px;vertical-align:2px}
.cl{font-weight:600;margin-top:2px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:9px;padding:10px 14px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn.go{background:var(--green);color:#06210f}.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.5}
.done{font-size:12.5px;color:var(--green);font-weight:600}
.sentx{font-size:12.5px;color:var(--blue);font-weight:600}
.rsel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2);color:var(--text);font-size:13px;font-family:'Spline Sans',sans-serif}
.msg{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.6}
.skel{background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:96px;margin-bottom:9px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (max-width:420px){.stat .n{font-size:20px}.vtab{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html">← Hub</a><div class="who" id="who"></div></div>
  <div class="hdr"><div class="t">Dispatch Team</div><div class="s">Paid · loading confirmed · ready to load</div></div>

  <div class="stats">
    <div class="stat b"><div class="n" id="sAll">—</div><div class="l">To dispatch</div></div>
    <div class="stat g"><div class="n" id="sIns">—</div><div class="l">With installation</div></div>
    <div class="stat a"><div class="n" id="sSup">—</div><div class="l">Supply only</div></div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="row"><div class="search"><span class="mag">🔍</span><input id="q" placeholder="Offer, customer, city…" autocomplete="off"></div>
    <button class="rf" id="rf" title="Refresh">⟳</button></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">—</span></div>
  <div id="list"></div>
</div>

<script>
/* Dispatch Team — read-only. Shows orders whose payment is received (Dispatch Planning) and whose loading was
   confirmed in Team Availability → To Assign → Ready & paid, grouped by region, with "installation needed".
   Backend: the invoice Apps Script (readyList). */
const API = "https://script.google.com/macros/s/AKfycbyU_cHRuQH8aiS8SIKynGIeXoTukfp16SgA9OfKnf83Me7bW2hT8kULPUFw-JB1gEhnTw/exec";
const LS = { cache:'lingel_dt_cache_v1', region:'lingel_dt_region' };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
let rows = [], region = ls.get(LS.region)||'', q = '', loading = false;
try{ const c = JSON.parse(ls.get(LS.cache)||'null'); if(c && Array.isArray(c.rows)) rows = c.rows; }catch(e){}
function setDot(cls, txt){ $('dot').className = 'dot '+(cls||''); $('syncTxt').textContent = txt||''; }

async function load(refresh){
  if(loading) return; loading = true; setDot('busy','Loading…'); render();
  try{
    const r = await fetch(API, {method:'POST', body:new URLSearchParams({action:'readyList', refresh: refresh?'1':''})});
    const t = (await r.text()).trim();
    if(t.charAt(0)==='<') throw new Error('Script returned a sign-in page — set the deployment to “Anyone”.');
    const d = JSON.parse(t); if(!d || d.ok===false) throw new Error(/unknown/i.test((d&&d.error)||'') ? 'Invoice script not updated yet.' : ((d&&d.error)||'Server error'));
    rows = (d.rows||[]).filter(o=>o.stage==='dispatch'); ls.set(LS.cache, JSON.stringify({rows, at:Date.now()}));
    setDot('ok', rows.length+' to dispatch · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setDot('err', (rows.length ? 'Offline · last list · ' : '')+(e.message||e)); }
  finally{ loading = false; render(); }
}
const match = o => !q || [o.offer,o.client,o.sales,o.address,o.region,o.code].join(' ').toLowerCase().includes(q);
function render(){
  $('sAll').textContent = rows.length; $('sIns').textContent = rows.filter(o=>o.install==='Yes').length; $('sSup').textContent = rows.filter(o=>o.install==='No').length;
  const pool = rows.filter(match), cnt = {}; pool.forEach(o=>{ cnt[o.region]=(cnt[o.region]||0)+1; });
  if(region && !cnt[region]) cnt[region]=0;
  const regs = Object.keys(cnt).sort((a,b)=> (a==='Address missing')-(b==='Address missing') || cnt[b]-cnt[a] || a.localeCompare(b));
  $('chips').innerHTML = '<button class="chip'+(region?'':' on')+'" data-r="">All regions<small>'+pool.length+'</small></button>'
    + regs.map(r=>'<button class="chip'+(r===region?' on':'')+'" data-r="'+esc(r)+'">'+esc(r)+'<small>'+cnt[r]+'</small></button>').join('');
  const list = pool.filter(o=>!region || o.region===region), box = $('list');
  if(!rows.length && loading){ box.innerHTML = '<div class="skel"></div><div class="skel"></div>'; return; }
  if(!list.length){ box.innerHTML = '<div class="msg">Nothing to dispatch yet.<br><span style="font-size:12px">Orders appear here once payment is received and loading is confirmed in Team Availability.</span></div>'; return; }
  const g = {}; list.forEach(o=>{ (g[o.region]=g[o.region]||[]).push(o); });
  const order = Object.keys(g).sort((a,b)=> (a==='Address missing')-(b==='Address missing') || g[b].length-g[a].length || a.localeCompare(b));
  box.innerHTML = order.map(r=>'<div class="rsec"><div class="rhead">'+esc(r)+'<span class="c">'+g[r].length+' order'+(g[r].length>1?'s':'')+'</span></div>'
    + g[r].sort((a,b)=>String(a.offer).localeCompare(String(b.offer),undefined,{numeric:true})).map(o=>{
      const ins = o.install==='Yes';
      return '<div class="card sent"><div class="ch"><div><div class="off">#'+esc(o.offer)+'<span class="tag">'+esc(o.dept)+'</span>'+(o.code?'<span class="tag">'+esc(o.code)+'</span>':'')+'</div>'
        + '<div class="cl">'+esc(o.client||'—')+'</div></div>'
        + '<span class="tag" style="font-size:12px;padding:4px 8px;'+(ins?'border-color:var(--green);color:var(--green)':'border-color:var(--amber);color:var(--amber)')+'">'+(ins?'🔧 Installation needed':'📦 Supply only')+'</span></div>'
        + '<div class="meta">📍 '+esc(o.address||'no address')+'<br>🧑‍💼 '+esc(o.sales||'—')+(o.units?' · '+esc(o.units)+' units':'')
        + '<br>✓ Payment '+esc(o.approvedBy||'')+(o.approvedOn?' · '+esc(o.approvedOn):'')+'<br>🚚 Loading confirmed '+esc(o.confirmedBy||'')+(o.confirmedOn?' · '+esc(o.confirmedOn):'')
        + (/^left ready/i.test(o.status)?'<br><span style="color:var(--amber)">No longer “Ready” in the production plan (likely dispatched)</span>':'')+'</div></div>';
    }).join('')+'</div>').join('');
}
$('chips').onclick = e=>{ const c=e.target.closest('.chip'); if(!c) return; region=c.dataset.r; ls.set(LS.region, region); render(); };
$('q').oninput = e=>{ q=e.target.value.trim().toLowerCase(); render(); };
$('rf').onclick = ()=>load(true);
render(); load(false);
setInterval(()=>{ if(!document.hidden) load(false); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(false); });
</script>
</body>
</html>
