<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lingel — Handover Sign-off</title>
<!-- =====================================================================
     ONE-TIME SETUP: paste your hub Apps Script /exec URL between the quotes
     below (the same URL your field apps use). Then host this file anywhere
     (e.g. your Netlify site) as sign.html. Nothing else to configure.
     ===================================================================== -->
<script>const API = "https://script.google.com/macros/s/AKfycbzTi9ihe1YpDEIkX7IdAnDqNl61rU3IDecHUetV4mmwAVezMbJSu_Ruxg4_CJnscVEH/exec";</script>
<style>
  :root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#e2e0d8;--hivis:#111;--accent:#c9a227;--ok:#1f9d55;--bad:#d64545;--paper:#faf9f5}
  *{box-sizing:border-box}
  body{margin:0;background:#ece9e1;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)}
  .hdr{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end}
  .hdr .lg{font-weight:800;font-size:19px;letter-spacing:.5px}
  .hdr .lg small{display:block;font-weight:400;font-size:9px;color:#c9c9c9;letter-spacing:1px}
  .hdr .rt{font-size:11px;color:#e2f14d;font-weight:700;text-align:right}
  .hivisbar{height:3px;background:#e2f14d}
  .pad{padding:18px 20px}
  h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  h2:first-child{margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
  .f .k{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  .f .v{font-size:14px;font-weight:600;margin-top:1px;word-break:break-word}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  th{text-align:left;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);border-bottom:1px solid var(--line);padding:5px 4px}
  td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}.na{color:var(--sub);font-weight:700}
  .pri-High,.pri-Critical{color:var(--bad);font-weight:700}.pri-Medium{color:#b8860b;font-weight:700}.pri-Low{color:var(--ok);font-weight:700}
  .clean{color:var(--ok);font-weight:600;font-size:13px}
  .stars{display:flex;gap:6px;font-size:34px;line-height:1;user-select:none}
  .star{cursor:pointer;color:#d8d4c8;transition:color .1s}
  .star.on{color:var(--accent)}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;background:#fff}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .sigwrap{border:1px dashed #b9b4a6;border-radius:10px;background:#fff;position:relative}
  canvas{display:block;width:100%;height:190px;touch-action:none;border-radius:10px}
  .sighint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c3bfb2;font-size:13px;pointer-events:none}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .clr{background:none;border:none;color:var(--sub);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:6px 0}
  .submit{width:100%;margin-top:22px;background:#111;color:#fff;border:none;border-radius:10px;padding:16px;font-size:15px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
  .submit:disabled{opacity:.45;cursor:not-allowed}
  .note{font-size:11px;color:var(--sub);margin-top:10px;text-align:center;line-height:1.5}
  .msg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:14px}
  .msg .ic{font-size:52px}
  .msg h1{font-size:22px;margin:0}
  .msg p{color:var(--sub);font-size:15px;margin:0;line-height:1.6}
  .msg a.btn{margin-top:8px;background:#111;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:#111;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ack{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#444;line-height:1.55;margin-top:6px}
  .confirm{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;font-size:13.5px;line-height:1.5;color:#2a2a2a}
  .confirm input{width:22px;height:22px;flex-shrink:0;accent-color:var(--ok);margin:0;cursor:pointer}
  .confirm.bad{border-color:var(--bad);background:#fdf2f2}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="msg"><div class="spin"></div><p>Loading your handover…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const APP = $("#app");
const params = new URLSearchParams(location.search);
const TOKEN = (params.get("t") || params.get("token") || "").trim();
// Prefer the backend the app used to create this link; fall back to the baked-in API.
const LINK_API = (params.get("api") || "").trim();
const EP = LINK_API || API;
let DATA = null, stars = 0;

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function screen(icon,title,body,btn){
  APP.innerHTML = `<div class="msg"><div class="ic">${icon}</div><h1>${esc(title)}</h1><p>${body}</p>${btn||""}</div>`;
}

async function post(action, extra){
  const body = new URLSearchParams(Object.assign({action}, extra||{}));
  const r = await fetch(EP, {method:"POST", body});
  return r.json();
}

async function load(){
  if(!EP || EP.indexOf("PASTE_") === 0){
    return screen("⚙️","Not configured yet","This sign-off page hasn't been set up. Please contact Lingel.");
  }
  if(!TOKEN){
    return screen("🔗","Invalid link","This sign-off link is missing its code. Please ask Lingel to resend it.");
  }
  let res;
  try{ res = await post("signGet", {token:TOKEN}); }
  catch(e){ return screen("📶","Connection problem","Couldn't reach the server. Please check your internet and reopen the link."); }

  if(!res.ok){
    if(res.state === "used")    return screen("✅","Already signed","This handover has already been signed and saved. Thank you!", res.url?`<a class="btn" href="${esc(res.url)}" target="_blank">View handover</a>`:"");
    if(res.state === "expired") return screen("⌛","Link expired","This sign-off link is no longer valid. Please ask Lingel to send a fresh one.");
    return screen("❓","Link not found","We couldn't find this sign-off. Please ask Lingel to resend the link.");
  }

  try{ DATA = JSON.parse(res.payload || "{}"); }catch(e){ DATA = {}; }
  DATA.orderNo  = DATA.orderNo  || res.orderNo  || "";
  DATA.customer = DATA.customer || res.customer || "";
  render();
}

function fld(k,v){ return `<div class="f"><div class="k">${esc(k)}</div><div class="v">${esc(v||"—")}</div></div>`; }

function render(){
  const d = DATA;
  const cl = d.checklist || [];
  const clRows = cl.map((c,i)=>{
    const a = c.a||"";
    const cls = a==="Yes"?"pass":a==="No"?"fail":"na";
    const lab = a==="Yes"?"Pass":a==="No"?"Fail":(a||"—");
    return `<tr><td>${i+1}</td><td>${esc(c.q)}</td><td class="${cls}">${lab}</td><td style="color:#6b6b6b">${esc(c.rem||"")}</td></tr>`;
  }).join("");
  const snags = d.snags || [];
  const snagRows = snags.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.pos||"—")}</td><td>${esc(s.desc||"—")}</td><td>${esc(s.loc||"")}</td><td class="pri-${esc(s.priority||"Medium")}">${esc(s.priority||"")}</td></tr>`).join("");

  APP.innerHTML = `
    <div class="hdr">
      <div class="lg">LINGEL<small>WINDOWS &amp; DOORS TECHNOLOGY</small></div>
      <div class="rt">CUSTOMER<br>HANDOVER SIGN-OFF</div>
    </div><div class="hivisbar"></div>
    <div class="pad">
      <div class="ack">Please review your installation handover below. When you're happy, add a quick review and sign at the bottom — your signed copy is saved to Lingel automatically.</div>

      <h2>Customer &amp; Order</h2>
      <div class="grid">
        ${fld("Customer", d.customer)}
        ${fld("Order / Offer No.", d.orderNo)}
        ${fld("Site / Address", d.site)}
        ${fld("Handover Date", d.date)}
        ${fld("Product / Service", d.product)}
        ${fld("Site Engineer", d.engineer)}
      </div>

      <h2>Handover Checklist${cl.length?` &nbsp;<span style="color:#6b6b6b;font-weight:400;text-transform:none;letter-spacing:0">(${d.clYes||0} pass · ${d.clNo||0} fail · ${d.clNa||0} n/a)</span>`:""}</h2>
      ${cl.length?`<table><thead><tr><th>#</th><th>Item</th><th>Status</th><th>Remarks</th></tr></thead><tbody>${clRows}</tbody></table>`:`<div class="clean">Checklist not recorded.</div>`}

      <h2>Snag List / Pending Items ${snags.length?`(${snags.length})`:""}</h2>
      ${snags.length?`<table><thead><tr><th>#</th><th>Position</th><th>Issue</th><th>Location</th><th>Priority</th></tr></thead><tbody>${snagRows}</tbody></table>`:`<div class="clean">✓ No snags or pending items — all clear.</div>`}

      <h2>Keys &amp; Handover</h2>
      <div class="grid">
        ${fld("Keys Handed Over", d.keysGiven)}
        ${fld("No. of Keys", d.keyCount)}
        ${fld("Mesh (Mosquito Net)", d.mesh)}
        ${fld("Key Remarks", d.keyRemarks)}
      </div>
      ${d.mesh==="Hold" && d.meshNote?`<div class="ack" style="margin-top:10px">${esc(d.meshNote)}</div>`:""}

      <h2>Your Review</h2>
      <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}">★</span>`).join("")}</div>
      <div style="font-size:12px;color:#6b6b6b;margin:6px 0 12px" id="rlbl">Tap the stars to rate</div>
      <textarea id="review" rows="3" placeholder="Anything you'd like to add about the installation or service? (optional)"></textarea>

      <h2>Confirmation</h2>
      <label class="confirm" id="confirmWrap">
        <input type="checkbox" id="confirmChk" onchange="if(this.checked)document.getElementById('confirmWrap').classList.remove('bad')">
        <span>I confirm that all the work has been completed professionally. Any incomplete or pending work is recorded in the snag list above.</span>
      </label>

      <h2>Your Signature</h2>
      <input type="text" id="signName" placeholder="Your full name" style="margin-bottom:10px">
      <div class="sigwrap"><canvas id="sig"></canvas><div class="sighint" id="sighint">Sign here with your finger</div></div>
      <div class="row"><button class="clr" onclick="clearSig()">Clear signature</button></div>

      <button class="submit" id="go" onclick="submit()">✓ Confirm &amp; Sign Handover</button>
      <div class="note">By signing, you confirm the handover details above are correct.<br>This is a one-time link — it can be signed once.</div>
    </div>`;

  setupStars();
  setupSig();
}

function setupStars(){
  document.querySelectorAll("#stars .star").forEach(el=>{
    el.onclick = ()=>{
      stars = +el.dataset.n;
      document.querySelectorAll("#stars .star").forEach(s=>s.classList.toggle("on", +s.dataset.n<=stars));
      const labels={1:"Poor",2:"Fair",3:"Good",4:"Very good",5:"Excellent"};
      $("#rlbl").textContent = labels[stars] + " · " + stars + "/5";
    };
  });
}

/* signature pad */
let sigCtx, sigDrawn=false;
function setupSig(){
  const cv = $("#sig");
  const EXP = Math.max(2, Math.ceil(window.devicePixelRatio||1));
  const w = cv.clientWidth||520, h = 190;
  cv.width = w*EXP; cv.height = h*EXP;
  sigCtx = cv.getContext("2d");
  sigCtx.setTransform(EXP,0,0,EXP,0,0);
  sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#101010";
  let drawing=false, pts=[];
  const pt=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  cv.onpointerdown=e=>{drawing=true;pts=[pt(e)];if(!sigDrawn){sigDrawn=true;$("#sighint").style.display="none";}e.preventDefault&&e.preventDefault();};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);pts.push(p);const n=pts.length;
    if(n>=3){const a=pts[n-3],b=pts[n-2],c=pts[n-1];const m1={x:(a.x+b.x)/2,y:(a.y+b.y)/2},m2={x:(b.x+c.x)/2,y:(b.y+c.y)/2};sigCtx.beginPath();sigCtx.moveTo(m1.x,m1.y);sigCtx.quadraticCurveTo(b.x,b.y,m2.x,m2.y);sigCtx.stroke();}
    else{const a=pts[0];sigCtx.beginPath();sigCtx.moveTo(a.x,a.y);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();}
    e.preventDefault&&e.preventDefault();};
  const up=()=>{drawing=false;};
  cv.onpointerup=up;cv.onpointerleave=up;cv.onpointercancel=up;
}
function clearSig(){const cv=$("#sig");sigCtx.clearRect(0,0,cv.width,cv.height);sigDrawn=false;$("#sighint").style.display="flex";}

/* ---- build the signed handover PDF (compact, branded) ---- */
function buildSignedPDF(sigDataUrl){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"a4",orientation:"portrait",compress:true});
  const PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight();
  const M=44, CW=PW-M*2; let y=M;
  const INK="#1c1c1c",SUB="#77716a",LINE="#e2ded5",DARK="#111",HI="#e2f14d",OK="#1f9d55",BAD="#d64545",NA="#9a948b",GOLD="#f5b301";
  const d=DATA;
  const BOTTOM=PH-46;
  function need(h){ if(y+h>BOTTOM){footer();doc.addPage();y=M;head(true);} }
  function footer(){const n=doc.internal.getNumberOfPages();
    doc.setDrawColor(LINE).setLineWidth(.5).line(M,PH-34,PW-M,PH-34);
    doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(SUB);
    doc.text("Lingel Windows & Doors  ·  Customer Handover (Signed)",M,PH-22);
    doc.text("Page "+n,PW-M,PH-22,{align:"right"});}
  function head(cont){doc.setFillColor(DARK).rect(0,0,PW,64,"F");doc.setFillColor(HI).rect(0,64,PW,3.5,"F");
    doc.setFont("helvetica","bold").setFontSize(19).setTextColor("#fff").text("LINGEL",M,34);
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor("#cfcfcf").text("WINDOWS & DOORS TECHNOLOGY",M,48);
    doc.setFont("helvetica","bold").setFontSize(12).setTextColor("#fff").text("CUSTOMER HANDOVER"+(cont?" (CONTD.)":""),PW-M,32,{align:"right"});
    doc.setFont("helvetica","normal").setFontSize(8.5).setTextColor(HI).text(d.formNo||("Order "+(d.orderNo||"")),PW-M,48,{align:"right"});
    y=88;}
  function title(t){need(40);
    doc.setFillColor("#f4f2ec").rect(M,y,CW,24,"F");doc.setFillColor(HI).rect(M,y,4,24,"F");
    doc.setFont("helvetica","bold").setFontSize(10.5).setTextColor(INK).text(t.toUpperCase(),M+12,y+16);
    y+=24+14;}
  const colW=CW/2;
  function breakLong(s,w){
    return String(s).split(" ").map(tok=>{
      if(!tok || doc.getTextWidth(tok)<=w) return tok;
      let out="",cur="";
      for(const ch of tok){ if(doc.getTextWidth(cur+ch)>w && cur){ out+=(out?" ":"")+cur; cur=ch; } else cur+=ch; }
      return out+(out?" ":"")+cur;
    }).join(" ");
  }
  function fields(pairs){
    pairs=pairs.filter(p=>p);
    for(let i=0;i<pairs.length;i+=2){
      const cells=[pairs[i],pairs[i+1]].filter(Boolean);
      const wrapped=cells.map(c=>doc.splitTextToSize(breakLong(String(c[1]==null||c[1]===""?"—":c[1]),colW-18),colW-18).slice(0,3));
      const rowH=Math.max(26,...wrapped.map(w=>w.length*13+13));
      need(rowH);
      cells.forEach((c,ci)=>{const x=M+ci*colW;
        doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB).text(String(c[0]).toUpperCase(),x,y+9);
        doc.setFont("helvetica","bold").setFontSize(10.5).setTextColor(INK).text(wrapped[ci],x,y+22);});
      y+=rowH;
      doc.setDrawColor(LINE).setLineWidth(.4).line(M,y,M+CW,y);
    }
    y+=14;
  }
  // real 5-point star (vector) — renders identically everywhere
  function star(cx,cy,R,filled){
    const inner=R*0.44,pts=[];
    for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,rad=(i%2===0)?R:inner;pts.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)]);}
    const deltas=[];for(let i=1;i<pts.length;i++)deltas.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);
    if(filled){doc.setFillColor(GOLD);doc.lines(deltas,pts[0][0],pts[0][1],[1,1],"F",true);}
    else{doc.setDrawColor("#cfc9bd");doc.setLineWidth(.9);doc.lines(deltas,pts[0][0],pts[0][1],[1,1],"S",true);}
  }
  // green tick inside a rounded box (renders on every device)
  function checkBox(x,y,s){
    doc.setFillColor("#1f9d55");doc.roundedRect(x,y,s,s,2,2,"F");
    doc.setDrawColor("#ffffff");doc.setLineWidth(1.6);
    doc.lines([[s*0.28,s*0.28],[s*0.42,-s*0.5]], x+s*0.22, y+s*0.5, [1,1], "S", false);
  }

  head(false);

  title("Customer & Order Details");
  fields([
    ["Customer",d.customer],["Order / Offer No.",d.orderNo],
    ["Site / Address",d.site],["Contact",d.contact],
    ["Email",d.email],["Handover Date",d.date],
    ["Product / Service",d.product],["Quantity",d.qty],
    ["Installation Date",d.installDate],["Site Engineer",(d.engineer||"")+(d.engPhone?"  ("+d.engPhone+")":"")]
  ]);

  // snags
  const snags=d.snags||[];
  title("Snag List / Pending Items"+(snags.length?" ("+snags.length+")":""));
  if(snags.length){
    const nW=24,pW=84,prW=64,lW=88,dW=CW-nW-pW-lW-prW,hH=22,PAD=6;
    need(hH);
    doc.setFillColor(DARK).rect(M,y,CW,hH,"F");doc.setFont("helvetica","bold").setFontSize(8).setTextColor("#fff");
    doc.text("#",M+PAD,y+14);doc.text("POSITION",M+nW,y+14);doc.text("ISSUE / DEFECT",M+nW+pW,y+14);
    doc.text("LOCATION",M+nW+pW+dW,y+14);doc.text("PRIORITY",M+nW+pW+dW+lW,y+14);y+=hH;
    snags.forEach((s,i)=>{
      const pos=doc.splitTextToSize(String(s.pos||"—"),pW-PAD),des=doc.splitTextToSize(String(s.desc||"—"),dW-PAD),loc=doc.splitTextToSize(String(s.loc||"—"),lW-PAD);
      const h=Math.max(24,pos.length*12+12,des.length*12+12,loc.length*12+12);need(h);
      if(i%2)doc.setFillColor("#f8f6f1").rect(M,y,CW,h,"F");
      doc.setFont("helvetica","normal").setFontSize(9).setTextColor(INK);
      doc.text(String(i+1),M+PAD,y+15);doc.text(pos,M+nW,y+15);doc.text(des,M+nW+pW,y+15);
      doc.setTextColor(SUB).text(loc,M+nW+pW+dW,y+15);
      const pr=s.priority||"Medium",pc=(pr==="High"||pr==="Critical")?BAD:(pr==="Low"?OK:"#c08a00");
      doc.setFont("helvetica","bold").setFontSize(8).setTextColor(pc).text(String(pr).toUpperCase(),M+nW+pW+dW+lW,y+15);
      doc.setDrawColor(LINE).setLineWidth(.4).line(M,y+h,M+CW,y+h);y+=h;});
    y+=16;
  } else { need(22);doc.setFont("helvetica","bold").setFontSize(10).setTextColor(OK).text("No snags or pending items — all clear.",M,y+6);y+=26; }

  // checklist
  const cl=d.checklist||[];
  if(cl.length){
    title("Handover Checklist");
    const PAD=6,numW=26,statW=64,remW=132,descW=CW-numW-statW-remW,hH=22;
    need(hH);
    doc.setFillColor("#f4f2ec").rect(M,y,CW,hH,"F");doc.setFont("helvetica","bold").setFontSize(8).setTextColor(SUB);
    doc.text("#",M+PAD,y+14);doc.text("CHECK ITEM",M+numW,y+14);doc.text("STATUS",M+numW+descW,y+14);doc.text("REMARKS",M+numW+descW+statW,y+14);y+=hH;
    cl.forEach((c,i)=>{
      const lines=doc.splitTextToSize(c.q||"",descW-PAD),rem=(c.rem||"").trim(),remL=rem?doc.splitTextToSize(rem,remW-PAD):[""];
      const h=Math.max(24,lines.length*12+12,remL.length*12+12);need(h);
      if(i%2)doc.setFillColor("#faf9f5").rect(M,y,CW,h,"F");
      doc.setFont("helvetica","normal").setFontSize(9).setTextColor(INK);
      doc.text(String(i+1),M+PAD,y+15);doc.text(lines,M+numW,y+15);
      const col=c.a==="Yes"?OK:c.a==="No"?BAD:NA,lab=c.a==="Yes"?"PASS":c.a==="No"?"FAIL":(c.a||"—");
      doc.setFont("helvetica","bold").setFontSize(8.5).setTextColor(col).text(lab,M+numW+descW,y+15);
      if(rem){doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB).text(remL,M+numW+descW+statW,y+15);}
      doc.setDrawColor(LINE).setLineWidth(.4).line(M,y+h,M+CW,y+h);y+=h;});
    y+=8;
    doc.setFont("helvetica","bold").setFontSize(9).setTextColor(INK).text("Passed "+(d.clYes||0)+"     Failed "+(d.clNo||0)+"     N/A "+(d.clNa||0),M,y+4);y+=22;
  }

  // keys
  title("Keys & Handover");
  fields([
    ["Keys Handed Over",d.keysGiven],["No. of Keys",d.keyCount],
    ["Mesh (Mosquito Net)",d.mesh],["Key Remarks",d.keyRemarks],
    (d.mesh==="Hold"&&d.meshNote)?["Mesh Note",d.meshNote]:null
  ]);

  // customer satisfaction (real stars)
  title("Customer Satisfaction");
  const rlabels={1:"Poor",2:"Fair",3:"Good",4:"Very good",5:"Excellent"};
  need(52);
  doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB).text("CUSTOMER RATING",M,y+6);
  const R=11, gap=30, sy=y+30; let sx=M+R;
  for(let i=1;i<=5;i++){ star(sx,sy,R,i<=stars); sx+=gap; }
  if(stars>0){ doc.setFont("helvetica","bold").setFontSize(13).setTextColor(INK).text(rlabels[stars]+"  ("+stars+"/5)", M+5*gap+R, sy+5); }
  else { doc.setFont("helvetica","italic").setFontSize(11).setTextColor(SUB).text("Not rated", M+5*gap+R, sy+5); }
  y=sy+R+18;
  const rev=($("#review").value||"").trim();
  if(rev){need(40);
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB).text("CUSTOMER REVIEW",M,y+4);y+=14;
    doc.setFont("helvetica","italic").setFontSize(11).setTextColor(INK);
    const rl=doc.splitTextToSize('"'+rev+'"',CW-8);need(rl.length*14+6);doc.text(rl,M+4,y+4);y+=rl.length*14+12;}

  // site photo (customer selfie), if captured on the handover
  if(d.sitePhoto){
    title("Site Photo");
    try{
      const props=doc.getImageProperties(d.sitePhoto);
      const w=Math.min(CW,300), h=w*props.height/props.width;
      need(h+8);
      doc.addImage(d.sitePhoto,"JPEG",M,y,w,h);
      y+=h+14;
    }catch(e){}
  }

  // acknowledgement
  need(150);
  title("Acknowledgement");
  // customer confirmation statement with a tick
  need(40);
  checkBox(M, y-2, 15);
  doc.setFont("helvetica","bold").setFontSize(9.5).setTextColor(INK);
  const confLines=doc.splitTextToSize("Customer confirms all work has been completed professionally. Any incomplete or pending work is recorded in the snag list above.", CW-26);
  doc.text(confLines, M+24, y+9);
  y+=Math.max(24, confLines.length*12+10);
  const sigW=(CW-24)/2,sigH=84,sigY=y;
  const custName=($("#signName").value||d.customer||"Customer").trim();
  [["Customer Signature",sigDataUrl,custName],["Site Engineer / Supervisor",d.engineerSig||"",d.engineer||""]].forEach((b,idx)=>{
    const x=M+idx*(sigW+24);
    doc.setDrawColor(LINE).setLineWidth(.8).roundedRect(x,sigY,sigW,sigH,4,4,"S");
    if(b[1]){try{doc.addImage(b[1],"PNG",x+8,sigY+8,sigW-16,sigH-30);}catch(e){}}
    doc.setDrawColor("#555").setLineWidth(.5).line(x+12,sigY+sigH-20,x+sigW-12,sigY+sigH-20);
    doc.setFont("helvetica","bold").setFontSize(8.5).setTextColor(INK).text(b[0],x+12,sigY+sigH-8);
    if(b[2]){doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB).text(b[2],x+sigW-12,sigY+sigH-8,{align:"right"});}
  });
  y=sigY+sigH+18;
  need(16);doc.setFont("helvetica","normal").setFontSize(8).setTextColor(SUB);
  doc.text("Digitally signed by the customer on "+new Date().toLocaleString(),M,y+2);y+=14;

  footer();
  return doc;
}

let submitting=false;
async function submit(){
  if(submitting) return;
  const name=($("#signName").value||"").trim();
  const confirmed=$("#confirmChk") && $("#confirmChk").checked;
  if(!confirmed){
    const w=$("#confirmWrap"); if(w){ w.classList.add("bad"); w.scrollIntoView({behavior:"smooth",block:"center"}); }
    alert("Please tick the confirmation box before signing.");
    return;
  }
  if(!sigDrawn){ alert("Please add your signature before confirming."); return; }
  if(!name){ alert("Please type your full name."); return; }
  submitting=true;
  const go=$("#go"); go.disabled=true; go.textContent="Saving…";
  try{
    const sigUrl = $("#sig").toDataURL("image/png");
    const doc = buildSignedPDF(sigUrl);
    const b64 = doc.output("datauristring").split(",")[1];
    const name_pdf = "Handover_Signed_" + String(DATA.orderNo||"form").replace(/[^\w-]+/g,"-") + ".pdf";
    const res = await post("signSubmit", {
      token: TOKEN, data: b64, name: name_pdf,
      stars: String(stars||""), review: ($("#review").value||"").trim(), signName: name
    });
    if(res.ok){
      const reviewLink = DATA.reviewLink || "";
      let btn = res.url ? `<a class="btn" href="${esc(res.url)}" target="_blank">View signed handover</a>` : "";
      if(stars>=5 && reviewLink) btn += `<a class="btn" style="background:#c9a227;margin-top:10px" href="${esc(reviewLink)}" target="_blank">★ Leave us a Google review</a>`;
      screen("✅","Thank you!","Your handover is signed and saved with Lingel. A copy has been kept on file."+(stars>=5&&reviewLink?"<br><br>We'd love a quick Google review!":""), btn);
      if(stars>=5 && reviewLink){ setTimeout(()=>{ try{ window.open(reviewLink,"_blank"); }catch(e){} }, 900); }
    } else if(res.state==="used"){
      screen("✅","Already signed","This handover was already signed. Thank you!", res.url?`<a class="btn" href="${esc(res.url)}" target="_blank">View handover</a>`:"");
    } else if(res.state==="expired"){
      screen("⌛","Link expired","This sign-off link has expired. Please ask Lingel to resend it.");
    } else {
      go.disabled=false; go.textContent="✓ Confirm & Sign Handover"; submitting=false;
      alert("Couldn't save: "+((res&&res.error)||"please try again"));
    }
  }catch(e){
    go.disabled=false; go.textContent="✓ Confirm & Sign Handover"; submitting=false;
    alert("Something went wrong saving your signature. Please check your internet and try again.");
  }
}

load();
</script>
