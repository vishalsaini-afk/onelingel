/* Manage popup: which quotation / production sheets are already saved for the booked offer (all its parts) */
function woFind(offer){
  const w=woGet(offer); if(w) return w;
  const want=LD.parts(offer), all=woAll();
  return Object.values(all).find(x=>{ const p=LD.parts(x.offer); return p.base===want.base && (!want.parts.length||!p.parts.length||p.parts.some(q=>want.parts.includes(q))); })||null;
}
async function showSavedDocs(offer, box, done){
  if(!box) return;
  box.innerHTML='<div class="pk-row busy"><div class="tk">…</div><div class="tx">Checking saved documents for #'+esc(offer)+'…</div></div>';
  const want=LD.parts(offer); let list=[], offline=false, errTxt='';
  const same=x=>{ const p=LD.parts(x.offer); return p.base===want.base && (!want.parts.length||!p.parts.length||p.parts.some(q=>want.parts.includes(q))); };
  try{
    const r=await fetch(LD.api(),{method:'POST',body:new URLSearchParams({action:'docList'})});
    const d=JSON.parse((await r.text()).trim()||'{}');
    if(d&&d.ok) list=(d.list||[]).filter(same); else errTxt=(d&&d.error)||'library did not answer';
  }catch(e){ offline=!navigator.onLine; errTxt=offline?'offline':'library not reachable'; }
  /* also ask for each part by its own number (68499/25, 68499/28 …) — both kinds */
  if(!errTxt){
    const asks=want.parts.length?want.parts.map(x=>want.base+'/'+x):[want.base];
    for(const o of asks){ if(list.some(x=>cleanOffer(x.offer).toUpperCase()===o.toUpperCase())) continue;
      try{ const hq=await LD.has(o,'quotation'); if(hq&&hq.kinds&&hq.kinds.length) list.push({offer:o,kinds:hq.kinds}); }catch(e){} }
  }
  list.sort((a,b)=>(+LD.parts(a.offer).parts[0]||0)-(+LD.parts(b.offer).parts[0]||0));
  const w=woFind(offer), inv=w&&(w.invNo||w.woNo);
  const kindTxt=k=>(k||[]).map(x=>x==='production'?'Production sheet':'Quotation').join(' + ')||'Document';
  let html=list.map(x=>'<div class="pk-row"><div class="tk">✓</div><div class="tx"><b>#'+esc(x.offer)+'</b> · '+kindTxt(x.kinds)+' · uploaded'
      +'<span>'+(x.customer?esc(x.customer)+' · ':'')+'saved in library</span></div></div>').join('');
  const got=[]; list.forEach(x=>LD.parts(x.offer).parts.forEach(q=>{ if(!got.includes(q)) got.push(q); }));
  const miss=want.parts.filter(q=>!got.includes(q));
  if(!list.length) html='<div class="pk-row none"><div class="tk">!</div><div class="tx"><b>'+(errTxt?'Could not check':'Not uploaded yet')+'</b>'
      +'<span>'+(errTxt?'Could not check the library ('+esc(errTxt)+') — try again when online':'No quotation or production sheet saved for #'+esc(offer))+'</span></div></div>';
  else if(miss.length) html+='<div class="pk-row none"><div class="tk">!</div><div class="tx"><b>Part /'+miss.join(', /')+' not uploaded</b><span>Tap + to add it</span></div></div>';
  if(inv) html+='<div class="pk-row"><div class="tk">✓</div><div class="tx"><b>Invoice '+esc(inv)+'</b> · made'
      +'<span>#'+esc(w.offer)+' · '+(+w.sqft||0).toFixed(2)+' sq.ft'+(w.parts?' · '+w.parts.length+' parts':'')+'</span></div></div>';
  box.innerHTML=html;
  if(done) done(list);
}

async function workOrderPdf(w){
  await ensurePdfLib();
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:760px;background:#fff;z-index:-1';
  holder.innerHTML=workOrderHTML(w); document.body.appendChild(holder);
  await new Promise(r=>setTimeout(r,80));
  const cv=await window.html2canvas(holder,{scale:2.5,backgroundColor:'#ffffff'});
  document.body.removeChild(holder);
  const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
  const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
  const pxPerPage=Math.floor(cv.width*ph/pw);           // long position lists flow onto extra pages
  for(let y=0,pg=0;y<cv.height;y+=pxPerPage,pg++){
    const h=Math.min(pxPerPage,cv.height-y), c=document.createElement('canvas'); c.width=cv.width; c.height=h;
    c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
    if(pg) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/cv.width,undefined,'FAST');
  }
  return pdf;
}
function contractorInfo(name){
  const r=rows.find(x=>x.name===name)||{};
  const code=r.code||String(name).split(/\s+/).map(s=>s[0]).join('').toUpperCase();
  return {code, phone:r.phone||'', addr:r.addr||''};
}
/* Real invoice number from the Invoice sheet (same as the Contractor Invoice app),
   logged once to the Invoices tab. Re-downloads reuse the same number. */
async function ensureInvoiceNo(w){
  /* same contractor + same order already has a booking invoice (this phone or another) → keep that number */
  if(!w.invNo){ try{ const r=await fetch(INVOICE_EXEC+'?action=invFind&code='+encodeURIComponent(w.code)+'&contractor='+encodeURIComponent(w.contractor)+'&offer='+encodeURIComponent(w.offer)+'&t='+Date.now(),{cache:'no-store'});
      const d=await r.json(); if(d&&d.ok&&d.invoiceNo) w.invNo=d.invoiceNo; }catch(e){} }
  if(!w.invNo){
    let next=null;
    try{ const r=await fetch(INVOICE_EXEC+'?action=next&contractor='+encodeURIComponent(w.code)+'&t='+Date.now(),{cache:'no-store'}); const d=await r.json();
         if(d&&typeof d.next==='number') next=d.next; }catch(e){}
    if(next==null) next=parseInt(localStorage.getItem('linv_seq_'+w.code)||'0',10)+1;   // offline fallback
    w.invNo='INV-'+w.code+'-'+String(next).padStart(3,'0');
    localStorage.setItem('linv_seq_'+w.code,String(next));
  }
  w.woNo=w.invNo;
  if(w._logged){ woPut(w); return; }
  const inst=w.sqft*w.rate;
  const payload={action:'log',timestamp:new Date().toISOString(),contractor:w.contractor,code:w.code,invoiceNo:w.invNo,date:w.date,
    billTo:(WO_CO[w.billTo]||WO_CO.lingel).n,workType:'Regular Installation',offerNo:w.offer,customer:w.customer||'',
    totalSqft:Number(w.sqft.toFixed(2)),rate:w.rate,installation:inst,additional:0,grandTotal:inst,charges:[],
    notes:'Raised at booking - Team '+w.team+(w.by?(' - by '+w.by):'')};
  /* the sheet updates the existing row instead of adding a new one, and may hand back a different number */
  try{ const r=await fetch(INVOICE_EXEC,{method:'POST',body:new URLSearchParams(Object.assign({},payload,{charges:'[]'}))}); const d=JSON.parse((await r.text()).trim()||'{}');
       if(d&&d.ok){ w._logged=true; if(d.invoiceNo){ w.invNo=d.invoiceNo; w.woNo=d.invoiceNo; } } }
  catch(e){ try{ await fetch(INVOICE_EXEC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }catch(x){} }
  woPut(w);
}
async function makeWorkOrder(w, opts){
  opts=opts||{};
  await ensureInvoiceNo(w);
  w.kyc = await fetchKyc(w.code, w.contractor) || w.kyc || null;
  const fname='Invoice_'+w.woNo.replace(/[^\w-]+/g,'-')+'.pdf';
  const pdf=await workOrderPdf(w);
  pdf.save(fname);
  try{   // same per-order Drive folder as the other apps (hub action=upload)
    const dataUri=pdf.output('datauristring'); const b64=dataUri.slice(dataUri.indexOf(',')+1);
    const hub=LD.api();
    if(hub){ await fetch(hub,{method:'POST',body:new URLSearchParams({action:'upload',folder:w.offer,name:fname,mime:'application/pdf',data:b64})}); }
  }catch(e){ console.warn('WO Drive upload failed',e); }
}
/* called from the Book popup after the team is booked/planned */
async function afterBookWithQuote(q, b){
  const ci=contractorInfo(b.name), svc=b.service, rate=WO_RATES[svc]||45;
  const w={woNo:'', offer:b.offer, customer:b.project||q.client, city:b.city,
    salesperson:b.sales, contractor:b.name, team:b.team, phone:ci.phone, addr:ci.addr, code:ci.code, by:SUP,
    date:new Date(b.date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),
    service:svc, rate, billTo:b.billTo, items:q.items, sqft:q.total, parts:q.parts?q.parts.map(p=>({offer:p.offer,sqft:p.sqft})):null};
  woPut(w);
  setDot('dot','syncTxt','busy','Saving document & invoice…');
  let qOk=true;
  let dSkip=false;
  if(q.parts){   // split order: save each part's PDF under its own Offer No (upload-once applies per part)
    for(const p of q.parts){ if(p.fromLib) continue;
      try{ await LD.save(p.file,{offer:p.offer,kind:p.kind,customer:w.customer,site:b.project,salesperson:b.sales,positions:String(p.positions),sqft:p.sqft.toFixed(2),by:SUP,app:'Team Availability'}); }catch(e){ qOk=false; } }
  } else
  try{ if(!q.fromLib){ const dr=await LD.save(q.file,{offer:b.offer,kind:q.kind,customer:w.customer,site:b.project,salesperson:b.sales,positions:String(q.items.length),sqft:q.total.toFixed(2),items:q.kind==='quotation'?q.items.map(i=>({ref:i.ref,w:Math.round(i.w||0),h:Math.round(i.h||0),qty:1,sqft:+(+i.sqft||0).toFixed(2)})):undefined,by:SUP,app:'Team Availability'}); dSkip=!!(dr&&dr.skipped); } }
  catch(e){ qOk=false; console.warn(e); }
  if(!b.makeInvoice){ setDot('dot','syncTxt',qOk?'ok':'err', qOk?(dSkip?'Quotation was already saved · no invoice made':'Quotation saved · no invoice made (use 📄 Invoice when needed)'):'Quotation NOT saved online (kept on phone)'); return; }
  try{ await makeWorkOrder(w); setDot('dot','syncTxt',qOk?'ok':'err', qOk?('Invoice '+w.woNo+' ready · '+(dSkip?'document was already saved — not uploaded again':'document saved')):('Invoice '+w.woNo+' ready · document NOT saved online ('+'kept on phone)')); }
  catch(e){ setDot('dot','syncTxt','err','Invoice failed: '+(e.message||e)); }
}
/* "Work order" button on a booked team */
/* PDF uploaded AFTER the team was booked: read it, save it once to the library, raise the invoice
   for this booking (same rules as booking with the PDF). An invoice already made for the offer is not duplicated. */
async function uploadForBooked(name,team,tm,q){
  const info=document.getElementById('mUpInfo'); const say=(t,c)=>{ if(info){ info.className='qinfo'+(c?' '+c:''); info.textContent=t; } };
  if(!q.parts) q.parts=null;
  const booked=cleanOffer(tm.offer||''), pdfOffer=cleanOffer(q.offer||'');
  let offer=booked||pdfOffer;
  if(!offer){ say('⚠ No Offer No on this booking or in the PDF','err'); return; }
  if(booked && pdfOffer && q.parts && LD.parts(booked).base===LD.parts(pdfOffer).base) offer=pdfOffer;   // parts of the same order → invoice for all of them
  else if(booked && pdfOffer && booked.toUpperCase()!==pdfOffer.toUpperCase()){
    if(!confirm('This PDF is for #'+pdfOffer+', but Team '+team+' is booked for #'+booked+'.\n\nUse it for this booking anyway?')){ say('Cancelled — PDF is for a different order','err'); return; }
  }
  const prev=woFind(offer);
  if(prev && prev.invNo && !confirm('Invoice '+prev.invNo+' already exists for #'+offer+'.\n\nOK = update '+prev.invNo+' with this PDF (same number)\nCancel = keep it as it is (just saves the PDF)')){
    try{ const each=q.parts?q.parts:[{offer,kind:q.kind,positions:q.items.length,sqft:q.total,file:q.file,fromLib:q.fromLib}]; let n=0;
      for(const pt of each){ if(pt.fromLib) continue; const r=await LD.save(pt.file,{offer:pt.offer||offer,kind:pt.kind,customer:q.client,salesperson:q.sales,site:q.city,positions:String(pt.positions),sqft:(+pt.sqft).toFixed(2),app:'Team Availability'}); if(!(r&&r.skipped)) n++; }
      say(n?'✓ PDF saved — kept existing invoice '+prev.invNo:'✓ Already in the library — kept existing invoice '+prev.invNo,'ok'); }catch(e){ say('⚠ '+e.message,'err'); }
    return;
  }
  closeModal();
  await afterBookWithQuote(q,{name,team,offer,project:tm.project||q.client,city:tm.city||q.city,sales:tm.salesperson||q.sales,
    date:TODAY(),service:q.service,billTo:q.party==='person'?'fensterbau':'lingel',makeInvoice:true});
}
async function reprintWorkOrder(name,team,offer){
  let w=woGet(offer);
  if(!w){
    try{
      setDot('dot','syncTxt','busy','Loading quotation #'+offer+'…');
      const res=await LD.load(offer,'production'); const q=await parseQuotationTA(res.file); const ci=contractorInfo(name);
      w={woNo:'',offer,customer:res.meta.customer||q.client,city:q.city||taCity(res.meta.site)||'',salesperson:q.sales||taSales(res.meta.salesperson)||'',
        contractor:name,team,phone:ci.phone,addr:ci.addr,code:ci.code,by:SUP,date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),
        service:q.service,rate:WO_RATES[q.service],billTo:q.party==='person'?'fensterbau':'lingel',items:q.items,sqft:q.total};
      woPut(w);
    }catch(e){ setDot('dot','syncTxt','err','No quotation saved for #'+offer); alert('No quotation or production sheet saved yet for #'+offer+'.\n\nUpload it in any app (SiteLog, Offer Upload, QR Quality…) and tap this again — the invoice is made from it.'); return; }
  }
  w.contractor=name; w.team=team;
  try{ await makeWorkOrder(w); setDot('dot','syncTxt','ok','Invoice '+w.woNo+' downloaded'); }
  catch(e){ setDot('dot','syncTxt','err','Invoice failed: '+(e.message||e)); }
}
