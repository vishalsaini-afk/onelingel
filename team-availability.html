<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>Lingel — Team Availability</title>
<meta name="theme-color" content="#13161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#ffce1f;--green:#22c55e;--red:#ef4444;--blue:#5b9bd5;--amber:#f0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Spline Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.home:active{background:var(--panel-2)}
.who{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--hivis);font-family:'Archivo Narrow';text-transform:uppercase;letter-spacing:.03em;display:block}
.hdr{padding-bottom:14px;border-bottom:2px solid var(--line);margin-bottom:14px}
.hdr .t{font-family:Archivo;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.hdr .s{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.vtabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.vtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:11px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.vtab.on{background:var(--hivis);color:#111}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat.g{border-left:4px solid var(--green)}.stat.r{border-left:4px solid var(--red)}.stat.n{border-left:4px solid var(--amber)}
.stat .n{font-family:Archivo;font-weight:900;font-size:23px;line-height:1}
.stat.g .n{color:var(--green)}.stat.r .n{color:var(--red)}.stat.n .n{color:var(--amber)}
.stat .l{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px 11px 36px;font-size:15px;background:var(--panel-2);color:var(--text);font-family:'Spline Sans',sans-serif}
.search input:focus{outline:2px solid var(--hivis);outline-offset:-1px}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.rf{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
.rf:active{background:var(--panel-2)}.rf.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;min-height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.dot.busy{background:var(--hivis);box-shadow:0 0 0 3px rgba(255,206,31,.18)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .lg{background:var(--green)}.legend .lr{background:var(--red)}.legend .ln{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vtab[data-view=un]{white-space:nowrap}
.vbadge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:16px;letter-spacing:0;vertical-align:1px}
.unbar{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.unbar .seg{margin:0}.unbar .search{flex:1}
.unrow{display:flex;gap:8px;align-items:center}
.uncard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.uncard:active{background:var(--panel-2)}
.uncard.has-p{border-left-color:var(--amber);background:linear-gradient(180deg,rgba(240,166,58,.10),rgba(240,166,58,.02))}
.uncard.closed{border-left-color:var(--muted);opacity:.6}
.undays.cl{background:var(--panel-2);color:var(--muted)}
.closebtn{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px dashed var(--muted);background:transparent;color:var(--text);font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.closebtn:active{background:var(--panel-2)}
.uncard.done{border-left-color:var(--green);cursor:default;opacity:.85}
.unh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.unoff{font-weight:800;color:var(--hivis);font-size:15px}
.uncl{font-size:14px;margin-top:2px}
.unmeta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.undays{font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(239,68,68,.15);color:#fda4a4;white-space:nowrap}
.undays.ok{background:rgba(34,197,94,.15);color:#86efac}
.pwarn{margin-top:8px;border:1px dashed var(--amber);border-radius:9px;padding:7px 9px;font-size:12.5px;color:#fcd9a0;background:rgba(240,166,58,.07)}
.pwarn b{color:var(--amber)}
.pwarn ul{margin:4px 0 0 16px;padding:0}.pwarn li{margin:2px 0}
.pdep{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);margin-left:4px}
.asgl{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin-top:6px}
.asgc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2)}
.asgc .nm{font-weight:800;font-size:14px;margin-bottom:6px}
.asgt{display:flex;flex-wrap:wrap;gap:6px}
.asgt button{border:1px solid var(--line);border-left:4px solid var(--green);background:rgba(34,197,94,.10);color:var(--text);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.asgt button.bk{border-left-color:var(--red);background:transparent;color:var(--muted)}
.asgt button.na{border-left-color:var(--amber);background:transparent;color:var(--muted);cursor:not-allowed}
.asgt small{display:block;font-size:10.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px}
.card .nm{font-family:Archivo;font-weight:700;font-size:16px;line-height:1.15;word-break:break-word}
.card .role{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.teams{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.team{flex:1 1 46%;min-width:98px;border:1px solid var(--line);border-left:4px solid var(--red);background:var(--panel-2);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s,border-color .15s}
.team:active{transform:scale(.96)}
.team.avail{border-left-color:var(--green);background:linear-gradient(180deg,rgba(34,197,94,.13),rgba(34,197,94,.04))}
.team.na{border-left-color:var(--amber);background:rgba(240,166,58,.06)}
.team .tl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.team .ts{font-family:Archivo;font-weight:700;font-size:13px;margin-top:3px}
.team.avail .ts{color:#86efac}.team:not(.avail):not(.na) .ts{color:#fda4a4}.team.na .ts{color:var(--amber)}
.team .to{font-size:10px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono';line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.ahead{border-left-color:var(--amber);background:linear-gradient(180deg,rgba(240,166,58,.10),rgba(34,197,94,.03))}
.team .tnext{margin-top:6px;display:block;font-family:'JetBrains Mono';font-size:9.5px;font-weight:600;color:#1a1400;background:var(--amber);border-radius:6px;padding:3px 6px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.team .tnext:active{filter:brightness(.92)}
.uplist{display:flex;flex-direction:column;gap:8px}
.uprow{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:9px 10px}
.upinfo{flex:1;min-width:0}
.upwhen{font-family:'JetBrains Mono';font-size:11px;color:var(--amber);font-weight:700}
.upwhen .updd{color:var(--muted);font-weight:400;font-size:10px}
.upsite{font-family:Archivo;font-weight:700;font-size:14px;margin-top:2px}
.upmeta{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upacts{display:flex;gap:6px;flex-shrink:0}
.upbtn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:7px 9px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
.upbtn.upre{border-color:var(--hivis);color:var(--hivis)}
.upbtn.updel{border-color:var(--red);color:#fda4a4;min-width:34px}
.upempty{color:var(--muted);text-align:center;padding:18px 8px;font-size:13px}
.team.ahead .to::after{content:' · booked ahead';color:var(--amber)}
.held{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.heldhd{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.heldhd .hchev{display:inline-block;transition:transform .15s;font-size:11px}
.held.open .heldhd .hchev{transform:rotate(90deg)}
.heldhd .hcnt{font-family:'JetBrains Mono';font-size:9.5px;background:rgba(240,166,58,.15);color:var(--amber);border-radius:20px;padding:1px 7px}
.held .hitem{display:none}
.held.open .hitem{display:flex;margin-top:8px}
.hitem{align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:9px 10px}
.hinfo{flex:1;min-width:0}
.hoffer{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow2{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow2 .hk{font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);opacity:.75;margin-right:3px}
.hacts{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.hbtn{border:none;border-radius:9px;padding:9px 11px;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.hbtn.hresume{background:var(--hivis);color:#111}
.hbtn.hcancel{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hbtn:active{transform:scale(.94)}
.team.busy{opacity:.5;pointer-events:none}
.thead{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.swwrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.swlbl{font-family:'JetBrains Mono';font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.swlbl.ond{color:#86efac}
.swlbl.onl{color:var(--amber)}
.sw{position:relative;width:46px;height:26px;border-radius:26px;background:var(--panel);border:1px solid var(--line);cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw.on{background:rgba(34,197,94,.22);border-color:var(--green)}
.sw.on::after{transform:translateX(20px);background:var(--green)}
.sw.busy{opacity:.5;pointer-events:none}
/* reports */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
.kc.a{border-left:4px solid var(--red)}.kc.o{border-left:4px solid var(--hivis)}.kc.c{border-left:4px solid var(--green)}.kc.t{border-left:4px solid var(--blue)}
.kc .n{font-family:Archivo;font-weight:900;font-size:26px;line-height:1}
.kc.a .n{color:#fda4a4}.kc.o .n{color:var(--hivis)}.kc.c .n{color:#86efac}.kc.t .n{color:#a9cdf0}
.kc .l{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:7px;line-height:1.4}
.kc .subv{font-size:11px;color:var(--muted);margin-top:3px}
.rtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px}
.rtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:8px;padding:9px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.rtab.on{background:var(--hivis);color:#111}
.row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.row.act{border-left:4px solid var(--red)}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rname{font-family:Archivo;font-weight:700;font-size:15px}
.rmeta{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rsub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.rsub b{color:var(--text);font-weight:600}
.pill{display:inline-block;font-family:'JetBrains Mono';font-weight:700;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-left:6px}
.pill.active{background:rgba(239,68,68,.16);color:#fda4a4}.pill.released{background:rgba(34,197,94,.15);color:#86efac}.pill.reassigned{background:rgba(255,206,31,.15);color:var(--hivis)}
.ut{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.uthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.utname{font-family:Archivo;font-weight:700;font-size:14.5px}
.utnums{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}.utnums .on{color:#fda4a4}
.bar{height:7px;background:var(--panel-2);border-radius:4px;margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--hivis),#ffd956);border-radius:4px}
.utfoot{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted)}.utfoot b{color:var(--text)}
.ogrp{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--panel-2)}
.ooffer{font-family:Archivo;font-weight:900;font-size:15px;color:var(--hivis)}
.oproj{font-size:12px;color:var(--muted);margin-top:2px}
.ocount{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-transform:uppercase}
.oline{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.oline .who2{color:var(--text)}
.oline .when{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6}
.msg.err{color:#fda4a4}
.msg button{margin-top:14px;background:var(--hivis);color:#111;border:none;border-radius:8px;padding:10px 22px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.skel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:100px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
.foot-note{text-align:center;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:26px;opacity:.65}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--hivis);border-radius:16px;padding:22px 20px;max-width:380px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.mbox.rel{border-top-color:var(--red)}.mbox.na{border-top-color:var(--amber)}
.mttl{font-family:Archivo;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.03em;line-height:1.2;margin-bottom:4px}
.msub{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.fd{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fd label{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fd input{border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;background:var(--panel-2);color:var(--text);width:100%;font-family:'Spline Sans',sans-serif}
.fd input:focus{outline:2px solid var(--hivis);outline-offset:-1px}
.qup{flex:1;width:100%;border:1px dashed var(--hivis);background:rgba(255,206,31,.08);color:var(--hivis);border-radius:8px;padding:11px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}

<script>
const INVOICE_EXEC = "https://script.google.com/macros/s/AKfycbyU_cHRuQH8aiS8SIKynGIeXoTukfp16SgA9OfKnf83Me7bW2hT8kULPUFw-JB1gEhnTw/exec";
const API = (function(){ if(INVOICE_EXEC && INVOICE_EXEC.indexOf('script.google.com')>=0) return INVOICE_EXEC; try{ var a=localStorage.getItem('lingel_api'); if(a) return a; }catch(e){} return INVOICE_EXEC; })();
const POLL_BOARD=8000, CACHE_KEY='lingel_teams_cache_v5';
const SUP=(function(){ try{ var s=JSON.parse(localStorage.getItem('lingel_supervisor')||'null'); return (s&&s.name)?s.name:''; }catch(e){ return ''; } })();
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.getElementById('who').innerHTML = SUP ? '<span>Signed in as</span><b>'+esc(SUP)+'</b>' : '<b style="color:var(--muted)">Not signed in</b>';

let view='board', rows=[], bookings=[];
const pending=new Map();
const heldOpen=new Set();
let filter='', rfilter='', rtab='active';
let pollTimer=null, firstLoad=true, bookingsLoaded=false;

/* ===== DAY-PLAN state ===== */
const POLL_PLAN=20000;
const PLAN_KEY='lingel_dayplan_v1', SALES_KEY='lingel_salespeople_v1', SUP_KEY='lingel_supervisors_v1';
const DEFAULT_SALES=['Ravish','Digvijay','Krishna','Praphul','Bir','Vivek','Rohan','Suraj','Abhishek','Vikas'];
// Region → NCR salespeople. Anyone not in this set counts as "Others".
const NCR_SALES=['Ravish','Digvijay','Rohan','Suraj','Abhishek','Praphul','Ziaaz Homes','Vivek','Krishna','Vikas'];
const NCR_SET=new Set(NCR_SALES.map(s=>s.trim().toLowerCase()));
let planSalesList=[];
try{ const raw=localStorage.getItem('lingel_dayplan_sales_multi'); if(raw) planSalesList=JSON.parse(raw)||[];
     else { const old=localStorage.getItem('lingel_dayplan_sales'); if(old && old!=='all') planSalesList=[old]; } }catch(e){ planSalesList=[]; }
function saveSalesSel(){ try{ localStorage.setItem('lingel_dayplan_sales_multi', JSON.stringify(planSalesList)); }catch(e){} }
function normSales(x){ return String(x||'').trim().toLowerCase(); }
function salesLabel(){ if(!planSalesList.length) return 'All salespeople'; if(planSalesList.length===1) return planSalesList[0]; if(planSalesList.length<=3) return planSalesList.join(', '); return planSalesList.length+' salespeople'; }
function regionOf(sales){ return NCR_SET.has(String(sales||'').trim().toLowerCase())?'NCR':'Others'; }
function inRegion(sales){ if(!planSalesList.length) return true; const n=normSales(sales); return planSalesList.some(x=>normSales(x)===n); }
let plans=[], supList=[], salesSet=new Set(), supDay='tomorrow';
let deletedPlanIds=new Set(); try{ deletedPlanIds=new Set(JSON.parse(localStorage.getItem('lingel_plan_tombstones_v1')||'[]')); }catch(e){}
let carrySkip=new Set(); try{ carrySkip=new Set(JSON.parse(localStorage.getItem('lingel_carry_skip_v1')||'[]')); }catch(e){}
let healedOffers=new Set(); // ids whose corrupted offer we've re-saved this session (no re-push loop)
function saveCarrySkip(){ try{ localStorage.setItem('lingel_carry_skip_v1', JSON.stringify([...carrySkip].slice(-500))); }catch(e){} }
function carryKey(c,t){ return 'c|'+c+'|'+t+'|'+TOMORROW(); }
function saveTombstones(){ try{ localStorage.setItem('lingel_plan_tombstones_v1', JSON.stringify([...deletedPlanIds].slice(-500))); }catch(e){} }
function dateOf(sel){ return sel==='today'?TODAY():TOMORROW(); }
function DAYAFTER(){ const d=new Date(); d.setDate(d.getDate()+2); return isoDate(d); }
function planDateField(sel,dateVal){ sel=sel||'tomorrow'; const dmin=DAYAFTER(); const val=dateVal||dmin;
  return '<div class="fd"><label>Plan for</label>'+seg('segDate',[{v:'today',l:'Today'},{v:'tomorrow',l:'Tomorrow'},{v:'later',l:'Later…'}],sel)
    +'<input type="date" id="segDateLater" min="'+dmin+'" value="'+val+'" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;'+(sel==='later'?'':'display:none')+'"></div>'; }
function wirePlanDate(){ const sg=document.getElementById('segDate'), inp=document.getElementById('segDateLater'); if(!sg||!inp) return; sg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ inp.style.display=(b.dataset.val==='later')?'':'none'; })); }
function chosenPlanDate(){ const d=segVal('segDate')||'tomorrow'; if(d==='later'){ const el=document.getElementById('segDateLater'); return (el&&el.value)||DAYAFTER(); } return dateOf(d); }
function upcomingItems(){ return plans.filter(p=>(p.kind==='team'||p.kind==='supervisor') && p.date>TOMORROW() && inRegion(p.salesperson)).sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0)); }
function upcomingSection(){ const items=upcomingItems(); if(!items.length) return '';
  let h='<div class="psec"><div class="psectt">📅 Upcoming — later dates <span class="cnt">'+items.length+'</span></div><div class="ptabwrap"><table class="ptab"><thead><tr><th>Date</th><th>Type</th><th>Contractor / Supervisor</th><th>Offer No.</th><th>Site</th><th>City</th><th>Salesperson</th><th class="xcol noprint"></th></tr></thead><tbody>';
  items.forEach(function(p){ const who=p.kind==='team'?(esc(p.contractor)+' · T'+esc(p.team)):(esc(p.supervisor)+' · '+esc(p.task||'')); const typ=p.kind==='team'?'Install':'Supervisor';
    h+='<tr><td>'+esc(prettyDate(p.date))+'</td><td>'+typ+'</td><td class="cn">'+who+'</td><td>'+esc(p.offer||'—')+'</td><td>'+esc(p.project||'')+'</td><td>'+esc(p.city||'')+'</td><td>'+esc(p.salesperson||'')+'</td><td class="xcol noprint"><div class="xbtns"><button class="pdel" data-id="'+esc(p.id)+'">✕</button></div></td></tr>'; });
  return h+'</tbody></table></div></div>'; }
function teamItems(date){
  if(date===TODAY()){
    const items=[];
    rows.forEach(r=>{ for(let t=1;t<=r.teams.length;t++){ const tm=teamOf(r,String(t)); if(tm && tm.status==='booked'){ const meta=planById('c|'+r.name+'|'+t+'|'+TODAY())||{}; items.push({ id:'c|'+r.name+'|'+t+'|'+TODAY(), contractor:r.name, team:String(t), offer:tm.offer||meta.offer||'', project:tm.project||meta.project||'', city:meta.city||'', salesperson:meta.salesperson||'', holdBy:meta.holdBy||'' }); } } });
    return items;
  }
  return planFor(date,'team');
}
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDateAny(v){
  if(v==null) return '';
  if(v instanceof Date) return isNaN(v)?'':isoDate(v);
  var s=String(v).trim(); if(!s) return '';
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];   // ISO yyyy-mm-dd
  // JS/Apps-Script Date string e.g. "Wed Aug 12 2026 00:00:00 GMT+0530 ..." — read y/m/d directly (no TZ shift)
  var M={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  var m2=s.match(/\b([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\b/);
  if(m2 && M[m2[1]]) return m2[3]+'-'+M[m2[1]]+'-'+String(m2[2]).padStart(2,'0');
  var d=new Date(s); return isNaN(d)?s:isoDate(d);
}
function TODAY(){ return isoDate(new Date()); }
function TOMORROW(){ const t=new Date(); t.setDate(t.getDate()+1); return isoDate(t); }
function prettyDate(iso){ const p=String(iso||'').split('-').map(Number); if(p.length<3) return iso||'—'; const dt=new Date(p[0],p[1]-1,p[2]); return dt.toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short'}); }
function normPlan(p){ p=p||{}; return { id:String(p.id||''), kind:(p.kind==='supervisor'?'supervisor':'team'), date:isoDateAny(p.date), contractor:String(p.contractor||p.name||''), team:String(p.team||''), offer:cleanOffer(p.offer), project:String(p.project||''), city:String(p.city||''), salesperson:String(p.salesperson||''), holdBy:String(p.holdBy||''), supervisor:String(p.supervisor||''), task:String(p.task||''), by:String(p.by||''), at:String(p.at||'') }; }
function cleanOffer(v){
  if(v==null) return '';
  if(v instanceof Date) return isNaN(v)?'':String(v.getFullYear());
  var s=String(v).trim(); if(!s) return '';
  // legacy corruption: an offer that got saved as a JS Date string, e.g.
  // "Sat Jul 08 82372 00:00:00 GMT+0530 (India Standard Time)" — the real offer is 82372
  if(/GMT[+-]?\d/i.test(s) || /\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/.test(s)){
    var m=s.match(/\b[A-Za-z]{3}\s+\d{1,2}\s+(\d{3,})\b/);   // "Mon DD <offer>"
    if(m) return m[1];
    var d=s.match(/\d{3,}/); return d?d[0]:'';
  }
  return s;
}
function loadPlansLocal(){ try{ const a=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]'); plans=Array.isArray(a)?a.map(normPlan):[]; }catch(e){ plans=[]; } }
function savePlansLocal(){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(plans)); }catch(e){} }
function loadSalesLocal(){ DEFAULT_SALES.forEach(s=>salesSet.add(s)); NCR_SALES.forEach(s=>salesSet.add(s)); try{ (JSON.parse(localStorage.getItem(SALES_KEY)||'[]')||[]).forEach(s=>salesSet.add(s)); }catch(e){} }
function rememberSalesperson(s){ s=(s||'').trim(); if(!s) return; salesSet.add(s); try{ localStorage.setItem(SALES_KEY, JSON.stringify([...salesSet])); }catch(e){} fillDatalist('dlSales',[...salesSet]); }
function fillDatalist(id,arr){ const dl=document.getElementById(id); if(!dl) return; dl.innerHTML=(arr||[]).map(v=>'<option value="'+esc(v)+'">').join(''); }
async function syncPlansFromServer(){
  try{
    const r=await fetch(API+'?action=dayplan&t='+Date.now());
    const d=await r.json();
    if(d&&d.ok!==false&&Array.isArray(d.plans)){
      const server=d.plans.map(normPlan).filter(p=>!deletedPlanIds.has(p.id));
      // SELF-HEAL: any server row whose offer was a corrupted date string gets the
      // cleaned value re-saved to the sheet — once per id per session, so no spam.
      d.plans.forEach(function(rp){
        try{
          var np=normPlan(rp);
          if(!np.id || deletedPlanIds.has(np.id) || healedOffers.has(np.id)) return;
          var rawOffer=(rp&&rp.offer!=null)?String(rp.offer).trim():'';
          if(rawOffer && rawOffer!==np.offer){ healedOffers.add(np.id); pushPlan(np); }
        }catch(e){}
      });
      const serverIds=new Set(server.map(p=>p.id));
      // preserve locally-added plans the server hasn't stored yet (and re-push them),
      // so a newly added supervisor/team plan is never wiped by a sync
      const localOnly=(plans||[]).filter(p=>p&&p.id&&!serverIds.has(p.id)&&!deletedPlanIds.has(p.id));
      localOnly.forEach(p=>{ try{ pushPlan(p); }catch(e){} });
      plans=server.concat(localOnly);
      savePlansLocal();
      return true;
    }
  }catch(e){}
  return false;
}
async function pushPlan(entry){ try{ await fetch(API,{method:'POST',body:new URLSearchParams(Object.assign({action:'planUpsert'},entry))}); }catch(e){} }
async function pushPlanDelete(id){ deletedPlanIds.add(id); saveTombstones(); try{ await fetch(API,{method:'POST',body:new URLSearchParams({action:'planDelete',id:id})}); }catch(e){} }
function upsertPlan(entry){ if(deletedPlanIds.has(entry.id)){ deletedPlanIds.delete(entry.id); saveTombstones(); } const i=plans.findIndex(p=>p.id===entry.id); if(i>=0) plans[i]=entry; else plans.push(entry); savePlansLocal(); pushPlan(entry); }
function planById(id){ return plans.find(p=>p.id===id); }
function planFor(date,kind){ return plans.filter(p=>p.date===date && p.kind===kind); }
function upcomingForTeam(name,t){
  const n=String(name||'').toLowerCase(), tk=String(t);
  return plans.filter(p=> p.kind==='team' && p.date>TODAY()
      && String(p.contractor||'').toLowerCase()===n && String(p.team||'')===tk)
    .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
}
function whenLabel(iso){ return iso===TODAY()?'Today':(iso===TOMORROW()?'Tomorrow':prettyDate(iso)); }
function swapDate(id,d){ return String(id).replace(/\|[^|]*$/, '|'+d); }
async function loadSupervisors(){
  try{ const a=JSON.parse(localStorage.getItem(SUP_KEY)||'[]'); if(Array.isArray(a)) supList=a; }catch(e){}
  try{ const r=await fetch(API+'?action=supervisors&t='+Date.now()); const d=await r.json(); if(d&&d.ok!==false&&Array.isArray(d.supervisors)&&d.supervisors.length){ supList=d.supervisors.map(s=>String(s).trim()).filter(Boolean); try{ localStorage.setItem(SUP_KEY, JSON.stringify(supList)); }catch(e){} } }catch(e){}
  fillDatalist('dlSup', supList);
}

function setDot(id,txtId,kind,txt){ const d=document.getElementById(id); d.className='dot'+(kind?(' '+kind):''); if(txt!==undefined) document.getElementById(txtId).textContent=txt; }
function normStatus(v){ const s=String(v||'').toLowerCase(); return s==='booked'?'booked':s==='na'?'na':'available'; }
function normTeam(t){ t=t||{}; return { status:normStatus(t.status), offer:cleanOffer(t.offer), project:String(t.project||'').trim(), by:String(t.by||'').trim(), at:t.at||'', salesperson:String(t.salesperson||'').trim(), city:String(t.city||'').trim() }; }
function normHeld(h){ h=h||{}; return { offer:cleanOffer(h.offer), project:String(h.project||'').trim(), team:String(h.team||'').trim(), city:String(h.city||'').trim(), salesperson:String(h.salesperson||'').trim(), holdBy:String(h.holdBy||'').trim(), heldOn:String(h.heldOn||'') }; }
function shortDate(v){ const d=new Date(v); return isNaN(d)?'' : d.toLocaleDateString([], {day:'2-digit',month:'short'}); }
function normRow(c){ let teams=Array.isArray(c.teams)?c.teams.map(normTeam):[]; if(!teams.length) teams=[normTeam(c.team1),normTeam(c.team2)]; return { name:String(c.name||'').trim(), code:String(c.code||'').trim(), phone:String(c.phone||'').trim(), addr:String(c.addr||'').trim(), role:String(c.role||'').trim(), teamCount:teams.length, teams:teams, held:Array.isArray(c.held)?c.held.map(normHeld):[] }; }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); }catch(e){} }
function loadCache(){ try{ var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); return Array.isArray(c)?c.map(normRow):null; }catch(e){ return null; } }
function teamOf(r,t){ return r.teams[Number(t)-1]; }
function dispTeam(r,t){ const k=r.name+'|'+t; return pending.has(k)?pending.get(k):teamOf(r,t); }

/* ============ BOARD ============ */
function counts(){
  let free=0, booked=0, na=0;
  rows.forEach(r=>{ for(let t=1;t<=r.teams.length;t++){ const st=dispTeam(r,String(t)).status; if(st==='booked')booked++; else if(st==='na')na++; else free++; } });
  document.getElementById('cFree').textContent=free;
  document.getElementById('cBooked').textContent=booked;
  document.getElementById('cNA').textContent=na;
  document.getElementById('cTotal').textContent=rows.length;
}
function teamChip(r,t){
  const tm=dispTeam(r,t), busy=pending.has(r.name+'|'+t)?' busy':'';
  let cls, label, sub;
  if(tm.status==='booked'){ cls=''; label='Booked'; sub=tm.offer?('#'+esc(tm.offer)+(tm.project?' · '+esc(tm.project):'')):'booked'; }
  else if(tm.status==='na'){ cls=' na'; label='On leave'; sub='tap to manage'; }
  else { cls=' avail'; label='Available'; sub='tap to book'; }
  // advance bookings for later dates — make them visible on the card
  const up=upcomingForTeam(r.name,t);
  let nextHtml='';
  if(up.length){
    if(tm.status!=='booked' && tm.status!=='na') cls+=' ahead';
    const n0=up[0], extra=up.length>1?(' +'+(up.length-1)):'';
    nextHtml='<div class="tnext">📅 '+esc(whenLabel(n0.date))+(n0.offer?(' · #'+esc(n0.offer)):(n0.holdBy?' · '+esc(n0.holdBy):''))+extra+' ›</div>';
  }
  return '<div class="team'+cls+busy+'" data-name="'+esc(r.name)+'" data-team="'+t+'"><div class="tl">Team '+t+'</div><div class="ts">'+label+'</div><div class="to">'+sub+'</div>'+nextHtml+'</div>';
}
function renderBoard(){
  const g=document.getElementById('grid'); counts();
  const list=rows.filter(r=> !filter || r.name.toLowerCase().includes(filter) || (r.role||'').toLowerCase().includes(filter));
  if(!rows.length){ g.innerHTML='<div class="msg">No teams found in the sheet.<br><span style="font-size:12px">Add names to the <b>teams</b> tab, then refresh.</span></div>'; return; }
  if(!list.length){ g.innerHTML='<div class="msg">No team matches “'+esc(filter)+'”.</div>'; return; }
  g.innerHTML=list.map(r=>{ let chips=''; for(let t=1;t<=r.teams.length;t++) chips+=teamChip(r,String(t));
    let heldHtml='';
    if(r.held && r.held.length){
      const open=heldOpen.has(r.name);
      heldHtml='<div class="held'+(open?' open':'')+'"><div class="heldhd" data-hname="'+esc(r.name)+'"><span class="hchev">▸</span> ⏸ On hold · needs work <span class="hcnt">'+r.held.length+'</span></div>'+
        r.held.map(h=>'<div class="hitem"><div class="hinfo">'+
            '<div class="hoffer">#'+esc(h.offer||'—')+(h.project?' · '+esc(h.project):'')+'</div>'+
            '<div class="hrow2"><span class="hk">Salesperson</span> '+esc(h.salesperson||'—')+'</div>'+
            '<div class="hrow2">📅 '+esc(h.heldOn?shortDate(h.heldOn):'—')+(h.holdBy?' · '+esc(h.holdBy):'')+'</div>'+
          '</div>'+
          '<div class="hacts"><button class="hbtn hresume" data-hname="'+esc(r.name)+'" data-hoffer="'+esc(h.offer)+'" data-hheld="'+esc(h.heldOn)+'">▶ Resume</button>'+
          '<button class="hbtn hcancel" data-hname="'+esc(r.name)+'" data-hoffer="'+esc(h.offer)+'" data-hheld="'+esc(h.heldOn)+'" title="Remove held site">✕</button></div></div>').join('')+'</div>';
    }
    return '<div class="card"><div class="nm">'+esc(r.name)+'</div>'+(r.role?'<div class="role">'+esc(r.role)+'</div>':'')+'<div class="teams">'+chips+'</div>'+heldHtml+'</div>'; }).join('');
}
async function loadBoard(silent){
  if(!silent) setDot('dot','syncTxt','busy','Syncing…');
  document.getElementById('refreshB').classList.add('spin');
  try{
    let r; try{ r=await fetch(API+'?action=contractors&t='+Date.now()); }catch(ne){ throw new Error(navigator.onLine?'Sheet script not reachable (network blocked or script URL wrong)':'Phone is offline'); }
    const txt=(await r.text()).trim();
    if(!r.ok) throw new Error('Sheet script error HTTP '+r.status);
    if(txt.charAt(0)==='<') throw new Error(/sign in|accounts\.google|authorization/i.test(txt)?'Script asks for Google sign-in — set deployment access to “Anyone”':'Script URL returned a web page, not data — check the /exec link / redeploy');
    let data; try{ data=JSON.parse(txt); }catch(pe){ throw new Error('Script sent bad data: '+txt.slice(0,80)); }
    if(!data||data.ok===false) throw new Error('Script error: '+((data&&data.error)||'unknown'));
    rows=(data.contractors||data.teams||[]).map(normRow).filter(c=>c.name);
    saveCache(); renderBoard();
    setDot('dot','syncTxt','ok','Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})); firstLoad=false;
  }catch(e){
    if(firstLoad){ const cached=loadCache(); if(cached&&cached.length){ rows=cached; renderBoard(); setDot('dot','syncTxt','err','Last known state · '+(e.message||e)); }
      else{ document.getElementById('grid').innerHTML='<div class="msg err">Couldn’t reach the sheet.<br><span style="font-size:12px">'+esc(e.message||e)+'</span><br><button onclick="loadBoard()">Retry</button></div>'; setDot('dot','syncTxt','err',e.message||'Connection failed'); } }
    else setDot('dot','syncTxt','err','Not updated · '+(e.message||e)+' · will retry');
    console.warn('loadBoard failed',e);
  }finally{ document.getElementById('refreshB').classList.remove('spin'); }
}
async function apiPost(params){
  let r, txt;
  try{ r=await fetch(API,{method:'POST',body:new URLSearchParams(params)}); }
  catch(e){ throw new Error('Cannot reach backend (network/URL). '+(e.message||'')); }
  try{ txt=await r.text(); }catch(e){ txt=''; }
  if(!r.ok) throw new Error('Backend HTTP '+r.status+' — '+String(txt).slice(0,160));
  const t=String(txt).trim();
  if(t.charAt(0)==='<' || /google account|sign in|requires authorization|accounts\.google/i.test(t))
    throw new Error('Backend returned a sign-in / HTML page, not data. The Apps Script deployment access is not set to “Anyone”, or the /exec URL is wrong.');
  let data; try{ data=JSON.parse(t); }catch(e){ throw new Error('Backend sent non-JSON: '+t.slice(0,160)); }
  if(!data||data.ok===false) throw new Error((data&&data.error)||'Backend rejected the request (ok:false). action='+(params&&params.action||'?'));
  return data;
}

        if(tm && tm.status==='booked'){ showMErr(n.contractor+' Team '+n.team+' is already working today (#'+(tm.offer||'—')+').'); return; }
        if(tm && tm.status==='na'){ showMErr(n.contractor+' Team '+n.team+' is on leave today.'); return; } }

    }

        await apiPost({action:'release',name:src.contractor,team:src.team,by:SUP});

      if(n.date===TODAY()){

      }
      if(n.date!==TODAY() || planById(newId) || live){
        await sheetPlanUpsert({ id:newId, kind:'team', date:n.date, contractor:n.contractor, team:n.team, offer:n.offer, project:n.project, city:n.city,
          salesperson:n.salesperson, holdBy:n.holdBy, supervisor:'', task:'', by:SUP, at:new Date().toISOString() });
      }

      if(live && !moved){ const tid='c|'+n.contractor+'|'+n.team+'|'+TOMORROW(), tp=planById(tid);
        if(tp && cleanOffer(tp.offer).toUpperCase()===cleanOffer(src.offer).toUpperCase())

      rememberSalesperson(n.salesperson);
      if(!inRegion(n.salesperson)){ planSalesList=[]; saveSalesSel(); }
      closeModal();
      await loadBoard(true); renderBoard(); renderPlan();
      setDot('dotP','syncP','ok','Saved to sheet · '+n.contractor+' Team '+n.team+' · '+whenLabel(n.date)+(n.offer?' · #'+n.offer:''));
      setDot('dot','syncTxt','ok','Plan updated · '+n.contractor+' Team '+n.team);
    }catch(err){
      go.disabled=false; go.textContent='Try again';
      showMErr('⚠ Not saved to the sheet: '+(err.message||err));
      syncPlansFromServer().then(()=>{ renderPlan(); }); loadBoard(true);
    }
  };
}

    // slice the tall screenshot into per-page strips and embed each as a compressed
    // JPEG — avoids re-embedding the whole full-res PNG on every page (was ~28MB)
    const pxPerPage=Math.floor(canvas.width*ph/pw);
    let sy=0, page=0;
    while(sy < canvas.height-1){
      let target=Math.min(sy+pxPerPage, canvas.height);
      if(target<canvas.height){
        // if any block straddles the intended cut line, pull the cut up to the
        // top of that block so the whole block moves to the next page intact
        let cut=target;
        for(const b of breaks){
          if(b.top>sy+4 && b.top<target && b.bottom>target && b.top<cut) cut=b.top;
        }
        if(cut>sy+2) target=Math.round(cut);   // else block taller than a page -> hard cut
      }
      const sliceH=target-sy;
      const slice=document.createElement('canvas'); slice.width=canvas.width; slice.height=sliceH;
      const sctx=slice.getContext('2d'); sctx.fillStyle='#ffffff'; sctx.fillRect(0,0,slice.width,sliceH);
      sctx.drawImage(canvas, 0, sy, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
      const imgData=slice.toDataURL('image/jpeg', 0.72);
      const drawH=sliceH*pw/canvas.width;
      if(page>0) pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,0,pw,drawH);
      sy=target; page++;
    }
    const fname='Lingel-DayPlan-'+TODAY()+'.pdf', blob=pdf.output('blob');
    const file=new File([blob],fname,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Lingel Day Plan', text:'Lingel Day Plan · '+prettyDate(TODAY())+' → '+prettyDate(TOMORROW()) });
      setDot('dotP','syncP','ok','Shared PDF');
    } else {
      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
      setDot('dotP','syncP','ok','PDF saved — attach it in WhatsApp');
    }
  }catch(e){ if(e && e.name==='AbortError'){ setDot('dotP','syncP','ok','Share cancelled'); return; } setDot('dotP','syncP','err',(e && e.message)||'PDF failed'); }
}

function offerKeys(s){ const keys=[]; let base='';
  String(s||'').split(/[,;&\s]+/).forEach(tok=>{ tok=tok.trim(); if(!tok) return; const parts=tok.split('/').filter(x=>x!==''); if(!parts.length) return;
    if(/^\d{4,7}$/.test(parts[0])){ base=parts[0]; if(parts.length===1){ keys.push(base); return; } for(let i=1;i<parts.length;i++) if(/^\d{1,4}$/.test(parts[i])) keys.push(base+'/'+(+parts[i])); }
    else if(base && /^\d{1,4}$/.test(parts[0]) && parts.length===1) keys.push(base+'/'+(+parts[0])); });
  return [...new Set(keys)]; }
function offerHit(orderOffer, otherOffer){ const a=offerKeys(orderOffer), b=offerKeys(otherOffer); if(!a.length||!b.length) return false;
  return b.some(k=> k.indexOf('/')>=0 ? a.includes(k) : a.some(x=>x.split('/')[0]===k)); }

  for(const r of rows){ for(let t=1;t<=r.teams.length;t++){ const tm=teamOf(r,String(t)); if(tm && tm.offer && offerHit(o.offer,tm.offer)) return r.name+' (T'+t+')'; }
    for(const h of (r.held||[])) if(h.offer && offerHit(o.offer,h.offer)) return r.name+(h.team?' (T'+h.team+')':''); }
  for(const p of plans) if(p.kind==='team' && p.contractor && p.offer && offerHit(o.offer,p.offer)) return p.contractor+' (T'+p.team+')';
  for(const k of offerKeys(o.offer)) if(unJust[k]) return unJust[k];
  return '';
}

<script>
/* ===== LINGEL ORDER DOCUMENTS (shared by every app) ==========================
   1) Library: a quotation or production sheet uploaded ONCE in any app is saved
      by Offer No; every other app loads it with "Load by Offer No".
   2) Reader: LD.kind(file) tells a production sheet from a quotation, and
      LD.parseProduction(file) reads a production sheet exactly like Corner Check.
   Backend: hub Apps Script actions docSave / docGet / docList.               */
(function(){
  if (window.LD) return;
  var HUB = "https://script.google.com/macros/s/AKfycbzTi9ihe1YpDEIkX7IdAnDqNl61rU3IDecHUetV4mmwAVezMbJSu_Ruxg4_CJnscVEH/exec";
  var CACHE = 'lingel-docs-v1';
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_W = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var LD = window.LD = {};
  function api(){ return HUB; }
  function key(o){ return String(o||'').trim().toUpperCase().replace(/\s+/g,''); }
  function cacheUrl(o,k){ return './__orderdoc__/'+encodeURIComponent(key(o))+'/'+k; }
  function b64ToBlob(b64){ var bin=atob(b64), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:'application/pdf'}); }
  function toB64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ var s=String(r.result); res(s.slice(s.indexOf(',')+1)); }; r.onerror=rej; r.readAsDataURL(blob); }); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function who(){ try{ var s=JSON.parse(localStorage.getItem('lingel_supervisor')||'null'); return (s&&s.name)||''; }catch(e){ return ''; } }

  async function post(params){
    var r = await fetch(api(), {method:'POST', body:new URLSearchParams(params)});
    var t = (await r.text()).trim();
    if (t.charAt(0)==='<') throw new Error('Backend not reachable. Check the hub script deployment.');
    var d; try{ d=JSON.parse(t); }catch(e){ throw new Error('Backend reply not understood'); }
    if (d && d.ok===false && !d.notFound && /supervisor list|unknown|password|pin/i.test(d.error||'')) throw new Error('Hub script not updated yet: install the document library and redeploy.');
    return d;
  }
  async function keep(offer,kind,file,meta){ try{ var c=await caches.open(CACHE); await c.put(cacheUrl(offer,kind), new Response(file,{headers:{'Content-Type':'application/pdf','X-Meta':encodeURIComponent(JSON.stringify(meta||{}))}})); }catch(e){} }
  async function local(offer,prefer){
    var order = prefer==='quotation' ? ['quotation','production'] : ['production','quotation'];
    try{ var c=await caches.open(CACHE);
      for (var i=0;i<order.length;i++){ var r=await c.match(cacheUrl(offer,order[i])); if(!r) continue;
        var meta=JSON.parse(decodeURIComponent(r.headers.get('X-Meta')||'%7B%7D')); var b=await r.blob();
        return {file:new File([b], meta.name||(order[i]+'_'+key(offer)+'.pdf'), {type:'application/pdf'}), kind:order[i], meta:meta, offline:true}; }
    }catch(e){}
    return null;
  }

  /* ---------- library ---------- */
  /* already in the library? → {exists, app, by, on, kinds} */
  LD.has = async function(offer, kind){
    try{ var r=await post({action:'docHas', offer:offer, kind:kind||'quotation'}); return (r&&r.ok)?r:{exists:false}; }catch(e){ return {exists:false, offline:true}; }
  };
  /* UPLOAD ONCE: if the order already has this document, nothing is uploaded again —
     only missing details (customer, salesperson, city, sq.ft) are filled in.
     opts.replace = true sends a revised PDF on purpose. opts.fileUrl registers a Drive file without copying. */
  LD.save = async function(file, meta, opts){       // meta: {offer, kind, customer, site, salesperson, positions, sqft, app}
    meta = Object.assign({by:who()}, meta||{}); opts = opts||{};
    if (!key(meta.offer)) throw new Error('No Offer No to save under');
    if (!opts.replace){
      var h = await LD.has(meta.offer, meta.kind);
      if (h.exists){
        if (meta.items && typeof meta.items!=='string') meta.items = JSON.stringify(meta.items);
        try{ await post(Object.assign({action:'docSave'}, meta)); }catch(e){}          // details only, no file
        return {ok:true, skipped:true, app:h.app, on:h.on, url:h.url};
      }
    }
    /* sq.ft log: a production sheet always carries its per-window areas, whichever app saves it */
    if (meta.kind==='production' && !meta.items){
      try{ var pr = await LD.parseProduction(file, {drawings:false});
        var its = pr.positions.map(function(p){ return {ref:p.ref, w:Math.round(p.w||0), h:Math.round(p.h||0), qty:p.qty||1, sqft:+(p.sqft||0).toFixed(2), series:p.series||''}; });
        meta.items = its;
        if (!meta.sqft) meta.sqft = its.reduce(function(a,p){return a+p.sqft;},0).toFixed(2);
        if (!meta.positions) meta.positions = String(its.length);
        if (!meta.customer) meta.customer = pr.customer||'';
        if (!meta.salesperson) meta.salesperson = pr.sales||'';
      }catch(e){}
    }
    if (meta.items && typeof meta.items!=='string') meta.items = JSON.stringify(meta.items);
    await keep(meta.offer, meta.kind, file, Object.assign({}, meta, {name:file.name}));
    var send = Object.assign({action:'docSave'}, meta);
    if (opts.replace) send.replace = '1';
    if (opts.fileUrl) send.fileUrl = opts.fileUrl; else send.data = await toB64(file);
    var r = await post(send);
    if (r && r.ok===false && send.fileUrl && /PDF missing/i.test(r.error||'')){   // hub can't open that Drive file → send the PDF itself
      delete send.fileUrl; send.data = await toB64(file); r = await post(send); }
    if (!r || !r.ok) throw new Error((r&&r.error)||'Save failed');
    return r;
  };
  /* save quietly after an app reads a PDF; never blocks or throws */
  LD.saveQuiet = function(file, meta){ try{ LD.save(file, meta).then(function(r){ if(r&&r.skipped) console.info('Already in the library ('+(r.app||'')+' '+(r.on||'')+') — not uploaded again'); }).catch(function(e){ console.warn('Library save failed:', e.message); }); }catch(e){} };
  LD.load = async function(offer, prefer){         // → {file, kind, meta, offline}
    if (!key(offer)) throw new Error('Enter an Offer No.');
    var r;
    try{ r = await post({action:'docGet', offer:offer, prefer:prefer||'production'}); }
    catch(e){ var l=await local(offer,prefer); if(l) return l; throw e; }
    if (r && r.ok && r.data){
      var file = new File([b64ToBlob(r.data)], r.name||(r.kind+'_'+key(offer)+'.pdf'), {type:'application/pdf'});
      delete r.data; await keep(offer, r.kind, file, r);
      return {file:file, kind:r.kind, meta:r, offline:false};
    }
    var l2 = await local(offer,prefer); if (l2) return l2;
    throw new Error((r&&r.error)||('Nothing saved for '+offer));
  };
  LD.api = api;
  LD.list = async function(){ try{ var r=await post({action:'docList'}); return (r&&r.ok&&r.list)||[]; }catch(e){ return []; } };

  /* ---------- orders split into parts: 23456/7, 23456/8, 23456/9 (one quotation each) ----------
     LD.parts("23456/7/8/9") → {base:'23456', parts:['7','8','9']}   ·   "23456" → all parts            */
  LD.parts = function(o){
    var t=String(o==null?'':o).trim(), m=t.match(/\d{3,7}/);
    if (!m) return {base:key(t), parts:[]};
    /* every number after a "/" or "," is its own part: 23456/7/8, 23456/7,8, 23456/7, 23456/8 → 7, 8 (a repeated base is skipped) */
    var parts=[]; t.slice(m.index+m[0].length).split(/[\/,&+]|\band\b/i).forEach(function(tok){
      var d=(tok.match(/\d+/g)||[]); d.forEach(function(x){ if(x===m[0]||x.length>4) return; x=String(+x); if(parts.indexOf(x)<0) parts.push(x); }); });
    return {base:m[0], parts:parts};
  };
  LD.joinParts = function(base, parts){ return parts.length ? base+'/'+parts.join('/') : base; };
  /* Every saved part of a multi-part (or base-only) Offer No → {docs:[{file,kind,meta,offer,part}], missing:['9'], combined:'23456/7/8'} */
  LD.loadMany = async function(offer, prefer){
    var want=LD.parts(offer), list=await LD.list(), hits=[];
    list.forEach(function(x){ var p=LD.parts(x.offer);
      if (p.base!==want.base) return;
      if (want.parts.length && !p.parts.some(function(q){ return want.parts.indexOf(q)>=0; })) return;
      hits.push(x); });
    hits.sort(function(a,b){ return (+LD.parts(a.offer).parts[0]||0)-(+LD.parts(b.offer).parts[0]||0); });
    var docs=[], got=[];
    for (var i=0;i<hits.length;i++){
      try{ var r=await LD.load(hits[i].offer, prefer), pp=LD.parts(hits[i].offer).parts;
        docs.push({file:r.file, kind:r.kind, meta:Object.assign({offer:hits[i].offer}, r.meta||{}), offer:hits[i].offer, part:pp.join('/'), offline:r.offline});
        pp.forEach(function(q){ if(got.indexOf(q)<0) got.push(q); }); }catch(e){}
    }
    var missing=want.parts.filter(function(q){ return got.indexOf(q)<0; });
    got.sort(function(a,b){return a-b;});
    return {docs:docs, missing:missing, combined:LD.joinParts(want.base, got)};
  };
  /* tag for positions that came from one part of a split order: "[/8] " */
  LD.partTag = function(meta){ return meta && meta.partCount>1 && meta.part ? '[/'+meta.part+'] ' : ''; };

  /* "Load by Offer No" dialog.
     onLoaded(file, kind, meta, offline) — called once per document (meta.part / partCount set for split orders).
     opts.onMany(docs, combined) — if given, a split order is handed over in ONE call instead.            */
  LD.openLoader = function(onLoaded, preset, prefer, opts){
    opts = opts||{};
    var old=document.getElementById('ldDlg'); if(old) old.remove();
    var w=document.createElement('div'); w.id='ldDlg';
    w.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
    w.innerHTML='<div style="background:#1a1e25;color:#e8e4d9;border:1px solid #2a2f3a;border-top:4px solid #ffce1f;border-radius:12px;padding:18px;width:100%;max-width:380px;font-family:\'Spline Sans\',system-ui,sans-serif">'
      +'<div style="font-family:Archivo,sans-serif;font-weight:900;font-size:17px;margin-bottom:4px">Load by Offer No</div>'
      +'<div style="font-size:12px;color:#7c8694;margin-bottom:12px">Uses the production sheet or quotation already uploaded in any app</div>'
      +'<input id="ldOff" list="ldDl" autocomplete="off" placeholder="e.g. 79173/3" style="width:100%;box-sizing:border-box;padding:11px 13px;font-size:16px;border-radius:8px;border:1px solid #2a2f3a;background:#222732;color:#e8e4d9">'
      +'<datalist id="ldDl"></datalist>'
      +'<div id="ldMsg" style="min-height:18px;font-size:12px;margin:8px 0;color:#7c8694"></div>'
      +'<div style="display:flex;gap:8px"><button id="ldX" type="button" style="flex:1;padding:11px;border-radius:8px;border:1px solid #2a2f3a;background:transparent;color:#7c8694;font-weight:700">Cancel</button>'
      +'<button id="ldGo" type="button" style="flex:1;padding:11px;border-radius:8px;border:none;background:#ffce1f;color:#111;font-weight:700">Load →</button></div></div>';
    document.body.appendChild(w);
    var inp=w.querySelector('#ldOff'), msg=w.querySelector('#ldMsg'), go=w.querySelector('#ldGo');
    if (preset) inp.value=preset;
    setTimeout(function(){ inp.focus(); },50);
    LD.list().then(function(list){ w.querySelector('#ldDl').innerHTML=list.map(function(x){
      var tag=(x.kinds||[]).map(function(k){return k==='production'?'Production sheet':'Quotation';}).join(' + ');
      return '<option value="'+esc(x.offer)+'">'+esc((x.customer||'')+(tag?' · '+tag:''))+'</option>'; }).join(''); });
    function close(){ w.remove(); }
    w.querySelector('#ldX').onclick=close;
    w.addEventListener('click',function(e){ if(e.target===w) close(); });
    async function run(){
      var off=inp.value.trim(); if(!off){ msg.style.color='#ef4444'; msg.textContent='Enter an Offer No.'; return; }
      go.disabled=true; msg.style.color='#7c8694'; msg.textContent='Loading…';
      try{
        var pp=LD.parts(off), many=pp.parts.length!==1, res=null;
        if (!many){ try{ res=await LD.load(off, prefer); }catch(e){ if(!pp.parts.length) throw e; many=true; } }
        else { try{ res=await LD.load(off, prefer); many=false; }catch(e){} }      // a combined PDF saved under the full number wins
        if (!many){ close(); await onLoaded(res.file, res.kind, Object.assign({offer:off}, res.meta||{}), res.offline); return; }
        msg.textContent='Loading every part of '+pp.base+'…';
        var M=await LD.loadMany(off, prefer);
        if (!M.docs.length) throw new Error('Nothing saved for any part of '+off);
        if (M.missing.length && !confirm('Not uploaded yet: part '+M.missing.map(function(x){return '/'+x;}).join(', ')+'.\n\nContinue with '+M.docs.map(function(d){return d.offer;}).join(', ')+'?')){ go.disabled=false; msg.textContent=''; return; }
        close();
        M.docs.forEach(function(d){ d.meta.part=d.part; d.meta.partCount=M.docs.length; d.meta.combined=M.combined; });
        if (opts.onMany){ await opts.onMany(M.docs, M.combined); return; }
        for (var i=0;i<M.docs.length;i++){ var d=M.docs[i]; await onLoaded(d.file, d.kind, d.meta, d.offline); }
      }
      catch(e){ go.disabled=false; msg.style.color='#ef4444'; msg.textContent=e.message||String(e); }
    }
    go.onclick=run; inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  };

  /* ---------- reading PDFs ---------- */
  function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){rej(new Error('Could not load '+src));}; document.head.appendChild(s); }); }
  LD.pdfjs = async function(){
    if (!window.pdfjsLib) await loadScript(PDFJS);
    try{ if (!window.pdfjsLib.GlobalWorkerOptions.workerSrc) window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W; }catch(e){}
    return window.pdfjsLib;
  };
  /* 'production' if the PDF is a Lingel production sheet, else 'quotation' */
  LD.kind = async function(file){
    var lib = await LD.pdfjs();
    var pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    var tc = await (await pdf.getPage(1)).getTextContent();
    var t = tc.items.map(function(i){return i.str;}).join(' ');
    return /Order-Pos\.?\s*:/.test(t) || /Dokument-Nr\.?\s*:/.test(t) ? 'production' : 'quotation';
  };

  /* Production sheet reader — same rules as Corner Check.

  var NUM=/^\d{2,5}[,.]\d{1,2}$/;

  LD.parseProduction = async function(file, opts){
    opts = opts||{};

        var idx=0; it.str.split(/(\s+)/).forEach(function(part){ if(part.trim()) toks.push({s:part,x:x+idx*cw,y:y,page:pn}); idx+=part.length; }); });
      toks.sort(function(a,b){return a.y-b.y||a.x-b.x;});

        system:g(/System\s*:\s*(?:Aluminium\s*-\s*)?([^\n]+?)(?:\s{2,}|$)/m,txt), series:g(/Lingel\s*([\d.]+)/,txt),
        frameType:g(/Frame\s*:\s*([^\n]+)/,txt), method:g(/Method\s*:\s*([A-Za-z ]+?)(?:,|\n|$)/,txt), connector:g(/Corner Connector\s*:\s*(\S+)/,txt),
        frame:null, fixed:false, sashes:[], nS:0, nM:0, drawing:''};
      var hi=bl.findIndex(function(l){return /^Nr\b/.test(l.text)&&l.text.indexOf('Artikel')>=0;});
      if (hi>=0){ var H=bl[hi], arts=H.toks.filter(function(t){return t.s==='Artikel';}), nrMax=arts[0].x-3, colMax=arts[1]?arts[1].x-3:arts[0].x+150;
        var tl=[]; for (var i=hi+1;i<bl.length;i++){ var l=bl[i]; if(l.page!==H.page||/^(Connectors|Sliding|Shutter|Hardware|ISO|Production)/.test(l.text)) break; tl.push.apply(tl, l.toks.filter(function(t){return t.x<colMax;})); }
        var nums=tl.filter(function(t){return NUM.test(t.s);}), rws=[];
        nums.forEach(function(t){ var r=rws.find(function(r){return Math.abs(r.y-t.y)<2.5;}); r?r.n.push(t):rws.push({y:t.y,n:[t]}); });
        rws.sort(function(a,b){return a.y-b.y;});
        rws.forEach(function(r,i){ if(r.n.length<2) return; r.n.sort(function(a,b){return a.x-b.x;}); var ny=rws[i+1]?rws[i+1].y:1e9, lim=Math.min(ny-2.5,r.y+16);
          var art=tl.filter(function(t){return /[A-Za-z]/.test(t.s)&&t.x<r.n[0].x-1&&t.y>=r.y-3&&t.y<lim;}).sort(function(a,b){return a.y-b.y||a.x-b.x;}).map(function(t){return t.s;}).join('');
          var nr=tl.find(function(t){return t.x<nrMax+6&&/^\d{1,2}$/.test(t.s)&&t.y>=r.y-3&&t.y<lim;});
          var o={art:art,w:num(r.n[0].s),h:num(r.n[1].s),nr:nr?+nr.s:0};
          if (o.nr) p.sashes.push(o); else if (!p.frame) p.frame=o; });
        if (!p.frame&&p.sashes.length===1){ p.frame=p.sashes[0]; p.frame.nr=0; p.sashes=[]; p.fixed=true; }

  async function extractDrawings(pdf,blocks){

        var c=document.createElement('canvas'); c.width=(x1-x0)*S; c.height=Math.round((y1-y0)*S); var cx=c.getContext('2d'); cx.drawImage(cv,x0*S,y0*S,c.width,c.height,0,0,c.width,c.height);

  /* ---------- order details from a quotation OR production sheet (same rules as Team Availability) ----------
     LD.readMeta(file) → {kind, offer, customer, party:'dealer'|'person'|'', billTo:'lingel'|'fensterbau'|'',
                          sales, city, sqft, positions, items:[{ref,w,h,qty,sqft}], service}

  LD.DEALER_NAMES = ['Rajesh Chawla'];
  LD.knownSales = function(){ return []; };
  var BIZ_RE=/\b(m\/s|enterprises?|traders?|trading|associates|agenc(y|ies)|industr(y|ies)|fabricat\w*|interiors?|builders?|developers?|construct\w*|infra\w*|glass|alumin\w*|windows?|doors?|fa[cç]ade|systems|solutions|corporation|corp|company|co\.|& ?co|group|pvt|private|ltd|limited|llp|inc|estate|realty|projects?|hardware|studio|architects?|consultants?|exports?|imports?|sales|marketing|services|works|store|mart|center|centre|homes)\b/i;
  var PERSON_RE=/^\s*(mr|mrs|ms|miss|dr|smt|shri|sh)\.?\s+[a-z]/i;
  LD.party = function(name){
    var n=String(name||'').trim(); if(!n) return '';

  var CITIES=['New Delhi','Delhi','Gurugram','Gurgaon','Greater Noida','Noida','Faridabad','Ghaziabad','Manesar','Sohna','Sonipat','Panipat','Karnal','Rohtak','Rewari','Bahadurgarh','Jhajjar','Jaipur','Udaipur','Chandigarh','Mohali','Panchkula','Zirakpur','Ludhiana','Amritsar','Jalandhar','Patiala','Bathinda','Dehradun','Haridwar','Rishikesh','Haldwani','Moradabad','Shimla','Solan','Kasauli','Lucknow','Kanpur','Agra','Meerut','Patna','Jehanabad','Gaya','Jammu','Srinagar','Mumbai','Pune','Bengaluru','Bangalore','Hyderabad','Chennai','Kolkata','Ahmedabad','Indore','Bhopal'];

    try{ var known=LD.knownSales()||[], first=s.split(/\s+/)[0].toLowerCase();
      var hit=known.find(function(n){return n.toLowerCase()===s.toLowerCase();})||known.find(function(n){return n.split(/\s+/)[0].toLowerCase()===first;});

  async function quoteMeta(file){

      tc.items.forEach(function(it){ if(it.str) sp.push({x:it.transform[4],y:it.transform[5],str:it.str}); });

  LD.summary = function(m){

})();

function taCity(txt){
  const t=String(txt||'');
  for(const c of TA_CITIES){ if(new RegExp('\\b'+c.replace(/ /g,'\\s+')+'\\b','i').test(t)) return c; }
  const m=t.match(/([A-Za-z][A-Za-z .]{2,30}?)\s*[-,]?\s*\b\d{6}\b/);          // word before a PIN code
  return m ? m[1].trim().split(/[,]/).pop().trim() : '';
}
function taSales(raw){
  let s=String(raw||'').replace(/^(Mr|Mrs|Ms|Sh|Shri)\.?\s+/i,'').split(/\s{2,}|[|,:]|\+?\d{6,}|Mob|Phone|Tel|E-?mail/i)[0].trim();
  if(!s) return '';
  try{ const known=allSalesNames(), first=s.split(/\s+/)[0].toLowerCase();       // match a name already in the list
       const hit=known.find(n=>n.toLowerCase()===s.toLowerCase())||known.find(n=>n.split(/\s+/)[0].toLowerCase()===first);
       if(hit) return hit; }catch(e){}
  return s.slice(0,40);
}
/* several quotations / production sheets of ONE order (23456/7, /8, /9) → one combined booking:
   positions tagged [/7] [/8] [/9], sq.ft added up, Offer No 23456/7/8/9, each PDF saved under its own number */
function combineQs(list){
  if (list.length===1) return list[0];
  list.sort((a,b)=>(+LD.parts(a.offer).parts[0]||0)-(+LD.parts(b.offer).parts[0]||0));
  const base=LD.parts(list[0].offer).base, parts=[];
  list.forEach(q=>LD.parts(q.offer).parts.forEach(x=>{ if(!parts.includes(x)) parts.push(x); }));
  parts.sort((a,b)=>a-b);
  const items=[]; list.forEach(q=>{ const tag='[/'+LD.parts(q.offer).parts.join('/')+'] '; q.items.forEach(i=>items.push(Object.assign({},i,{ref:tag+i.ref}))); });
  const first=k=>{ const q=list.find(x=>x[k]); return q?q[k]:''; };
  return {kind:list.every(q=>q.kind==='production')?'production':'quotation', offer:LD.joinParts(base,parts), client:first('client'), party:first('party'),
    sales:first('sales'), city:first('city'), items, total:items.reduce((s,i)=>s+(+i.sqft||0),0), service:list[0].service,
    parts:list.map(q=>({offer:q.offer, kind:q.kind, positions:q.items.length, sqft:q.total, file:q.file, fromLib:q.fromLib}))};
}
async function parseQuotationTA(file){
  let kind='quotation'; try{ kind=await LD.kind(file); }catch(e){}
  if(kind==='production'){
    const r=await LD.parseProduction(file,{drawings:false});
    const items=r.positions.map(p=>({ref:p.ref,w:p.w,h:p.h,sqft:p.sqft}));
    return {kind,offer:r.offer,client:r.customer,party:partyType(r.customer),sales:taSales(r.sales),city:taCity(r.addr),items,total:items.reduce((s,q)=>s+q.sqft,0),
      service:r.material==='upvc'?'UPVC Windows & Doors':'Aluminium Windows & Doors'};
  }
  const q=await parseQuotationTA_q(file); q.kind='quotation'; return q;
}
async function parseQuotationTA_q(file){
  await ensurePdfjsTA();
  const normNum=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null;};
  const RE_LBL=/^(?:\d{1,3}-|Add-|ADD-)/i, RE_MEAS=/([A-Za-z]\d?)=([\d.,]+)/g;
  const qLabel=l=>{const mi=l.search(/\s+[A-Za-z]\d?=[\d.,]+;/);return (mi>=0?l.slice(0,mi):l).trim();};
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const all=[]; let offer='', client='', text='', salesRaw='', addrFrom=-1;
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await (await pdf.getPage(pn)).getTextContent();
    const sp=[]; tc.items.forEach(it=>{ if(it.str) sp.push({x:it.transform[4],y:it.transform[5],str:it.str}); });
    sp.sort((a,b)=>b.y-a.y);
    const bk=[]; for(const s of sp){ let p=false; for(const b of bk){ if(Math.abs(s.y-b.y)<5){ b.items.push(s); p=true; break; } } if(!p) bk.push({y:s.y,items:[s]}); }
    const lines=bk.sort((a,b)=>b.y-a.y).map(b=>b.items.sort((a,c)=>a.x-c.x).map(o=>o.str).join(' ').replace(/\s+/g,' ').trim());
    for(const ln of lines){
      text+=' '+ln;
      const nr=ln.match(/(?:Nr|Offer|Quotation)[^0-9]*([0-9]{4,7}\/[0-9]{1,3})/i)||ln.match(/\b([0-9]{4,7}\/[0-9]{1,3})\b/);
      if(nr&&!offer&&!/Tel|Fax|Phone/i.test(ln)) offer=nr[1];
      const cl=ln.match(/(Mr|Mrs|Ms|M\/s)\.?\s+\S.*/i);
      if(cl&&!client&&!/Sales|Manager|Sr\./i.test(ln)){ client=ln.trim(); addrFrom=all.length; }
      const sm=ln.match(/Sales\s*(?:Manager|Person|Executive|by|Engineer)?\s*[:\-]\s*(.+)/i)||ln.match(/Sales\s+(?:Manager|Person|Executive)\s+(.+)/i);
      if(sm&&!salesRaw) salesRaw=sm[1];
      all.push(ln);
    }
  }
  let cur=null; const blocks=[];
  for(const ln of all){ if(RE_LBL.test(ln)){ cur={label:qLabel(ln),text:ln}; blocks.push(cur); } else if(cur) cur.text+=' '+ln; }
  const items=[], seen={};
  for(const b of blocks){
    const tk={}; let m; RE_MEAS.lastIndex=0;
    while((m=RE_MEAS.exec(b.text))){ if(tk[m[1]]==null) tk[m[1]]=normNum(m[2]); }
    let W=null,H=null;
    if(tk.B!=null&&tk.H!=null){W=tk.B;H=tk.H;} else if(tk.L!=null&&tk.A!=null){W=tk.L;H=tk.A;}
    if(W==null||H==null) continue;
    let ref=b.label||('Position '+(items.length+1));
    if(seen[ref]==null) seen[ref]=1; else { seen[ref]++; ref+=' ('+seen[ref]+')'; }
    items.push({ref,w:W,h:H,sqft:(W*H)/(304.8*304.8)});
  }
  const rawClient=client.split(/\s{2,}|,|\|/)[0].trim();
  client=client.replace(/^(M\/s|Mr|Mrs|Ms)\.?\s*/i,'').split(/\s{2,}|,|\|/)[0].trim().slice(0,60);
  const upvc=/u\s*pvc|\bpvc\b/i.test(text), alu=/alumin/i.test(text);
  const addrTxt=addrFrom>=0?all.slice(addrFrom,addrFrom+6).join(', '):'';
  return {offer,client,party:partyType(rawClient),sales:taSales(salesRaw),city:taCity(addrTxt)||taCity(text.slice(0,1500)),items,total:items.reduce((s,q)=>s+q.sqft,0),service:(upvc&&!alu)?'UPVC Windows & Doors':'Aluminium Windows & Doors'};
}


/* PDF picker: every PDF read shows as a ✓ row; "+" adds more parts of the same order; ✕ removes one.
   onChange(combined-or-null) runs after every change. */
function pdfPicker(root, opts){
  const list=[]; let busy=0, extPlus=!!opts.plus;
  root.innerHTML='<div class="pk-list"></div>'
    +'<div class="pk-add"><button type="button" class="qup pk-up">📄 Upload PDF</button><button type="button" class="qup pk-lib">🔎 By Offer No</button></div>'
    +'<input type="file" class="pk-file" accept="application/pdf,.pdf" multiple hidden><div class="qinfo pk-msg" style="margin-top:6px"></div>';
  const L=root.querySelector('.pk-list'), up=root.querySelector('.pk-up'), lib=root.querySelector('.pk-lib'), f=root.querySelector('.pk-file'), msg=root.querySelector('.pk-msg');
  const say=(t,c)=>{ msg.className='qinfo pk-msg'+(c?' '+c:''); msg.textContent=t||''; };
  const short=o=>{ const pp=LD.parts(o||''); return pp.parts.length?'/'+pp.parts.join('/'):''; };
  function draw(){
    const ST={saving:['…','busy','saving…'],saved:['✓','','uploaded'],err:['!','none','NOT saved — '],ready:['✓','',opts.readyText||'ready']};
    L.innerHTML=list.map((q,i)=>{ if(opts.hideSaved && q._st==='saved') return ''; const s=ST[q._st||(q.fromLib?'saved':'ready')];
      return '<div class="pk-row '+s[1]+'"><div class="tk">'+s[0]+'</div><div class="tx"><b>'+(q.offer?'#'+esc(q.offer):'No Offer No')+'</b> · '+(q.kind==='production'?'Production sheet':'Quotation')+' · '+s[2]+(q._st==='err'?esc(q._err||''):'')
      +'<span>'+q.items.length+' positions · '+q.total.toFixed(2)+' sq.ft'+(q.fromLib?' · from library':'')+(q.file&&q.file.name?' · '+esc(q.file.name):'')+'</span></div>'
      +'<button type="button" class="rm" data-i="'+i+'" title="Remove">✕</button></div>'; }).join('')
      +(busy?'<div class="pk-row busy"><div class="tk">…</div><div class="tx">Reading '+busy+' PDF'+(busy>1?'s':'')+'…</div></div>':'');
    L.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ list.splice(+b.getAttribute('data-i'),1); changed(); });
    // first time: two big buttons; after a PDF is in: a "+" to add the next part
    if(list.length||extPlus){ up.textContent='+'; up.title='Add another part (e.g. /8, /9)'; up.classList.add('plus'); lib.textContent='🔎 Add by Offer No'; }
    else { up.textContent='📄 Upload PDF'; up.title=''; up.classList.remove('plus'); lib.textContent='🔎 By Offer No'; }
  }
  function combined(){ return list.length?combineQs(list.slice()):null; }
  function changed(){
    draw(); const q=combined();
    if(q && list.length>1) say('Total '+list.length+' parts · #'+q.offer+' · '+q.items.length+' positions · '+q.total.toFixed(2)+' sq.ft','ok'); else say('');
    if(opts.onChange) opts.onChange(q);
  }
  async function add(arr){
    busy+=arr.length; draw(); say('');
    const got=[];
    for(const a of arr){
      try{ const one=await parseQuotationTA(a.file); one.file=a.file; one.fromLib=!!a.fromLib; if(!one.offer&&a.meta) one.offer=a.meta.offer; one.meta=a.meta; got.push(one); }
      catch(e){ say('⚠ '+(a.file&&a.file.name?a.file.name+': ':'')+(e.message||"Couldn't read PDF"),'err'); }
      busy--; draw();
    }
    for(const one of got){
      const dup=list.findIndex(x=>x.offer && one.offer && cleanOffer(x.offer).toUpperCase()===cleanOffer(one.offer).toUpperCase());
      if(dup>=0){ if(confirm('#'+one.offer+' is already added.\n\nOK = replace it with this PDF\nCancel = keep the one already added')) list[dup]=one; continue; }
      const bases=[...new Set(list.concat([one]).map(x=>LD.parts(x.offer).base).filter(Boolean))];
      if(bases.length>1 && !confirm('#'+one.offer+' is a different order ('+bases.join(', ')+').\n\nAdd it to this booking anyway?')) continue;
      list.push(one);
    }
    changed();
    if(opts.saveNow) for(const one of got){ if(!list.includes(one) || one.fromLib) continue;
      one._st='saving'; draw();
      try{ await opts.saveNow(one); one._st='saved'; }catch(e){ one._st='err'; one._err=e.message||'save failed'; }
      draw(); }
    if(opts.saveNow && opts.afterSave) opts.afterSave();
  }
  up.onclick=()=>f.click();
  f.onchange=async()=>{ const fs=[...f.files]; f.value=''; if(fs.length) await add(fs.map(x=>({file:x,fromLib:false}))); };
  lib.onclick=()=>LD.openLoader(async(file,kind,meta)=>{ await add([{file,fromLib:true,meta}]); },
    list.length?LD.parts(list[0].offer).base:((opts.offerEl&&opts.offerEl.value)||'').trim(), 'production',
    {onMany:async(docs)=>{ await add(docs.map(d=>({file:d.file,fromLib:true,meta:d.meta}))); }});
  draw();
  return {list, combined, say, setPlus:v=>{ extPlus=!!v; draw(); }, redraw:draw};
}

/* ===================== HOLD → reason + e-mail to customer / dealer / salesperson ===================== */
const HOLD_REASONS={
  'Customer':['Site not ready (civil / plaster / paint / flooring work pending)','Openings not ready as per measurement','Customer asked to stop the work','Payment pending','Site access / permission not available','Other'],
  'Factory':['Material pending from factory','Glass pending','Hardware / accessories pending','Rework / replacement needed','Other'],
  'Installation Team':['Installation team not available','Other']
};
let _contacts=null;
async function loadContacts(){
  if(_contacts) return _contacts;
  try{ const r=await fetch(API+'?action=contacts&key='+encodeURIComponent(KYC_KEY)+'&t='+Date.now(),{cache:'no-store'}); const d=await r.json(); _contacts=(d&&d.ok&&d.contacts)||[]; }
  catch(e){ _contacts=[]; }
  try{ const loc=JSON.parse(localStorage.getItem('lingel_contacts')||'[]'); loc.forEach(c=>{ if(!_contacts.some(x=>x.name.toLowerCase()===c.name.toLowerCase())) _contacts.push(c); }); }catch(e){}
  return _contacts;
}
const contactOf=n=>{ n=String(n||'').trim().toLowerCase(); if(!n||!_contacts) return ''; const c=_contacts.find(x=>x.name.toLowerCase()===n); return c?c.email:''; };
function rememberContacts(list){
  try{ const loc=JSON.parse(localStorage.getItem('lingel_contacts')||'[]');
    list.forEach(c=>{ const i=loc.findIndex(x=>x.name.toLowerCase()===c.name.toLowerCase()); if(i>=0) loc[i]=c; else loc.push(c); });
    localStorage.setItem('lingel_contacts',JSON.stringify(loc)); }catch(e){}
  if(_contacts) list.forEach(c=>{ const i=_contacts.findIndex(x=>x.name.toLowerCase()===c.name.toLowerCase()); if(i>=0) _contacts[i]=c; else _contacts.push(c); });
}

  {v:'No-show',      l:'No-show at commitment',  per:'sqft',  rate:5,   unit:'₹5 / sq.ft'},
  {v:'Bad silicone', l:'Bad silicone work',      per:'sqft',  rate:10,  unit:'₹10 / sq.ft'},

async function finePhoto(file){   // shrink to ~1280px JPEG before upload
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k=Math.min(1,1280/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8).split(',')[1];
}

/* WhatsApp fine notice: the fine just marked (or tapped) + ALL fines on this site and the total to be deducted.
   all = fines list from the sheet ({id,date,type,amount,original,...}); may be empty while loading/offline. */
function fineMessage(name,team,tm,f,all){
  const dt=s=>{ const d=new Date(String(s).slice(0,10)+'T00:00:00'); return isNaN(d)?String(s||''):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
  const det=!f.qty?'':f.type.per==='sqft'?f.qty+' sq.ft × ₹'+f.type.rate:f.type.per==='cost'?'50% of glass cost ₹'+f.qty:'';
  const L=['*LINGEL — FINE NOTICE*','',
    'Contractor: '+name+' (Team '+team+')',
    'Site: #'+tm.offer+(tm.project?' · '+tm.project:'')+(tm.city?' · '+tm.city:''),'',
    '*Fine — '+dt(f.date)+'*',
    'Rule broken: '+f.type.l,
    det?'Details: '+det:null,
    'Fine: '+fineInr(f.amt)+(f.original>0?' (reduced from '+fineInr(f.original)+')':''),
    'What happened: '+f.why,
    f.photo?'Photo: '+f.photo:null,
    'Marked by: '+(f.by||SUP)];
  let list=(all||[]).slice();
  if(f.id && !list.some(x=>x.id===f.id)) list.push({id:f.id,date:f.date,type:f.type.v,amount:f.amt,original:f.original||0});
  if(!list.length) list=[{id:'_',date:f.date,type:f.type.v,amount:f.amt,original:f.original||0}];
  list.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const tot=list.reduce((s,x)=>s+(+x.amount||0),0);
  if(list.length>1){
    L.push('','*All fines on this site ('+list.length+'):*');
    list.forEach((x,k)=>L.push((k+1)+'. '+dt(x.date)+' · '+x.type+' · '+(x.amount>0?fineInr(x.amount):'₹0 (waived)')+(x.original>0&&x.amount>0?' (reduced)':'')+(f.id&&x.id===f.id?(f.isNew?'  ← new':'  ← this one'):'')));
  }
  L.push('','*Total to be deducted: '+fineInr(tot)+'*'+(f.invoiceNo?' (Invoice '+f.invoiceNo+')':''),
    'यह राशि आपके बिल से काटी जाएगी।');
  return L.filter(l=>l!==null).join('\n');
}
