<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>Lingel — Team Availability</title>
<meta name="theme-color" content="#13161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#ffce1f;--green:#22c55e;--red:#ef4444;--blue:#5b9bd5;--amber:#f0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Spline Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.home:active{background:var(--panel-2)}
.who{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--hivis);font-family:'Archivo Narrow';text-transform:uppercase;letter-spacing:.03em;display:block}
.hdr{padding-bottom:14px;border-bottom:2px solid var(--line);margin-bottom:14px}
.hdr .t{font-family:Archivo;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.hdr .s{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.vtabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.vtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:11px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.vtab.on{background:var(--hivis);color:#111}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat.g{border-left:4px solid var(--green)}.stat.r{border-left:4px solid var(--red)}.stat.n{border-left:4px solid var(--amber)}
.stat .n{font-family:Archivo;font-weight:900;font-size:23px;line-height:1}
.stat.g .n{color:var(--green)}.stat.r .n{color:var(--red)}.stat.n .n{color:var(--amber)}
.stat .l{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px 11px 36px;font-size:15px;background:var(--panel-2);color:var(--text);font-family:'Spline Sans',sans-serif}
.search input:focus{outline:2px solid var(--hivis);outline-offset:-1px}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.rf{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;width:44px;height:44px;font-size:18px;cursor:pointer;flex-shrink:0}
.rf:active{background:var(--panel-2)}.rf.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;min-height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.dot.busy{background:var(--hivis);box-shadow:0 0 0 3px rgba(255,206,31,.18)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .lg{background:var(--green)}.legend .lr{background:var(--red)}.legend .ln{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px}
.card .nm{font-family:Archivo;font-weight:700;font-size:16px;line-height:1.15;word-break:break-word}
.card .role{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.teams{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.team{flex:1 1 46%;min-width:98px;border:1px solid var(--line);border-left:4px solid var(--red);background:var(--panel-2);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s,border-color .15s}
.team:active{transform:scale(.96)}
.team.avail{border-left-color:var(--green);background:linear-gradient(180deg,rgba(34,197,94,.13),rgba(34,197,94,.04))}
.team.na{border-left-color:var(--amber);background:rgba(240,166,58,.06)}
.team .tl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.team .ts{font-family:Archivo;font-weight:700;font-size:13px;margin-top:3px}
.team.avail .ts{color:#86efac}.team:not(.avail):not(.na) .ts{color:#fda4a4}.team.na .ts{color:var(--amber)}
.team .to{font-size:10px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono';line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.held{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.heldhd{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.heldhd .hchev{display:inline-block;transition:transform .15s;font-size:11px}
.held.open .heldhd .hchev{transform:rotate(90deg)}
.heldhd .hcnt{font-family:'JetBrains Mono';font-size:9.5px;background:rgba(240,166,58,.15);color:var(--amber);border-radius:20px;padding:1px 7px}
.held .hitem{display:none}
.held.open .hitem{display:flex;margin-top:8px}
.hitem{align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:9px 10px}
.hinfo{flex:1;min-width:0}
.hoffer{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow2{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow2 .hk{font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);opacity:.75;margin-right:3px}
.hacts{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.hbtn{border:none;border-radius:9px;padding:9px 11px;font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.hbtn.hresume{background:var(--hivis);color:#111}
.hbtn.hcancel{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hbtn:active{transform:scale(.94)}
.team.busy{opacity:.5;pointer-events:none}
.thead{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.swwrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.swlbl{font-family:'JetBrains Mono';font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.swlbl.ond{color:#86efac}
.swlbl.onl{color:var(--amber)}
.sw{position:relative;width:46px;height:26px;border-radius:26px;background:var(--panel);border:1px solid var(--line);cursor:pointer;flex-shrink:0;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw.on{background:rgba(34,197,94,.22);border-color:var(--green)}
.sw.on::after{transform:translateX(20px);background:var(--green)}
.sw.busy{opacity:.5;pointer-events:none}
/* reports */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
.kc.a{border-left:4px solid var(--red)}.kc.o{border-left:4px solid var(--hivis)}.kc.c{border-left:4px solid var(--green)}.kc.t{border-left:4px solid var(--blue)}
.kc .n{font-family:Archivo;font-weight:900;font-size:26px;line-height:1}
.kc.a .n{color:#fda4a4}.kc.o .n{color:var(--hivis)}.kc.c .n{color:#86efac}.kc.t .n{color:#a9cdf0}
.kc .l{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:7px;line-height:1.4}
.kc .subv{font-size:11px;color:var(--muted);margin-top:3px}
.rtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px}
.rtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:8px;padding:9px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.rtab.on{background:var(--hivis);color:#111}
.row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.row.act{border-left:4px solid var(--red)}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rname{font-family:Archivo;font-weight:700;font-size:15px}
.rmeta{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rsub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.rsub b{color:var(--text);font-weight:600}
.pill{display:inline-block;font-family:'JetBrains Mono';font-weight:700;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-left:6px}
.pill.active{background:rgba(239,68,68,.16);color:#fda4a4}.pill.released{background:rgba(34,197,94,.15);color:#86efac}.pill.reassigned{background:rgba(255,206,31,.15);color:var(--hivis)}
.ut{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.uthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.utname{font-family:Archivo;font-weight:700;font-size:14.5px}
.utnums{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}.utnums .on{color:#fda4a4}
.bar{height:7px;background:var(--panel-2);border-radius:4px;margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--hivis),#ffd956);border-radius:4px}
.utfoot{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted)}.utfoot b{color:var(--text)}
.ogrp{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--panel-2)}
.ooffer{font-family:Archivo;font-weight:900;font-size:15px;color:var(--hivis)}
.oproj{font-size:12px;color:var(--muted);margin-top:2px}
.ocount{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-transform:uppercase}
.oline{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.oline .who2{color:var(--text)}
.oline .when{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.6}
.msg.err{color:#fda4a4}
.msg button{margin-top:14px;background:var(--hivis);color:#111;border:none;border-radius:8px;padding:10px 22px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.skel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:100px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
.foot-note{text-align:center;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:26px;opacity:.65}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--hivis);border-radius:16px;padding:22px 20px;max-width:380px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.mbox.rel{border-top-color:var(--red)}.mbox.na{border-top-color:var(--amber)}
.mttl{font-family:Archivo;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.03em;line-height:1.2;margin-bottom:4px}
.msub{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.fd{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fd label{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fd input{border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:15px;background:var(--panel-2);color:var(--text);width:100%;font-family:'Spline Sans',sans-serif}
.fd input:focus{outline:2px solid var(--hivis);outline-offset:-1px}
.relinfo{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:14px;font-size:13px;line-height:1.7}
.relinfo b{color:var(--hivis);font-family:'Archivo Narrow'}
.relinfo .k{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mduty{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:14px}
.mduty .mdt{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mduty .mds{font-family:Archivo;font-weight:700;font-size:13.5px;margin-top:2px}
.mduty .mds.ond{color:#86efac}.mduty .mds.onl{color:var(--amber)}
.mErr{color:#fda4a4;font-size:12px;min-height:15px;margin:-4px 0 10px}
.mbtns{display:flex;gap:9px;margin-top:4px}
.mbtn{flex:1;border:none;border-radius:9px;padding:12px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.mbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.mbtn.go{background:var(--hivis);color:#111}
.mbtn.danger{background:var(--red);color:#fff}
.mbtn.amber{background:var(--amber);color:#111}
/* segmented control */
.seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);border-radius:6px;padding:9px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.seg button.on{background:var(--hivis);color:#111}
/* ===== DAY PLAN ===== */
.planbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pbtn{border:none;border-radius:9px;padding:11px 14px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;background:var(--hivis);color:#111}
.pbtn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.pbtn:active{transform:scale(.97)}
.preporthd{padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:14px}
.prt{font-family:Archivo;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.prs{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pday{margin-bottom:20px}
.pdayhd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--hivis);border-radius:10px;padding:9px 13px;margin-bottom:12px}
.pdlbl{font-family:Archivo;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--hivis)}
.pddate{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pdhr{display:flex;align-items:center;gap:12px}
.sameas{display:inline-flex;align-items:center;gap:6px;font-family:'Archivo Narrow';font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sameas input{width:17px;height:17px;accent-color:var(--hivis);cursor:pointer;margin:0}
/* supervisor board */
#supDaySeg{flex:1}
.schip{border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--panel-2);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;flex:1 1 46%;min-width:98px;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.schip:active{transform:scale(.96)}
.schip.tmeas{border-left-color:var(--blue);background:rgba(91,155,213,.09)}
.schip.tvisit{border-left-color:var(--amber);background:rgba(240,166,58,.07)}
.schip .tl{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.schip .ts{font-family:Archivo;font-weight:700;font-size:13px;margin-top:3px}
.schip.tmeas .ts{color:#a9cdf0}.schip.tvisit .ts{color:var(--amber)}
.schip .to{font-size:10px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schip.add{border-left-color:var(--line);display:flex;align-items:center;justify-content:center;min-height:56px}
.schip.add .ts{color:var(--muted)}
.psec{margin-bottom:14px}
.psectt{font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.psectt .cnt{font-family:'JetBrains Mono';font-size:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:1px 8px}
.sgrp{margin-bottom:10px}
.shead{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--hivis);background:rgba(255,206,31,.08);border-radius:6px;padding:5px 9px;margin-bottom:6px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.pmain{flex:0 0 auto}
.pc{font-family:Archivo;font-weight:700;font-size:14px}
.pt{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);margin-left:6px}
.psite{flex:1 1 auto;font-size:12.5px;color:var(--muted);text-align:right;line-height:1.5;min-width:120px}
.psite b{color:var(--text);font-family:'Archivo Narrow'}
.pcity{display:inline-block;margin-left:8px;color:var(--muted)}
.psales{display:inline-block;margin-left:8px;font-family:'JetBrains Mono';font-size:10px;color:var(--muted)}
.hold{display:inline-block;background:rgba(240,166,58,.15);color:var(--amber);font-family:'JetBrains Mono';font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
.tbadge{display:inline-block;font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-left:8px}
.tbadge.meas{background:rgba(91,155,213,.18);color:#a9cdf0}
.tbadge.visit{background:rgba(240,166,58,.16);color:var(--amber)}

<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">← Hub</a>
    <div class="who" id="who"></div>
  </div>
  <div class="hdr">
    <div class="t">team Availability</div>
    <div class="s">Tap a team to book, release, or set on leave (NA)</div>
  </div>
  <div class="vtabs">
    <button class="vtab on" data-view="board">Board</button>
    <button class="vtab" data-view="plan">📋 Day Plan</button>
  </div>

  <div id="boardView">
    <div class="rtabs" id="boardSub">
      <button class="rtab on" data-bsub="teams">👷 teams</button>
      <button class="rtab" data-bsub="supervisors">👔 Supervisors</button>
    </div>
    <div id="conBoard">
    <div class="stats">
      <div class="stat g"><div class="n" id="cFree">–</div><div class="l">Teams Free</div></div>
      <div class="stat r"><div class="n" id="cBooked">–</div><div class="l">Booked</div></div>
      <div class="stat n"><div class="n" id="cNA">–</div><div class="l">On Leave</div></div>
      <div class="stat"><div class="n" id="cTotal" style="color:var(--text)">–</div><div class="l">teams</div></div>
    </div>
    <div class="tools">
      <div class="search"><span class="mag">🔍</span><input id="q" placeholder="Search team…" autocomplete="off"></div>
      <button class="rf" id="refreshB" title="Refresh">⟳</button>
    </div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Loading…</span></div>
    <div class="legend"><span><i class="lg"></i> Free</span><span><i class="lr"></i> Booked</span><span><i class="ln"></i> On leave (NA)</span></div>
    <div id="grid" class="grid"></div>
    </div>
    <div id="supBoard" hidden>
      <div class="tools">
        <div class="seg" id="supDaySeg"><button type="button" data-val="today">Today</button><button type="button" data-val="tomorrow" class="on">Tomorrow</button></div>
        <button class="rf" id="refreshSup" title="Refresh">⟳</button>
      </div>
      <div class="sync"><span class="dot" id="dotS"></span><span id="syncS">Tap a slot to plan · up to 4 per supervisor/day</span></div>
      <div id="supGrid" class="grid"></div>
    </div>
  </div>

  <div id="planView" hidden>
    <div class="planbar noprint">
      <button id="btnAddSup" class="pbtn">＋ Supervisor plan</button>
      <button id="btnWa" class="pbtn wa">🟢 Share PDF (WhatsApp)</button>
      <button id="btnCopy" class="pbtn ghost">📋 Copy</button>
      <button class="rf" id="refreshP" title="Refresh">⟳</button>
    </div>
    <div class="sync noprint"><span class="dot" id="dotP"></span><span id="syncP">—</span></div>
    <div id="planReport"></div>
  </div>

  <div class="foot-note">Lingel Field Operations · Live status in teams · full history in Bookings</div>
</div>

<datalist id="dlSales"></datalist>
<datalist id="dlSup"></datalist>

<div class="modal" id="modal" hidden>
  <div class="mbox" id="mbox">
    <div class="mttl" id="mTtl"></div>
    <div class="msub" id="mSub"></div>
    <div id="mBody"></div>
    <div class="mErr" id="mErr"></div>
    <div class="mbtns">
      <button class="mbtn ghost" id="mCancel">Cancel</button>
      <button class="mbtn go" id="mGo">OK</button>
    </div>
  </div>
</div>

<script>
const INVOICE_EXEC = "https://script.google.com/macros/s/AKfycbyU_cHRuQH8aiS8SIKynGIeXoTukfp16SgA9OfKnf83Me7bW2hT8kULPUFw-JB1gEhnTw/exec";
const API = (function(){ if(INVOICE_EXEC && INVOICE_EXEC.indexOf('script.google.com')>=0) return INVOICE_EXEC; try{ var a=localStorage.getItem('lingel_api'); if(a) return a; }catch(e){} return INVOICE_EXEC; })();
const POLL_BOARD=8000, CACHE_KEY='lingel_teams_cache_v5';
const SUP=(function(){ try{ var s=JSON.parse(localStorage.getItem('lingel_supervisor')||'null'); return (s&&s.name)?s.name:''; }catch(e){ return ''; } })();
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
document.getElementById('who').innerHTML = SUP ? '<span>Signed in as</span><b>'+esc(SUP)+'</b>' : '<b style="color:var(--muted)">Not signed in</b>';

let view='board', rows=[], bookings=[];
const pending=new Map();
const heldOpen=new Set();
let filter='', rfilter='', rtab='active';
let pollTimer=null, firstLoad=true, bookingsLoaded=false;

/* ===== DAY-PLAN state ===== */
const POLL_PLAN=20000;
const PLAN_KEY='lingel_dayplan_v1', SALES_KEY='lingel_salespeople_v1', SUP_KEY='lingel_supervisors_v1';
let plans=[], supList=[], salesSet=new Set(), supDay='tomorrow';
let deletedPlanIds=new Set(); try{ deletedPlanIds=new Set(JSON.parse(localStorage.getItem('lingel_plan_tombstones_v1')||'[]')); }catch(e){}
function saveTombstones(){ try{ localStorage.setItem('lingel_plan_tombstones_v1', JSON.stringify([...deletedPlanIds].slice(-500))); }catch(e){} }
function dateOf(sel){ return sel==='today'?TODAY():TOMORROW(); }
function teamItems(date){
  if(date===TODAY()){
    const items=[];
    rows.forEach(r=>{ for(let t=1;t<=r.teams.length;t++){ const tm=teamOf(r,String(t)); if(tm && tm.status==='booked'){ const meta=planById('c|'+r.name+'|'+t+'|'+TODAY())||{}; items.push({ id:'c|'+r.name+'|'+t+'|'+TODAY(), contractor:r.name, team:String(t), offer:tm.offer||meta.offer||'', project:tm.project||meta.project||'', city:meta.city||'', salesperson:meta.salesperson||'', holdBy:meta.holdBy||'' }); } } });
    return items;
  }
  return planFor(date,'team');
}
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function TODAY(){ return isoDate(new Date()); }
function TOMORROW(){ const t=new Date(); t.setDate(t.getDate()+1); return isoDate(t); }
function prettyDate(iso){ const p=String(iso||'').split('-').map(Number); if(p.length<3) return iso||'—'; const dt=new Date(p[0],p[1]-1,p[2]); return dt.toLocaleDateString([], {weekday:'short',day:'2-digit',month:'short'}); }
function normPlan(p){ p=p||{}; return { id:String(p.id||''), kind:(p.kind==='supervisor'?'supervisor':'team'), date:String(p.date||''), contractor:String(p.contractor||p.name||''), team:String(p.team||''), offer:String(p.offer||''), project:String(p.project||''), city:String(p.city||''), salesperson:String(p.salesperson||''), holdBy:String(p.holdBy||''), supervisor:String(p.supervisor||''), task:String(p.task||''), by:String(p.by||''), at:String(p.at||'') }; }
function loadPlansLocal(){ try{ const a=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]'); plans=Array.isArray(a)?a.map(normPlan):[]; }catch(e){ plans=[]; } }
function savePlansLocal(){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(plans)); }catch(e){} }
function loadSalesLocal(){ try{ (JSON.parse(localStorage.getItem(SALES_KEY)||'[]')||[]).forEach(s=>salesSet.add(s)); }catch(e){} }
function rememberSalesperson(s){ s=(s||'').trim(); if(!s) return; salesSet.add(s); try{ localStorage.setItem(SALES_KEY, JSON.stringify([...salesSet])); }catch(e){} fillDatalist('dlSales',[...salesSet]); }
function fillDatalist(id,arr){ const dl=document.getElementById(id); if(!dl) return; dl.innerHTML=(arr||[]).map(v=>'<option value="'+esc(v)+'">').join(''); }
async function syncPlansFromServer(){ try{ const r=await fetch(API+'?action=dayplan&t='+Date.now()); const d=await r.json(); if(d&&d.ok!==false&&Array.isArray(d.plans)){ plans=d.plans.map(normPlan).filter(p=>!deletedPlanIds.has(p.id)); savePlansLocal(); return true; } }catch(e){} return false; }
async function pushPlan(entry){ try{ await fetch(API,{method:'POST',body:new URLSearchParams(Object.assign({action:'planUpsert'},entry))}); }catch(e){} }
async function pushPlanDelete(id){ deletedPlanIds.add(id); saveTombstones(); try{ await fetch(API,{method:'POST',body:new URLSearchParams({action:'planDelete',id:id})}); }catch(e){} }
function upsertPlan(entry){ if(deletedPlanIds.has(entry.id)){ deletedPlanIds.delete(entry.id); saveTombstones(); } const i=plans.findIndex(p=>p.id===entry.id); if(i>=0) plans[i]=entry; else plans.push(entry); savePlansLocal(); pushPlan(entry); }
function planById(id){ return plans.find(p=>p.id===id); }
function planFor(date,kind){ return plans.filter(p=>p.date===date && p.kind===kind); }
function swapDate(id,d){ return String(id).replace(/\|[^|]*$/, '|'+d); }
async function loadSupervisors(){
  try{ const a=JSON.parse(localStorage.getItem(SUP_KEY)||'[]'); if(Array.isArray(a)) supList=a; }catch(e){}
  try{ const r=await fetch(API+'?action=supervisors&t='+Date.now()); const d=await r.json(); if(d&&d.ok!==false&&Array.isArray(d.supervisors)&&d.supervisors.length){ supList=d.supervisors.map(s=>String(s).trim()).filter(Boolean); try{ localStorage.setItem(SUP_KEY, JSON.stringify(supList)); }catch(e){} } }catch(e){}
  fillDatalist('dlSup', supList);
}

function setDot(id,txtId,kind,txt){ const d=document.getElementById(id); d.className='dot'+(kind?(' '+kind):''); if(txt!==undefined) document.getElementById(txtId).textContent=txt; }
function normStatus(v){ const s=String(v||'').toLowerCase(); return s==='booked'?'booked':s==='na'?'na':'available'; }
function normTeam(t){ t=t||{}; return { status:normStatus(t.status), offer:String(t.offer||'').trim(), project:String(t.project||'').trim(), by:String(t.by||'').trim(), at:t.at||'', salesperson:String(t.salesperson||'').trim(), city:String(t.city||'').trim() }; }
function normHeld(h){ h=h||{}; return { offer:String(h.offer||'').trim(), project:String(h.project||'').trim(), team:String(h.team||'').trim(), city:String(h.city||'').trim(), salesperson:String(h.salesperson||'').trim(), holdBy:String(h.holdBy||'').trim(), heldOn:String(h.heldOn||'') }; }
function shortDate(v){ const d=new Date(v); return isNaN(d)?'' : d.toLocaleDateString([], {day:'2-digit',month:'short'}); }
function normRow(c){ let teams=Array.isArray(c.teams)?c.teams.map(normTeam):[]; if(!teams.length) teams=[normTeam(c.team1),normTeam(c.team2)]; return { name:String(c.name||'').trim(), code:String(c.code||'').trim(), role:String(c.role||'').trim(), teamCount:teams.length, teams:teams, held:Array.isArray(c.held)?c.held.map(normHeld):[] }; }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); }catch(e){} }
function loadCache(){ try{ var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); return Array.isArray(c)?c.map(normRow):null; }catch(e){ return null; } }
function teamOf(r,t){ return r.teams[Number(t)-1]; }
function dispTeam(r,t){ const k=r.name+'|'+t; return pending.has(k)?pending.get(k):teamOf(r,t); }

/* ============ BOARD ============ */
function counts(){
  let free=0, booked=0, na=0;
  rows.forEach(r=>{ for(let t=1;t<=r.teams.length;t++){ const st=dispTeam(r,String(t)).status; if(st==='booked')booked++; else if(st==='na')na++; else free++; } });
  document.getElementById('cFree').textContent=free;
  document.getElementById('cBooked').textContent=booked;
  document.getElementById('cNA').textContent=na;
  document.getElementById('cTotal').textContent=rows.length;
}
function teamChip(r,t){
  const tm=dispTeam(r,t), busy=pending.has(r.name+'|'+t)?' busy':'';
  let cls, label, sub;
  if(tm.status==='booked'){ cls=''; label='Booked'; sub=tm.offer?('#'+esc(tm.offer)+(tm.project?' · '+esc(tm.project):'')):'booked'; }
  else if(tm.status==='na'){ cls=' na'; label='On leave'; sub='tap to manage'; }
  else { cls=' avail'; label='Available'; sub='tap to book'; }
  return '<div class="team'+cls+busy+'" data-name="'+esc(r.name)+'" data-team="'+t+'"><div class="tl">Team '+t+'</div><div class="ts">'+label+'</div><div class="to">'+sub+'</div></div>';
}
function renderBoard(){
  const g=document.getElementById('grid'); counts();
  const list=rows.filter(r=> !filter || r.name.toLowerCase().includes(filter) || (r.role||'').toLowerCase().includes(filter));
  if(!rows.length){ g.innerHTML='<div class="msg">No teams found in the sheet.<br><span style="font-size:12px">Add names to the <b>teams</b> tab, then refresh.</span></div>'; return; }
  if(!list.length){ g.innerHTML='<div class="msg">No team matches “'+esc(filter)+'”.</div>'; return; }
  g.innerHTML=list.map(r=>{ let chips=''; for(let t=1;t<=r.teams.length;t++) chips+=teamChip(r,String(t));
    let heldHtml='';
    if(r.held && r.held.length){
      const open=heldOpen.has(r.name);
      heldHtml='<div class="held'+(open?' open':'')+'"><div class="heldhd" data-hname="'+esc(r.name)+'"><span class="hchev">▸</span> ⏸ On hold · needs work <span class="hcnt">'+r.held.length+'</span></div>'+
        r.held.map(h=>'<div class="hitem"><div class="hinfo">'+
            '<div class="hoffer">#'+esc(h.offer||'—')+(h.project?' · '+esc(h.project):'')+'</div>'+
            '<div class="hrow2"><span class="hk">Salesperson</span> '+esc(h.salesperson||'—')+'</div>'+
            '<div class="hrow2">📅 '+esc(h.heldOn?shortDate(h.heldOn):'—')+(h.holdBy?' · '+esc(h.holdBy):'')+'</div>'+
          '</div>'+
          '<div class="hacts"><button class="hbtn hresume" data-hname="'+esc(r.name)+'" data-hoffer="'+esc(h.offer)+'" data-hheld="'+esc(h.heldOn)+'">▶ Resume</button>'+
          '<button class="hbtn hcancel" data-hname="'+esc(r.name)+'" data-hoffer="'+esc(h.offer)+'" data-hheld="'+esc(h.heldOn)+'" title="Remove held site">✕</button></div></div>').join('')+'</div>';
    }
    return '<div class="card"><div class="nm">'+esc(r.name)+'</div>'+(r.role?'<div class="role">'+esc(r.role)+'</div>':'')+'<div class="teams">'+chips+'</div>'+heldHtml+'</div>'; }).join('');
}
async function loadBoard(silent){
  if(!silent) setDot('dot','syncTxt','busy','Syncing…');
  document.getElementById('refreshB').classList.add('spin');
  try{
    const r=await fetch(API+'?action=contractors&t='+Date.now()); const data=await r.json();
    if(!data||data.ok===false) throw new Error((data&&data.error)||'Server error');
    rows=(data.contractors||data.teams||[]).map(normRow).filter(c=>c.name);
    saveCache(); renderBoard();
    setDot('dot','syncTxt','ok','Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})); firstLoad=false;
  }catch(e){
    if(firstLoad){ const cached=loadCache(); if(cached&&cached.length){ rows=cached; renderBoard(); setDot('dot','syncTxt','err','Offline · last known state'); }

  return out;

function mergedContractorItems(){
  const map={}, order=[];
  const key=p=>(p.contractor||'')+'|'+(p.team||'')+'|'+(p.offer||'')+'|'+(p.project||'');
  function ensure(p){ const k=key(p); if(!map[k]){ map[k]={contractor:p.contractor||'',team:p.team||'',offer:p.offer||'',project:p.project||'',city:p.city||'',salesperson:p.salesperson||'',held:false,today:false,tomorrow:false,todayId:null,tomorrowId:null}; order.push(k);} const r=map[k]; if(p.city&&!r.city) r.city=p.city; if(p.salesperson&&!r.salesperson) r.salesperson=p.salesperson; return r; }
  teamItems(TODAY()).forEach(it=>{ const r=ensure(it); r.today=true; r.todayId=it.id; });
  planFor(TOMORROW(),'team').forEach(p=>{ const r=ensure(p); r.tomorrow=true; r.tomorrowId=p.id; });
  const held=[];
  rows.forEach(rw=>{ (rw.held||[]).forEach(h=>held.push({ held:true, contractor:rw.name, team:h.team, offer:h.offer, project:h.project, city:h.city, salesperson:h.salesperson, holdBy:h.holdBy, heldOn:h.heldOn })); });
  return order.map(k=>map[k]).concat(held);
}
function groupBy(list,keyFn,unlabel){
  const g={}; list.forEach(p=>{ const k=(keyFn(p)||'').trim()|| ('— '+unlabel+' —'); (g[k]||(g[k]=[])).push(p); });
  return Object.keys(g).sort((a,b)=>{ const au=a.charAt(0)==='—', bu=b.charAt(0)==='—'; if(au&&!bu) return 1; if(bu&&!au) return -1; return a.toLowerCase().localeCompare(b.toLowerCase()); }).map(k=>({key:k, items:g[k]}));
}

  if(!sg.length) out+='  (none)\n';
  sg.forEach(function(grp){ out+='\n▸ '+grp.key+'\n'; grp.items.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(function(p){
    out+='  • #'+(p.offer||'—')+(p.project?' | '+p.project:'')+(p.city?' | '+p.city:'')+(p.salesperson?' | '+p.salesperson:'')+' | '+(p.task||'—')+' | '+dayTag(p.date)+' '+prettyDate(p.date)+'\n'; }); });
  return out;
}
/* ===== PDF export + WhatsApp share (renders the actual report, print look) ===== */
let _pdfLoad=null;
function _loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load PDF library (need internet)')); document.head.appendChild(s); }); }
function ensurePdfLib(){
  if(window.jspdf && window.jspdf.jsPDF && window.html2canvas) return Promise.resolve();
  if(!_pdfLoad){ _pdfLoad=(async()=>{
    if(!(window.jspdf && window.jspdf.jsPDF)) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(!window.html2canvas) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  })().catch(e=>{ _pdfLoad=null; throw e; }); }
  return _pdfLoad;
}
async function sharePlanPdf(){
  setDot('dotP','syncP','busy','Building PDF…');
  try{
    await ensurePdfLib();
    const holder=document.createElement('div'); holder.className='pdflight';
    holder.style.cssText='position:fixed;left:-10000px;top:0;width:820px;';
    holder.innerHTML=document.getElementById('planReport').innerHTML;
    document.body.appendChild(holder);
    const canvas=await window.html2canvas(holder,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:820});
    document.body.removeChild(holder);
    const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const iw=pw, ih=canvas.height*pw/canvas.width, img=canvas.toDataURL('image/png');
    let heightLeft=ih, position=0;
    pdf.addImage(img,'PNG',0,position,iw,ih); heightLeft-=ph;
    while(heightLeft>0){ position-=ph; pdf.addPage(); pdf.addImage(img,'PNG',0,position,iw,ih); heightLeft-=ph; }
    const fname='Lingel-DayPlan-'+TODAY()+'.pdf', blob=pdf.output('blob');
    const file=new File([blob],fname,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Lingel Day Plan', text:'Lingel Day Plan · '+prettyDate(TODAY())+' → '+prettyDate(TOMORROW()) });
      setDot('dotP','syncP','ok','Shared PDF');
    } else {
      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
      setDot('dotP','syncP','ok','PDF saved — attach it in WhatsApp');
    }
  }catch(e){ if(e && e.name==='AbortError'){ setDot('dotP','syncP','ok','Share cancelled'); return; } setDot('dotP','syncP','err',(e && e.message)||'PDF failed'); }
}
function openRelease(name,team,tm){
  setBox('rel');
  document.getElementById('mTtl').textContent='Manage '+name;
  document.getElementById('mSub').textContent='Team '+team+' · release or put on hold';
  document.getElementById('mBody').innerHTML='<div class="relinfo"><div><span class="k">Offer</span><br><b>'+(tm.offer?('#'+esc(tm.offer)):'—')+'</b></div>'+(tm.project?'<div style="margin-top:8px"><span class="k">Project</span><br>'+esc(tm.project)+'</div>':'')+(tm.by?'<div style="margin-top:8px"><span class="k">Booked by</span><br>'+esc(tm.by)+'</div>':'')+'</div>'
    +'<div class="fd"><label>Put on hold — frees the crew, keeps the site as pending work</label>'+seg('segHold',[{v:'Customer',l:'Customer'},{v:'Factory',l:'Factory'},{v:'Installation Team',l:'Install'}],'')+'</div>';
  showMErr(''); const go=document.getElementById('mGo'); go.textContent='Release (job done)'; go.className='mbtn danger'; modal.hidden=false;
  document.querySelectorAll('#mBody #segHold button').forEach(b=>b.onclick=()=>{ const v=b.getAttribute('data-val'); closeModal(); holdSite(name,team,v); });
  goHandler=()=>{ closeModal(); release(name,team); };
}
function openNAModal(name,team){
  setBox('na');
  document.getElementById('mTtl').textContent=name;
  document.getElementById('mSub').textContent='Team '+team+' · on leave';
  document.getElementById('mBody').innerHTML=dutyRow(false)+'<div class="relinfo">This team is on leave and can’t be booked. Flip the switch (or the button below) to bring it back on duty.</div>';
  showMErr(''); const go=document.getElementById('mGo'); go.textContent='Set on duty'; go.className='mbtn go'; modal.hidden=false;
  wireDutySwitch(name,team);
  goHandler=()=>{ closeModal(); setNA(name,team,false); };
}
function handleSwitch(name,team){
  const r=rows.find(x=>x.name===name); if(!r) return; const tm=dispTeam(r,team);
  if(tm.status==='na'){ setNA(name,team,false); return; }        // on leave -> on duty
  if(tm.status==='booked'){ openLeave(name,team,tm); return; }   // booked -> confirm ending the job
  setNA(name,team,true);                                          // available -> on leave
}
function openLeave(name,team,tm){
  setBox('na');
  document.getElementById('mTtl').textContent='Set Team '+team+' on leave';
  document.getElementById('mSub').textContent=name+' · this team is booked';
  document.getElementById('mBody').innerHTML='<div class="relinfo">Team '+team+' is booked on <b>#'+esc(tm.offer||'—')+'</b>'+(tm.project?' ('+esc(tm.project)+')':'')+'. Putting it on leave will end that job and free the offer.</div>';
  showMErr(''); const go=document.getElementById('mGo'); go.textContent='On leave'; go.className='mbtn amber'; modal.hidden=false;
  goHandler=()=>{ closeModal(); setNA(name,team,true); };
}
document.getElementById('grid').addEventListener('click',e=>{
  const hh=e.target.closest('.heldhd'); if(hh){ const nm=hh.getAttribute('data-hname'); if(heldOpen.has(nm)) heldOpen.delete(nm); else heldOpen.add(nm); renderBoard(); return; }
  const rb=e.target.closest('.hresume'); if(rb){ resumeSite(rb.getAttribute('data-hname'), rb.getAttribute('data-hoffer'), rb.getAttribute('data-hheld')); return; }
  const cb=e.target.closest('.hcancel'); if(cb){ if(confirm('Remove this held site from '+cb.getAttribute('data-hname')+'? It will no longer show as pending work.')) cancelHeld(cb.getAttribute('data-hname'), cb.getAttribute('data-hoffer'), cb.getAttribute('data-hheld')); return; }
  const btn=e.target.closest('.team'); if(!btn) return;
  const name=btn.getAttribute('data-name'), team=btn.getAttribute('data-team');
  if(pending.has(name+'|'+team)) return;
  const r=rows.find(x=>x.name===name); if(!r) return; const tm=dispTeam(r,team);
  if(tm.status==='booked') openRelease(name,team,tm); else if(tm.status==='na') openNAModal(name,team); else openBook(name,team);
});
document.getElementById('q').addEventListener('input',e=>{ filter=e.target.value.trim().toLowerCase(); renderBoard(); });
document.getElementById('refreshB').addEventListener('click',()=>loadBoard());

/* ===== supervisor board wiring ===== */
document.querySelectorAll('#boardSub .rtab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#boardSub .rtab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  const s=b.getAttribute('data-bsub');

document.querySelectorAll('#supDaySeg button').forEach(b=>b.addEventListener('click',()=>{

  supDay=b.getAttribute('data-val'); renderSupBoard();
}));
document.getElementById('refreshSup').addEventListener('click',()=>{
  const btn=document.getElementById('refreshSup'); btn.classList.add('spin'); setDot('dotS','syncS','busy','Syncing…');
  loadSupervisors().then(()=>syncPlansFromServer()).then(ok=>{ renderSupBoard(); btn.classList.remove('spin'); setDot('dotS','syncS',ok?'ok':'err',ok?('Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})):'On this device only'); });

document.getElementById('supGrid').addEventListener('click',e=>{

});


/* ============ DAY-PLAN wiring ============ */
document.getElementById('planReport').addEventListener('click',e=>{ const b=e.target.closest('.pdel'); if(!b) return; const id=b.getAttribute('data-id'); if(confirm('Remove this from the plan?')) deletePlanEntry(id); });
document.getElementById('btnAddSup').addEventListener('click',()=>openSupPlan());
document.getElementById('btnWa').addEventListener('click',()=>sharePlanPdf());
document.getElementById('refreshP').addEventListener('click',()=>{ document.getElementById('refreshP').classList.add('spin'); syncPlansFromServer().then(ok=>{ renderPlan(); setDot('dotP','syncP',ok?'ok':'err',ok?('Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})):'On this device only'); document.getElementById('refreshP').classList.remove('spin'); }); });
document.getElementById('btnCopy').addEventListener('click',async()=>{ const t=planText(); try{ await navigator.clipboard.writeText(t); setDot('dotP','syncP','ok','Copied plan to clipboard'); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand('copy'); setDot('dotP','syncP','ok','Copied plan to clipboard'); }catch(_){ setDot('dotP','syncP','err','Copy failed — long-press to select'); } ta.remove(); } });

/* ============ VIEW SWITCH + POLL ============ */
function startPoll(){ stopPoll(); const iv=view==='board'?POLL_BOARD:POLL_PLAN; pollTimer=setInterval(()=>{ if(document.hidden||!modal.hidden) return; if(view==='board'){ if(pending.size===0) loadBoard(true); } else { syncPlansFromServer().then(ok=>{ if(ok) renderPlan(); }); } }, iv); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function switchView(v){
  view=v;
  document.querySelectorAll('.vtab').forEach(x=>x.classList.toggle('on', x.getAttribute('data-view')===v));
  document.getElementById('boardView').hidden = v!=='board';
  document.getElementById('planView').hidden = v!=='plan';
  if(v==='board' && !document.getElementById('supBoard').hidden) renderSupBoard();
  if(v==='plan'){ renderPlan(); setDot('dotP','syncP','busy','Syncing…'); Promise.all([syncPlansFromServer(), loadBoard(true)]).then(res=>{ renderPlan(); setDot('dotP','syncP',res[0]?'ok':'err',res[0]?('Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})):'On this device only'); }); }
  startPoll();
}
document.querySelectorAll('.vtab').forEach(b=>b.addEventListener('click',()=>switchView(b.getAttribute('data-view'))));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) closeModal(); else if(e.key==='Enter'&&!modal.hidden&&goHandler) goHandler(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopPoll(); else { if(view==='board') loadBoard(true); else syncPlansFromServer().then(ok=>{ if(ok) renderPlan(); }); startPoll(); } });
window.addEventListener('online',()=>{ if(view==='board') loadBoard(true); else syncPlansFromServer().then(ok=>{ if(ok) renderPlan(); }); });

/* ===== init day-plan ===== */
loadPlansLocal(); loadSalesLocal(); fillDatalist('dlSales',[...salesSet]); renderPlan(); loadSupervisors(); syncPlansFromServer().then(ok=>{ if(ok) renderPlan(); });

document.getElementById('grid').innerHTML=Array.from({length:6}).map(()=>'<div class="skel"></div>').join('');
loadBoard(); startPoll();
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
