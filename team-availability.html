<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Availability Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --available: #10b981;
      --busy: #ef4444;
      --remote: #f59e0b;
      --offline: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status-badge {
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .status-badge.connected { background: #dcfce7; color: #15803d; }
    .status-badge.loading { background: #fef3c7; color: #b45309; }
    .status-badge.error { background: #fee2e2; color: #b91c1c; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .avatar-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }

    .status-Available { background-color: var(--available); }
    .status-Busy { background-color: var(--busy); }
    .status-Remote { background-color: var(--remote); }
    .status-Offline { background-color: var(--offline); }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="title">Team Availability</h1>
    <span id="connection-status" class="status-badge loading">Connecting...</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Member</th>
        <th>Role</th>
        <th>Status</th>
        <th>Notes / Return Date</th>
      </tr>
    </thead>
    <tbody id="team-table-body">
      <tr>
        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">
          Loading availability data...
        </td>
      </tr>
    </tbody>
  </table>

  <div class="actions">
    <button onclick="fetchAvailabilityData()">Refresh Data</button>
  </div>
</div>

<script>
  // Replace this with your actual Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  async function fetchAvailabilityData() {
    const statusBadge = document.getElementById("connection-status");
    const tbody = document.getElementById("team-table-body");

    statusBadge.textContent = "Updating...";
    statusBadge.className = "status-badge loading";

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL);
      const data = await response.json();

      tbody.innerHTML = ""; // Clear existing rows

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 2rem;">No data found.</td></tr>`;
        return;
      }

      data.forEach(member => {
        const initials = member.name ? member.name.split(' ').map(n => n[0]).join('') : '?';
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>
            <div class="avatar-cell">
              <div class="avatar">${initials}</div>
              <div>
                <strong>${member.name || 'N/A'}</strong>
              </div>
            </div>
          </td>
          <td>${member.role || 'N/A'}</td>
          <td>
            <span class="status-dot status-${member.status}"></span>
            ${member.status || 'Unknown'}
          </td>
          <td>${member.notes || '-'}</td>
        `;

        tbody.appendChild(row);
      });

      statusBadge.textContent = "Connected";
      statusBadge.className = "status-badge connected";

    } catch (error) {
      console.error("Error fetching data:", error);
      statusBadge.textContent = "Connection Error";
      statusBadge.className = "status-badge error";
      
      tbody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align: center; color: var(--busy); padding: 2rem;">
            Failed to fetch team data. Please verify the Apps Script URL.
          </td>
        </tr>`;
    }
  }

  // Load data automatically when the page loads
  document.addEventListener("DOMContentLoaded", fetchAvailabilityData);
</script>

</body>
</html>
