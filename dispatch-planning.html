<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>Lingel — Dispatch Planning</title>
<meta name="theme-color" content="#13161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#ffce1f;--green:#22c55e;--red:#ef4444;--blue:#5b9bd5;--amber:#f0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Spline Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.who{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--hivis);font-family:'Archivo Narrow';text-transform:uppercase;letter-spacing:.03em;display:block}
.hdr{padding-bottom:14px;border-bottom:2px solid var(--line);margin-bottom:14px}
.hdr .t{font-family:Archivo;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.hdr .s{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.vtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.vtab{flex:1;border:none;background:transparent;color:var(--muted);border-radius:9px;padding:11px 6px;font-family:'Archivo Narrow';font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.vtab.on{background:var(--hivis);color:#111}
.vtab .vb{display:inline-block;min-width:18px;padding:1px 6px;margin-left:5px;border-radius:9px;background:var(--panel-2);color:var(--text);font-size:11px;line-height:16px}
.vtab.on .vb{background:#111;color:var(--hivis)}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat.a{border-left:4px solid var(--amber)}.stat.g{border-left:4px solid var(--green)}.stat.b{border-left:4px solid var(--blue)}
.stat .n{font-family:Archivo;font-weight:900;font-size:23px;line-height:1}
.stat .l{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Spline Sans',sans-serif}
.chip small{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--hivis);border-color:var(--hivis);color:#111}.chip.on small{color:#333}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px 11px 36px;font-size:15px;background:var(--panel-2);color:var(--text);font-family:'Spline Sans',sans-serif}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.rf{flex:0 0 auto;width:46px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;font-size:18px;cursor:pointer}
.sync{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--green)}.dot.busy{background:var(--amber)}.dot.err{background:var(--red)}
.rsec{margin-bottom:18px}
.rhead{display:flex;align-items:baseline;gap:8px;font-family:Archivo;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.rhead .c{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.card.paid{border-left-color:var(--green)}.card.sent{border-left-color:var(--blue)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.off{font-family:Archivo;font-weight:900;font-size:16px;color:var(--hivis)}
.tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);margin-left:4px;vertical-align:2px}
.cl{font-weight:600;margin-top:2px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:9px;padding:10px 14px;font-family:'Archivo Narrow';font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn.go{background:var(--green);color:#06210f}.btn.hv{background:var(--hivis);color:#111}
.role{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.role button{border:none;background:none;color:var(--muted);border-radius:999px;padding:7px 14px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.role button.on{background:var(--hivis);color:#111}
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:none;background:none;color:var(--muted);border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Spline Sans',sans-serif}
.seg button.on{background:var(--hivis);color:#111}
.dpick{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel-2);color:var(--text);font-size:13px;font-family:'Spline Sans',sans-serif}
.dhead{display:flex;align-items:baseline;gap:8px;font-family:Archivo;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dhead .c{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);font-weight:400}
.dhead.late{color:var(--red)}
.card.plan{border-left-color:var(--hivis)}
.wait{font-size:12.5px;color:var(--amber);font-weight:600}
.insT{font-size:12px;padding:4px 8px;border-radius:5px;font-weight:800;border:1px solid}
.insT.y{border-color:var(--green);color:var(--green)}.insT.n{border-color:var(--amber);color:var(--amber)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.5}
.done{font-size:12.5px;color:var(--green);font-weight:600}
.sentx{font-size:12.5px;color:var(--blue);font-weight:600}
.rsel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2);color:var(--text);font-size:13px;font-family:'Spline Sans',sans-serif}
.msg{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.6}
.skel{background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:96px;margin-bottom:9px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (max-width:420px){.stat .n{font-size:20px}.vtab{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html">← Hub</a>
    <div class="role" id="role"><button data-r="plan">Planning</button><button data-r="disp">Dispatch</button></div></div>
  <div class="hdr"><div class="t" id="ttl">Dispatch Planning</div><div class="s" id="sub">Approve payment · plan the next day's dispatch</div></div>

  <div class="stats" id="stats"></div>
  <div class="vtabs" id="tabs"></div>

  <div class="chips" id="chips"></div>
  <div class="row"><div class="search"><span class="mag">🔍</span><input id="q" placeholder="Offer, customer, salesperson, city…" autocomplete="off"></div>
    <button class="rf" id="rf" title="Re-read the production plan now">⟳</button></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">—</span></div>
  <div id="list"></div>
</div>

<script>
/* Dispatch Planning — one app, two people.
   PLANNING (office password): Ready orders by region → "Payment received" → pick a dispatch date
   (tomorrow by default) + installation needed / supply only → the order is in the dispatch plan.
   The installation side confirms loading in Team Availability → To Assign → "Ready & paid".
   DISPATCH: sees the dispatch plan by date — only orders with loading confirmed.
   Backend: invoice Apps Script (readyList / readyApprove / readyUnapprove / readyRegion / readyPlan / readyUnplan). */
const API = "https://script.google.com/macros/s/AKfycbyU_cHRuQH8aiS8SIKynGIeXoTukfp16SgA9OfKnf83Me7bW2hT8kULPUFw-JB1gEhnTw/exec";
const REGIONS = ['Delhi NCR','Haryana','Chandigarh & Punjab','Uttar Pradesh','Uttarakhand','Rajasthan','Himachal','Jammu & Kashmir','Other states','Address missing'];
const LS = { key:'lingel_dp_key', name:'lingel_dp_name', cache:'lingel_dp_cache_v2', region:'lingel_dp_region', role:'lingel_dp_role', tab:'lingel_dp_tab' };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }, del:k=>{ try{ localStorage.removeItem(k); }catch(e){} } };
const ymd = d => { const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
const TODAY = () => ymd(new Date()), TOMORROW = () => { const d=new Date(); d.setDate(d.getDate()+1); return ymd(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pretty = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const whenLabel = s => s===TODAY() ? 'Today · '+pretty(s) : s===TOMORROW() ? 'Tomorrow · '+pretty(s) : (s<TODAY() ? 'Overdue · '+pretty(s) : pretty(s));

const urlRole = new URLSearchParams(location.search).get('role');
let role = urlRole==='dispatch' ? 'disp' : (ls.get(LS.role)||'plan');
let tab = ls.get(LS.tab)||'ready', rows = [], region = ls.get(LS.region)||'', q = '', loading = false;
try{ const c = JSON.parse(ls.get(LS.cache)||'null'); if(c && Array.isArray(c.rows)) rows = c.rows; }catch(e){}
const pick = {};   // per-offer choice in "Plan dispatch": {day:'tomorrow'|'today'|'later', date, install}

function me(){ try{ const s=JSON.parse(ls.get('lingel_supervisor')||'null'); if(s&&s.name) return s.name; }catch(e){} return ls.get(LS.name)||''; }
function askName(){ let n=me(); if(!n){ n=(prompt('Your name (shown on approvals and plans)')||'').trim(); if(n) ls.set(LS.name,n); } return n; }
function askKey(force){ let k=force?'':(ls.get(LS.key)||''); if(!k){ k=(prompt('Office password')||'').trim(); if(k) ls.set(LS.key,k); } return k; }
function setDot(cls,txt){ $('dot').className='dot '+(cls||''); $('syncTxt').textContent=txt||''; }

async function post(params){
  const r = await fetch(API,{method:'POST',body:new URLSearchParams(params)}); const t=(await r.text()).trim();
  if(t.charAt(0)==='<') throw new Error('Script returned a sign-in page — set the deployment to “Anyone”.');
  let d; try{ d=JSON.parse(t); }catch(e){ throw new Error('Unexpected reply from the script'); }
  if(d && d.ok===false){ const e=new Error(/unknown/i.test(d.error||'')?'Invoice script not updated yet — paste the new version and deploy.':(d.error||'Request failed')); if(/password/i.test(d.error||'')) e.auth=true; throw e; }
  return d;
}
async function load(refresh){
  if(loading) return; loading=true; setDot('busy', refresh?'Re-reading the production plan… (can take ~20 s)':'Loading…'); render();
  try{ const d=await post({action:'readyList', refresh:refresh?'1':''}); rows=d.rows||[]; ls.set(LS.cache, JSON.stringify({rows,at:Date.now()}));
    setDot('ok', rows.length+' orders · plan read '+(d.lastSync?new Date(d.lastSync).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—')); }
  catch(e){ setDot('err',(rows.length?'Offline · last list · ':'')+(e.message||e)); }
  finally{ loading=false; render(); }
}

/* ---------- what each tab shows ---------- */
function tabsFor(){ return role==='disp' ? [['disp','Dispatch plan']] : [['ready','Waiting payment'],['paid','Plan dispatch'],['plan','Dispatch plan']]; }
function inTab(o){
  if(role==='disp') return o.stage==='dispatch';
  if(tab==='ready') return o.stage==='ready';
  if(tab==='paid') return o.stage==='paid';
  return o.stage==='planned' || o.stage==='dispatch';
}
const match = o => !q || [o.offer,o.client,o.sales,o.address,o.region,o.code].join(' ').toLowerCase().includes(q);
const byOffer = (a,b) => String(a.offer).localeCompare(String(b.offer),undefined,{numeric:true});
const regSort = (g) => (a,b) => (a==='Address missing')-(b==='Address missing') || g[b].length-g[a].length || a.localeCompare(b);

function render(){
  document.querySelectorAll('#role button').forEach(b=>b.classList.toggle('on', b.dataset.r===role));
  const T = tabsFor(); if(!T.some(t=>t[0]===tab)) tab = T[0][0];
  $('ttl').textContent = role==='disp' ? 'Dispatch' : 'Dispatch Planning';
  $('sub').textContent = role==='disp' ? 'What to load · by date and region' : 'Approve payment · plan the next day’s dispatch';
  const n = k => rows.filter(o=>o.stage===k).length;
  const tm = rows.filter(o=>o.stage==='dispatch' && o.dispatchDate===TOMORROW()).length, td = rows.filter(o=>o.stage==='dispatch' && o.dispatchDate===TODAY()).length;
  $('stats').innerHTML = role==='disp'
    ? st('b',td,'Today')+st('g',tm,'Tomorrow')+st('a',rows.filter(o=>o.stage==='dispatch' && o.dispatchDate<TODAY()).length,'Overdue')
    : st('a',n('ready'),'Waiting payment')+st('g',n('paid'),'Needs a date')+st('b',n('planned')+n('dispatch'),'In dispatch plan');
  const cnt = { ready:n('ready'), paid:n('paid'), plan:n('planned')+n('dispatch'), disp:n('dispatch') };
  $('tabs').innerHTML = T.map(t=>'<button class="vtab'+(t[0]===tab?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'<span class="vb">'+cnt[t[0]]+'</span></button>').join('');
  $('tabs').style.display = T.length>1 ? '' : 'none';

  const pool = rows.filter(inTab).filter(match), c = {}; pool.forEach(o=>{ c[o.region]=(c[o.region]||0)+1; });
  if(region && !c[region]) c[region]=0;
  const regs = Object.keys(c).sort((a,b)=>(a==='Address missing')-(b==='Address missing') || c[b]-c[a] || a.localeCompare(b));
  $('chips').innerHTML = '<button class="chip'+(region?'':' on')+'" data-r="">All regions<small>'+pool.length+'</small></button>'
    + regs.map(r=>'<button class="chip'+(r===region?' on':'')+'" data-r="'+esc(r)+'">'+esc(r)+'<small>'+c[r]+'</small></button>').join('');
  const list = pool.filter(o=>!region || o.region===region), box = $('list');
  if(!rows.length && loading){ box.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
  if(!list.length){ box.innerHTML='<div class="msg">'+emptyText()+'</div>'; return; }

  if(role==='disp' || tab==='plan'){   // grouped by DATE, then region
    const byDate = {}; list.forEach(o=>{ (byDate[o.dispatchDate]=byDate[o.dispatchDate]||[]).push(o); });
    box.innerHTML = Object.keys(byDate).sort().map(d=>{
      const g={}; byDate[d].forEach(o=>{ (g[o.region]=g[o.region]||[]).push(o); });
      return '<div class="dhead'+(d<TODAY()?' late':'')+'">'+esc(whenLabel(d))+'<span class="c">'+byDate[d].length+' order'+(byDate[d].length>1?'s':'')+'</span></div>'
        + Object.keys(g).sort(regSort(g)).map(r=>'<div class="rsec"><div class="rhead">'+esc(r)+'<span class="c">'+g[r].length+'</span></div>'+g[r].sort(byOffer).map(card).join('')+'</div>').join('');
    }).join('');
  } else {                              // grouped by region
    const g={}; list.forEach(o=>{ (g[o.region]=g[o.region]||[]).push(o); });
    box.innerHTML = Object.keys(g).sort(regSort(g)).map(r=>'<div class="rsec"><div class="rhead">'+esc(r)+'<span class="c">'+g[r].length+' order'+(g[r].length>1?'s':'')+'</span></div>'+g[r].sort(byOffer).map(card).join('')+'</div>').join('');
  }
}
const st = (c,n,l) => '<div class="stat '+c+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
function emptyText(){
  if(role==='disp') return 'Nothing to load yet.<br><span style="font-size:12px">Orders show here once they are planned for a date and the installation team has confirmed loading.</span>';
  if(tab==='ready') return q||region ? 'No order waiting for payment in this filter.' : '✅ No Ready order is waiting for payment approval.';
  if(tab==='paid') return 'No paid order is waiting for a dispatch date.';
  return 'Nothing in the dispatch plan yet.';
}
function card(o){
  const left = /^left ready/i.test(o.status) ? ' <span class="tag" style="border-color:var(--amber);color:var(--amber)">no longer Ready</span>' : '';
  const ins = o.install ? '<span class="insT '+(o.install==='No'?'n':'y')+'">'+(o.install==='No'?'📦 Supply only':'🔧 Installation needed')+'</span>' : '';
  const cls = o.stage==='ready' ? 'card' : (o.stage==='paid' ? 'card paid' : (o.stage==='planned' ? 'card plan' : 'card sent'));
  let acts = '';
  if(role==='disp'){
    acts = '<span class="sentx">🚚 Loading confirmed'+(o.confirmedBy?' · '+esc(o.confirmedBy):'')+'</span>';
  } else if(o.stage==='ready'){
    acts = '<button class="btn go" data-act="approve" data-o="'+esc(o.offer)+'">✓ Payment received</button>'+rsel(o);
  } else if(o.stage==='paid'){
    const p = pick[o.offer] || (pick[o.offer] = {day:'tomorrow', date:'', install: o.install==='No' ? 'No' : 'Yes'});
    acts = '<span class="done">✓ Paid'+(o.approvedBy?' · '+esc(o.approvedBy):'')+'</span>'
      + '<div class="seg" data-pday="'+esc(o.offer)+'"><button data-v="today"'+(p.day==='today'?' class="on"':'')+'>Today</button><button data-v="tomorrow"'+(p.day==='tomorrow'?' class="on"':'')+'>Tomorrow</button><button data-v="later"'+(p.day==='later'?' class="on"':'')+'>Later…</button></div>'
      + (p.day==='later' ? '<input type="date" class="dpick" data-pdate="'+esc(o.offer)+'" min="'+TODAY()+'" value="'+esc(p.date||TOMORROW())+'">' : '')
      + '<div class="seg" data-pins="'+esc(o.offer)+'"><button data-v="Yes"'+(p.install!=='No'?' class="on"':'')+'>Installation needed</button><button data-v="No"'+(p.install==='No'?' class="on"':'')+'>Supply only</button></div>'
      + '<button class="btn hv" data-act="plan" data-o="'+esc(o.offer)+'">📅 Add to plan</button>'
      + '<button class="btn ghost" data-act="undo" data-o="'+esc(o.offer)+'">Undo payment</button>';
  } else {
    acts = '<span class="done">📅 '+esc(whenLabel(o.dispatchDate))+(o.plannedBy?' · '+esc(o.plannedBy):'')+'</span>'
      + (o.stage==='dispatch' ? '<span class="sentx">🚚 Loading confirmed'+(o.confirmedBy?' · '+esc(o.confirmedBy):'')+'</span>'
                              : '<span class="wait">⏳ Waiting for the installation team to confirm loading (Team Availability → Ready &amp; paid)</span>')
      + '<button class="btn ghost" data-act="unplan" data-o="'+esc(o.offer)+'">Change date</button>';
  }
  return '<div class="'+cls+'"><div class="ch"><div><div class="off">#'+esc(o.offer)+'<span class="tag">'+esc(o.dept)+'</span>'+(o.code?'<span class="tag">'+esc(o.code)+'</span>':'')+left+'</div>'
    + '<div class="cl">'+esc(o.client||'—')+'</div></div>'+(o.stage!=='ready' && o.stage!=='paid' ? ins : '')+'</div>'
    + '<div class="meta">🧑‍💼 '+esc(o.sales||'—')+(o.units?' · '+esc(o.units)+' units':'')+' · 📍 '+esc(o.address||'no address')
    + (o.stage==='ready' && o.readySince ? '<br>Ready since '+esc(o.readySince) : '')+'</div>'
    + '<div class="acts">'+acts+'</div></div>';
}
const rsel = o => '<select class="rsel" data-act="region" data-o="'+esc(o.offer)+'" title="Change region">'+REGIONS.map(r=>'<option'+(r===o.region?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select>';

/* ---------- saving ---------- */
async function act(kind, offer, extra){
  const o = rows.find(x=>x.offer===offer); if(!o) return;
  const by = askName(); if(!by){ alert('Enter your name first.'); return; }
  let key = askKey(false); if(!key) return;
  const action = {approve:'readyApprove', undo:'readyUnapprove', region:'readyRegion', plan:'readyPlan', unplan:'readyUnplan'}[kind];
  const params = {action, offer, by, key};
  if(kind==='undo' && !confirm('Undo payment approval for #'+offer+'?\n\nIt goes back to “Waiting payment”.')) return;
  if(kind==='unplan' && !confirm('Take #'+offer+' out of the dispatch plan to pick a new date?')) return;
  if(kind==='region') params.region = extra;
  if(kind==='plan'){ const p = pick[offer]||{}; const d = p.day==='today' ? TODAY() : p.day==='later' ? (p.date||TOMORROW()) : TOMORROW();
    params.date = d; params.install = p.install||'Yes'; }
  const before = Object.assign({}, o);
  if(kind==='approve') Object.assign(o,{stage:'paid',paid:true,approvedBy:by});
  if(kind==='undo') Object.assign(o,{stage:'ready',paid:false,approvedBy:'',dispatchDate:''});
  if(kind==='region') Object.assign(o,{region:extra});
  if(kind==='plan') Object.assign(o,{stage:o.confirmed?'dispatch':'planned',dispatchDate:params.date,install:params.install,plannedBy:by});
  if(kind==='unplan') Object.assign(o,{stage:'paid',dispatchDate:''});
  render(); setDot('busy','Saving #'+offer+'…');
  for(let attempt=0; attempt<2; attempt++){
    try{
      const d = await post(params); if(d.row) Object.assign(o, d.row); ls.set(LS.cache, JSON.stringify({rows,at:Date.now()}));
      setDot('ok', {approve:'#'+offer+' · payment received — now in Plan dispatch', undo:'#'+offer+' back to Waiting payment', region:'#'+offer+' region → '+extra,
        plan:'#'+offer+' planned for '+whenLabel(params.date), unplan:'#'+offer+' out of the plan — pick a new date'}[kind]);
      render(); return;
    }catch(e){
      if(e.auth && attempt===0){ ls.del(LS.key); key = askKey(true); if(key){ params.key=key; continue; } }
      Object.assign(o, before); render(); setDot('err','Not saved: '+(e.message||e)); alert('Couldn’t save:\n\n'+(e.message||e)); return;
    }
  }
}

/* ---------- wiring ---------- */
$('role').onclick = e=>{ const b=e.target.closest('button[data-r]'); if(!b) return; role=b.dataset.r; ls.set(LS.role, role); tab = role==='disp' ? 'disp' : (ls.get(LS.tab)||'ready'); render(); };
$('tabs').onclick = e=>{ const b=e.target.closest('.vtab'); if(!b) return; tab=b.dataset.t; if(role==='plan') ls.set(LS.tab, tab); render(); };
$('chips').onclick = e=>{ const c=e.target.closest('.chip'); if(!c) return; region=c.dataset.r; ls.set(LS.region, region); render(); };
$('q').oninput = e=>{ q=e.target.value.trim().toLowerCase(); render(); };
$('rf').onclick = ()=>load(true);
$('list').addEventListener('click', e=>{
  const d=e.target.closest('.seg[data-pday] button'); if(d){ const off=d.parentElement.dataset.pday; pick[off]=Object.assign(pick[off]||{}, {day:d.dataset.v}); render(); return; }
  const i=e.target.closest('.seg[data-pins] button'); if(i){ const off=i.parentElement.dataset.pins; pick[off]=Object.assign(pick[off]||{}, {install:i.dataset.v}); render(); return; }
  const b=e.target.closest('button[data-act]'); if(b) act(b.dataset.act, b.dataset.o);
});
$('list').addEventListener('change', e=>{
  const s=e.target.closest('select[data-act="region"]'); if(s){ act('region', s.dataset.o, s.value); return; }
  const dp=e.target.closest('input[data-pdate]'); if(dp){ const off=dp.dataset.pdate; pick[off]=Object.assign(pick[off]||{}, {date:dp.value}); }
});
render(); load(false);
setInterval(()=>{ if(!document.hidden) load(false); }, 90000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(false); });
</script>
