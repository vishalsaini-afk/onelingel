<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>Lingel — Dispatch Status</title>
<meta name="theme-color" content="#13161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingel">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#e2f14d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'Spline Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--line);flex-shrink:0}
.topbar a,.topbar button{font-family:'Archivo Narrow';font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.home{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;background:transparent}
.home:hover,.home:active{color:var(--hivis);border-color:var(--hivis)}
.ttl{font-family:Archivo;font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--hivis);line-height:1.1;min-width:0}
.ttl small{display:block;font-family:'JetBrains Mono';font-weight:400;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 11px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn:hover,.btn:active{border-color:var(--hivis);color:var(--hivis)}
.btn.solid{background:var(--hivis);color:#111;border-color:var(--hivis)}
.frame-wrap{flex:1;position:relative;min-height:0;background:var(--panel);overflow:auto;-webkit-overflow-scrolling:touch}
.frame-sizer{position:relative}
.frame-sizer iframe{display:block;width:100%;height:100%;border:0}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.45);z-index:5}
.zoom button{border:none;background:transparent;color:var(--text);width:36px;height:36px;border-radius:7px;font-size:19px;font-family:'Spline Sans';cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.zoom button:hover,.zoom button:active{background:var(--panel-2);color:var(--hivis)}
.zoom .lvl{min-width:52px;text-align:center;font-family:'JetBrains Mono';font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.zoom .lvl:hover{color:var(--hivis)}
@media(max-width:520px){.ttl small{display:none}.home,.btn{padding:8px 9px;font-size:11px}.topbar{gap:7px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="index.html">← Home</a>
  <div class="ttl">Dispatch Status<small>Production &amp; Dispatch Dashboard</small></div>
  <button class="btn spacer" id="presentBtn" onclick="togglePresent()">⤢ Present</button>
  <a class="btn solid" href="https://datastudio.google.com/embed/reporting/d3563ccf-bfcc-45b3-9a53-c047004cf58f/page/Df13F" target="_blank" rel="noopener">Open ↗</a>
</div>

<div class="frame-wrap" id="wrap">
  <div class="loading">Loading dashboard…</div>
  <div class="frame-sizer" id="sizer">
    <iframe id="frame"
      src="https://datastudio.google.com/embed/reporting/d3563ccf-bfcc-45b3-9a53-c047004cf58f/page/Df13F"
      frameborder="0"
      style="border:0"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

  <div class="zoom">
    <button title="Zoom out" onclick="stepZoom(-1)">−</button>
    <span class="lvl" id="lvl" title="Reset to fit" onclick="setZoom(1)">100%</span>
    <button title="Zoom in" onclick="stepZoom(1)">+</button>
  </div>
</div>

<script>
/* ---- Zoom: grow the frame box inside a scrollable wrap (works with the cross-origin dashboard) ---- */
var wrap=document.getElementById('wrap');
var sizer=document.getElementById('sizer');
var lvl=document.getElementById('lvl');
var STEPS=[0.5,0.67,0.8,1,1.25,1.5,2,2.5,3];
var zoom=1;

function baseSize(){ return {w:wrap.clientWidth, h:wrap.clientHeight}; }
function applyZoom(){
  // at zoom 1 the frame fits the viewport (no scroll); above 1 it grows and the wrap scrolls
  var wasFit=(Math.abs(zoom-1)<0.001);
  // measure the un-zoomed viewport first so scrollbars don't feed back into the size
  sizer.style.width='100%'; sizer.style.height='100%';
  var b=baseSize();
  sizer.style.width=(b.w*zoom)+'px';
  sizer.style.height=(b.h*zoom)+'px';
  lvl.textContent=Math.round(zoom*100)+'%';
  if(wasFit){ wrap.scrollLeft=0; wrap.scrollTop=0; }
}
function setZoom(z){
  zoom=Math.max(STEPS[0],Math.min(STEPS[STEPS.length-1],z));
  applyZoom();
}
function stepZoom(dir){
  // snap to the nearest preset then move one step
  var i=0,best=1e9;
  for(var k=0;k<STEPS.length;k++){var d=Math.abs(STEPS[k]-zoom);if(d<best){best=d;i=k;}}
  i=Math.max(0,Math.min(STEPS.length-1,i+dir));
  setZoom(STEPS[i]);
}
// keep the fit correct on rotate / window resize while at 100%
var rt;
addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(function(){ if(Math.abs(zoom-1)<0.001) applyZoom(); },150); });
// Ctrl/Cmd + wheel to zoom
wrap.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey){ e.preventDefault(); stepZoom(e.deltaY<0?1:-1); } },{passive:false});

/* ---- Present: take the whole page fullscreen (toolbar + zoom stay usable) ---- */
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
function togglePresent(){
  var el=document.documentElement, btn=document.getElementById('presentBtn');
  try{
    if(!fsEl()){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
    else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  }catch(e){}
}
function fsChanged(){
  var btn=document.getElementById('presentBtn');
  btn.textContent=fsEl()?'⤡ Exit':'⤢ Present';
  btn.classList.toggle('solid',!!fsEl());
  setTimeout(function(){ if(Math.abs(zoom-1)<0.001) applyZoom(); },200);
}
document.addEventListener('fullscreenchange',fsChanged);
document.addEventListener('webkitfullscreenchange',fsChanged);

applyZoom();

/* installable app + offline: register the service worker (shared with the suite) */
if('serviceWorker' in navigator){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
