<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingel — Contractor Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Archivo+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#13161b;--panel:#1a1e25;--panel-2:#222732;--text:#e8e4d9;--muted:#7c8694;--line:#2a2f3a;--hivis:#ffce1f;--green:#22c55e;--red:#ef4444;--amber:#f0a63a;--blue:#5b9bd5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Spline Sans',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.home{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
h1{font-family:Archivo;font-weight:900;font-size:22px;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:'JetBrains Mono';font-weight:400;font-size:10px;color:var(--hivis);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.sp{flex:1}
.sync{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.busy{background:var(--hivis);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.btn{border:none;border-radius:8px;padding:9px 14px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.go{background:var(--hivis);color:#111;border-color:var(--hivis)}.btn.red{background:transparent;color:var(--red);border-color:var(--red)}.btn.grn{background:var(--green);color:#06210f;border-color:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--muted);font-family:'Archivo Narrow';font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--hivis)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.st .v{font-family:Archivo;font-weight:900;font-size:22px}.st .k{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.st .s{font-size:12px;color:var(--muted);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font-family:'Spline Sans',sans-serif;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;background:var(--panel-2);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--hivis);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--muted);border:none;padding:9px 12px;font-family:'Archivo Narrow';font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--hivis);color:#111}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{font-family:'JetBrains Mono';font-weight:400;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#1f242d}
.r{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono';font-size:12px}
.neg{color:var(--red)}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-family:'Archivo Narrow';font-weight:700;font-size:12px;letter-spacing:.03em;white-space:nowrap}
.pill.wait{background:rgba(240,166,58,.15);color:var(--amber)}.pill.ready{background:rgba(255,206,31,.15);color:var(--hivis)}.pill.paid{background:rgba(34,197,94,.15);color:var(--green)}
.pill.ho{background:rgba(34,197,94,.12);color:var(--green)}.pill.nho{background:rgba(124,134,148,.15);color:var(--muted)}
.scroll{overflow-x:auto}
.empty{padding:30px;text-align:center;color:var(--muted)}
.warn{background:#3a2a12;border:1px solid #6b4e1f;border-left:4px solid var(--hivis);border-radius:0;padding:10px 14px;margin-bottom:12px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:50}
.mbox{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--hivis);border-radius:12px;width:100%;max-width:640px;padding:18px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.mh h2{font-family:Archivo;font-weight:900;font-size:19px;margin:0}.mh .sub{font-size:12px;color:var(--muted);margin-top:3px}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.sec{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sl{font-family:'JetBrains Mono';font-size:10px;color:var(--hivis);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.line.tot{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-family:Archivo;font-weight:900;font-size:20px}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}.mini th{color:var(--muted);font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .s2{grid-column:span 2}
.fd{display:flex;flex-direction:column;gap:4px}.fd label{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 4px;font-family:Archivo;font-weight:700;font-size:16px}
.card .meta{font-size:12px;color:var(--muted);line-height:1.6}
.gate{max-width:360px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--hivis);border-radius:12px;padding:22px}
.gate h2{font-family:Archivo;font-weight:900;margin:0 0 6px}.gate p{color:var(--muted);font-size:13px;margin:0 0 14px}
.gate input{width:100%;margin-bottom:10px;font-size:16px}
.err{color:var(--red);font-size:13px;min-height:18px}
#printArea{display:none}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.hide-m{display:none}}
@media print{
  body{background:#fff;color:#111}
  .wrap,.modal{display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>
<div class="gate" id="gate">
  <h2>Contractor Ledger</h2>
  <p>Office only. Enter the office key to continue.</p>
  <input id="keyIn" type="password" placeholder="Office key" autocomplete="current-password">
  <div class="err" id="keyErr"></div>
  <button class="btn go" style="width:100%" onclick="doLogin()">Open ledger →</button>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <a class="home" href="index.html">⌂ Home</a>
    <h1>Contractor Ledger<small>Invoice → handover → deductions → paid</small></h1>
    <div class="sp"></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">—</span></div>
    <button class="btn" onclick="load()">↻ Refresh</button>
    <button class="btn" onclick="logout()">Lock</button>
  </header>
  <div id="linkWarn"></div>

  <div class="tabs">
    <button class="tab on" data-v="inv">Invoices</button>
    <button class="tab" data-v="con">Contractors &amp; KYC</button>
    <button class="tab" data-v="stm">Payment statement</button>
  </div>

  <section id="v-inv">
    <div class="stats" id="stats"></div>
    <div class="filters">
      <select id="fCon"><option value="">All contractors</option></select>
      <div class="seg" id="fStat">
        <button data-v="" class="on">All</button><button data-v="wait">Awaiting handover</button><button data-v="ready">Ready to pay</button><button data-v="paid">Paid</button>
      </div>
      <input id="fQ" placeholder="Search offer / customer / invoice" style="flex:1;min-width:180px">
    </div>
    <div class="scroll"><table class="tbl" id="invTbl"></table></div>
  </section>

  <section id="v-con" hidden><div class="cards" id="conCards"></div></section>

  <section id="v-stm" hidden>
    <div class="filters">
      <select id="sCon"></select>
      <div class="seg" id="sWhich"><button data-v="ready" class="on">Ready to pay</button><button data-v="unpaid">All unpaid</button></div>
      <button class="btn go" onclick="printStatement()">🖨 Print / save PDF</button>
    </div>
    <div id="stmPreview"></div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="printArea"></div>

<script>
/* Same deployment as the Contractor Invoice app (Invoices + Contractors tabs live there) */
const LEDGER_API = "https://script.google.com/macros/s/AKfycbyU_cHRuQH8aiS8SIKynGIeXoTukfp16SgA9OfKnf83Me7bW2hT8kULPUFw-JB1gEhnTw/exec";
const KEY_LS = 'lingel_ledger_key', CACHE_LS = 'lingel_ledger_cache_v1';
const DED_TYPES = [
  {v:'No-show',       l:'No-show at commitment (₹5/sq.ft)', per:'sqft', rate:5},
  {v:'Bad silicone',  l:'Bad silicone work (₹10/sq.ft)',     per:'sqft', rate:10},
  {v:'Glass damage',  l:'Glass damaged at site (50% of cost)', per:'cost', rate:0.5},
  {v:'Other',         l:'Other (fixed amount)',             per:'fixed', rate:1}
];
const ADD_TYPES = [   // from the rate card · every charge needs an approver (Padam Singh)
  {v:'Shifting',        l:'Shifting (₹800 / labour)',          rate:800,  q:'Labours'},
  {v:'Unloading',       l:'Unloading (₹800 / labour)',         rate:800,  q:'Labours'},
  {v:'Masking tape',    l:'Masking tape (₹100 / piece)',       rate:100,  q:'Pieces'},
  {v:'Chain pulley',    l:'Chain pulley (₹2,000)',             rate:2000, q:'Times'},
  {v:'Crane / Hydra',   l:'Crane / Hydra (actual GST bill)',   rate:0,    q:'Bill amount ₹'},
  {v:'Hotel & food',    l:'Hotel & food (₹1,500 / team / day)',rate:1500, q:'Team-days'},
  {v:'Georgian bars',   l:'Georgian bars (₹15 / sq.ft)',       rate:15,   q:'Sq.ft'},
  {v:'Service extended',l:'Service within 100 km (₹2,500)',    rate:2500, q:'Visits'},
  {v:'Other',           l:'Other (fixed amount)',              rate:0,    q:'Amount ₹'}
];
const CO = {lingel:'Lingel Windows & Doors Technology Pvt. Ltd', fensterbau:'Fensterbau Lingel India Private Limited'};
let D = {invoices:[], deductions:[], additions:[], contractors:[]}, fStat='', sWhich='ready';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const key = () => localStorage.getItem(KEY_LS) || '';
const supName = () => { try{ const s=JSON.parse(localStorage.getItem('lingel_supervisor')||'null'); return (s&&s.name)||'Office'; }catch(e){ return 'Office'; } };
function stateOf(i){ return /paid/i.test(i.payment) && !/unpaid/i.test(i.payment) ? 'paid' : (/done/i.test(i.handover) ? 'ready' : 'wait'); }
function pill(s){ return s==='paid' ? '<span class="pill paid">✓ Paid</span>' : s==='ready' ? '<span class="pill ready">Ready to pay</span>' : '<span class="pill wait">Awaiting handover</span>'; }
function setDot(k,t){ $('dot').className='dot '+k; $('syncTxt').textContent=t; }

async function api(params){
  const body = new URLSearchParams(Object.assign({key:key()}, params));
  let r, t;
  try{ r = await fetch(LEDGER_API, {method:'POST', body}); t = (await r.text()).trim(); }
  catch(e){ throw new Error('No connection to the Invoice sheet'); }
  if (t.charAt(0)==='<') throw new Error('Invoice script returned a sign-in page — check deployment access');
  let d; try{ d = JSON.parse(t); }catch(e){ throw new Error('Unexpected reply: '+t.slice(0,120)); }
  if (!d || d.ok===false){
    const m = (d&&d.error)||'Request failed';
    if (/office key/i.test(m)) throw Object.assign(new Error(m), {auth:true});
    if (/supervisor|unknown|pin|login/i.test(m) && !/ledger/i.test(m)) throw new Error('Ledger add-on not installed in the Invoice script yet (or not redeployed).');
    throw new Error(m);
  }
  return d;
}
function take(d){
  D = {invoices:d.invoices||[], deductions:d.deductions||[], additions:d.additions||[], contractors:d.contractors||[], linked:d.linked||{}};
  try{ localStorage.setItem(CACHE_LS, JSON.stringify(D)); }catch(e){}
  renderAll();
}
async function load(){
  setDot('busy','Syncing sheets…');
  try{ take(await api({action:'ledgerData'})); setDot('ok','Live · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})); }
  catch(e){
    if (e.auth){ logout(e.message); return; }
    const c = JSON.parse(localStorage.getItem(CACHE_LS)||'null'); if (c){ D=c; renderAll(); }
    setDot('err', e.message);
  }
}
async function act(params, okMsg){
  setDot('busy','Saving…');
  try{ take(await api(params)); setDot('ok', okMsg||'Saved'); return true; }
  catch(e){ setDot('err', e.message); alert(e.message); return false; }
}

/* ---------- login ---------- */
async function doLogin(){
  const k = $('keyIn').value.trim(); if (!k){ $('keyErr').textContent='Enter the office key'; return; }
  localStorage.setItem(KEY_LS, k); $('keyErr').textContent='Checking…';
  try{ take(await api({action:'ledgerData'})); $('gate').hidden=true; $('app').hidden=false; setDot('ok','Live'); }
  catch(e){ if (e.auth) localStorage.removeItem(KEY_LS); $('keyErr').textContent=e.message; }
}
function logout(msg){ localStorage.removeItem(KEY_LS); $('app').hidden=true; $('gate').hidden=false; $('keyErr').textContent=msg||''; $('keyIn').value=''; }

/* ---------- render ---------- */
function renderAll(){ renderWarn(); renderStats(); fillCons(); renderInv(); renderCons(); renderStatement(); }
function renderWarn(){
  const L = D.linked||{}, miss = [];
  if (L.hub===false) miss.push('Handover (HUB_SS_ID)'); if (L.labour===false) miss.push('Labour Log (LABOUR_SS_ID)');
  $('linkWarn').innerHTML = miss.length ? '<div class="warn">Not linked yet: <b>'+miss.join(', ')+'</b>. Paste the Sheet ID in the ledger add-on settings so handover ticks and shifting deductions fill in automatically.</div>' : '';
}
function renderStats(){
  const I = D.invoices, by = s => I.filter(i => stateOf(i)===s);
  const wait = by('wait'), ready = by('ready'), m = new Date().toISOString().slice(0,7);
  const paidM = by('paid').filter(i => String(i.paidOn).slice(0,7)===m);
  const dedSum = I.filter(i=>stateOf(i)!=='paid').reduce((s,i)=>s+i.shifting+i.other,0);
  $('stats').innerHTML =
    st(wait.length, 'Awaiting handover', inr(wait.reduce((s,i)=>s+i.gross,0))+' gross') +
    st(ready.length, 'Ready to pay', inr(ready.reduce((s,i)=>s+i.net,0))+' net') +
    st(inr(dedSum), 'Open deductions', 'shifting + office') +
    st(inr(paidM.reduce((s,i)=>s+i.net,0)), 'Paid this month', paidM.length+' invoices');
  function st(v,k,s){ return '<div class="st"><div class="v">'+v+'</div><div class="k">'+k+'</div><div class="s">'+s+'</div></div>'; }
}
function fillCons(){
  const names = [...new Set(D.invoices.map(i=>i.contractor).concat(D.contractors.map(c=>c.name)).filter(Boolean))].sort();
  for (const id of ['fCon','sCon']){
    const el = $(id), cur = el.value;
    el.innerHTML = (id==='fCon' ? '<option value="">All contractors</option>' : '') + names.map(n=>'<option>'+esc(n)+'</option>').join('');
    if (names.includes(cur) || (id==='fCon' && cur==='')) el.value = cur;
  }
}
function filtered(){
  const c = $('fCon').value, q = $('fQ').value.trim().toLowerCase();
  return D.invoices.filter(i => (!c || i.contractor===c) && (!fStat || stateOf(i)===fStat) &&
    (!q || [i.offer,i.customer,i.invoiceNo].join(' ').toLowerCase().includes(q)))
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));
}
function renderInv(){
  const L = filtered();
  if (!L.length){ $('invTbl').innerHTML = '<tr><td class="empty">No invoices match.</td></tr>'; return; }
  $('invTbl').innerHTML = '<tr><th>Invoice</th><th>Contractor</th><th class="hide-m">Offer · Customer</th><th>Handover</th><th class="r">Gross</th><th class="r hide-m">Deductions</th><th class="r">Net</th><th>Status</th></tr>' +
    L.map(i => '<tr class="row" data-no="'+esc(i.invoiceNo)+'">'
      + '<td class="mono">'+esc(i.invoiceNo)+'<br><span style="color:var(--muted)">'+esc(i.date)+'</span></td>'
      + '<td>'+esc(i.contractor)+'</td>'
      + '<td class="hide-m">#'+esc(i.offer)+'<br><span style="color:var(--muted)">'+esc(i.customer)+'</span></td>'
      + '<td>'+(/done/i.test(i.handover) ? '<span class="pill ho">✅ Done</span><br><span class="mono" style="color:var(--muted)">'+esc(i.handoverDate)+'</span>' : '<span class="pill nho">⏳ Pending</span>')+'</td>'
      + '<td class="r">'+inr(i.gross)+'</td>'
      + '<td class="r neg hide-m">'+((i.shifting+i.other) ? '−'+inr(i.shifting+i.other) : '—')+'</td>'
      + '<td class="r"><b>'+inr(i.net)+'</b></td>'
      + '<td>'+pill(stateOf(i))+'</td></tr>').join('');
}
function renderCons(){
  if (!D.contractors.length){ $('conCards').innerHTML = '<div class="empty">No contractors found in the Contractors tab.</div>'; return; }
  $('conCards').innerHTML = D.contractors.map((c,ix) => {
    const ok = c['Account Holder'] && c['A/C No'] && c['IFSC'] && c['PAN'];
    const due = D.invoices.filter(i => i.contractor===c.name && stateOf(i)==='ready').reduce((s,i)=>s+i.net,0);
    return '<div class="card"><h3>'+esc(c.name)+' <span class="mono" style="color:var(--muted)">'+esc(c.code)+'</span></h3>'
      + '<div class="meta">'+(ok ? '<span class="pill paid">KYC complete</span>' : '<span class="pill wait">KYC missing</span>')
      + '<br>'+esc(c['Bank']||'No bank')+(c['A/C No'] ? ' · ••••'+esc(String(c['A/C No']).slice(-4)) : '')
      + '<br>Ready to pay: <b style="color:var(--text)">'+inr(due)+'</b></div>'
      + '<div class="acts"><button class="btn" onclick="openKyc('+ix+')">View payment details</button></div></div>';
  }).join('');
}

/* ---------- invoice detail ---------- */
function openInv(no){
  const i = D.invoices.find(x => x.invoiceNo===no); if (!i) return;
  const deds = D.deductions.filter(d => String(d['Invoice No']).trim()===no);
  const adds = (D.additions||[]).filter(d => String(d['Invoice No']).trim()===no);
  const s = stateOf(i);
  $('mbox').innerHTML =
    '<div class="mh"><div><h2>'+esc(i.invoiceNo)+'</h2><div class="sub">'+esc(i.contractor)+' · #'+esc(i.offer)+' · '+esc(i.customer)+'</div></div><div style="display:flex;gap:6px"><button class="btn" onclick="openPdf(\''+esc(i.invoiceNo)+'\')">📄 Invoice PDF</button><button class="x" onclick="closeM()">✕</button></div></div>'
  + '<div class="sec"><div class="sl">Handover</div>'
  + (/done/i.test(i.handover) ? '<div>✅ Handover done on <b>'+esc(i.handoverDate||'—')+'</b>'+(i.handoverUrl?' · <a href="'+esc(i.handoverUrl)+'" target="_blank" style="color:var(--hivis)">open PDF</a>':'')+'</div>'
     : '<div style="color:var(--muted)">⏳ Not handed over yet. This ticks itself when the supervisor submits the Handover form for #'+esc(i.offer)+'.</div>')
  + '</div>'
  + '<div class="sec"><div class="sl">Bill</div>'
  + '<div class="line"><span>Installation · '+i.sqft.toFixed(2)+' sq.ft × '+inr(i.rate)+'</span><span>'+inr(i.gross)+'</span></div>'
  + '<div class="line" style="color:var(--green)"><span>Approved additional charges</span><span>+'+inr(i.additions||0)+'</span></div>'
  + (adds.length ? '<table class="mini"><tr><th>Charge</th><th>Approved by</th><th class="r">Amount</th><th></th></tr>'+adds.map(d=>'<tr><td>'+esc(d.Type)+(d.Reason?' · '+esc(d.Reason):'')+'</td><td>'+esc(d['Approved By'])+'</td><td class="r">'+inr(d.Amount)+'</td><td>'+(s!=='paid'?'<button class="del" title="Remove" onclick="delAdd(\''+esc(d.ID)+'\',\''+esc(no)+'\')">✕</button>':'')+'</td></tr>').join('')+'</table>' : '')
  + '<div class="line neg"><span>Shifting share (50% of labour log)</span><span>−'+inr(i.shifting)+'</span></div>'
  + (i.shiftEntries.length ? '<table class="mini"><tr><th>Date</th><th>Labours</th><th class="r">Shifting cost</th><th class="r">50%</th></tr>'+i.shiftEntries.map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+e.labours+'</td><td class="r">'+inr(e.amount)+'</td><td class="r">'+inr(e.share)+'</td></tr>').join('')+'</table>' : '')
  + '<div class="line neg"><span>Office deductions</span><span>−'+inr(i.other)+'</span></div>'
  + (deds.length ? '<table class="mini"><tr><th>Type</th><th>Reason</th><th class="r">Amount</th><th></th></tr>'+deds.map(d=>'<tr><td>'+esc(d.Type)+'</td><td>'+esc(d.Reason)+'</td><td class="r">'+inr(d.Amount)+'</td><td>'+(s!=='paid'?'<button class="del" title="Remove" onclick="delDed(\''+esc(d.ID)+'\',\''+esc(no)+'\')">✕</button>':'')+'</td></tr>').join('')+'</table>' : '')
  + '<div class="line tot"><span>Net payable</span><span>'+inr(i.net)+'</span></div></div>'
  + (s!=='paid' ? addForm(i) + dedForm(i) : '')
  + '<div class="sec"><div class="sl">Payment</div>'
  + (s==='paid' ? '<div>✓ Paid on <b>'+esc(i.paidOn)+'</b>'+(i.payRef?' · Ref '+esc(i.payRef):'')+'</div><div class="acts"><button class="btn red" onclick="unpay(\''+esc(no)+'\')">Undo paid</button></div>'
     : s==='wait' ? '<div style="color:var(--amber)">🔒 Payment is locked until the Handover form for #'+esc(i.offer)+' is submitted. Add deductions now if needed; the amount is decided after handover.</div>'
     : '<div class="g2"><div class="fd"><label>Paid on</label><input type="date" id="pDate" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="fd"><label>UTR / reference</label><input id="pRef" placeholder="Bank ref"></div></div>'
       + '<div class="acts"><button class="btn grn" onclick="pay(\''+esc(no)+'\')">Mark paid '+inr(i.net)+'</button></div>')
  + '</div>';
  $('modal').hidden = false;
  if (s!=='paid'){ wireDed(i); wireAdd(i); }
}
function addForm(i){
  return '<div class="sec"><div class="sl" style="color:var(--green)">Add additional charge</div><div class="g2">'
   + '<div class="fd s2"><label>Charge</label><select id="aType">'+ADD_TYPES.map(t=>'<option value="'+t.v+'">'+t.l+'</option>').join('')+'</select></div>'
   + '<div class="fd"><label id="aQl">Labours</label><input type="number" step="0.01" id="aQty" value="1"></div>'
   + '<div class="fd"><label>Amount ₹</label><input type="number" step="0.01" id="aAmt"></div>'
   + '<div class="fd"><label>Approved by</label><input id="aBy" value="Padam Singh"></div>'
   + '<div class="fd"><label>Note</label><input id="aWhy" placeholder="e.g. 2nd floor, no lift"></div>'
   + '</div><div class="acts"><button class="btn grn" onclick="addAdd(\''+esc(i.invoiceNo)+'\')">Add charge</button></div></div>';
}
function wireAdd(i){
  const t=$('aType'), q=$('aQty'), a=$('aAmt'), ql=$('aQl');
  const T=()=>ADD_TYPES.find(x=>x.v===t.value);
  const calc=()=>{ const x=T(); a.value = x.rate ? (Number(q.value||0)*x.rate).toFixed(2) : (q.value||''); };
  t.onchange=()=>{ const x=T(); ql.textContent=x.q; q.value = x.v==='Georgian bars' ? i.sqft.toFixed(2) : (x.rate?'1':''); calc(); };
  q.oninput=calc; calc();
}
async function addAdd(no){
  const i=D.invoices.find(x=>x.invoiceNo===no), x=ADD_TYPES.find(t=>t.v===$('aType').value);
  const amt=Number($('aAmt').value||0); if(!(amt>0)){ alert('Enter the charge amount'); return; }
  const by=$('aBy').value.trim(); if(!by){ alert('Who approved this charge?'); return; }
  if (await act({action:'ledgerAdd', invoiceNo:no, offer:i.offer, contractor:i.contractor, code:i.code, type:x.v,
     qty:$('aQty').value||'', rate:x.rate||'', amount:amt, reason:$('aWhy').value.trim(), approvedBy:by, by:supName()}, 'Charge added')) openInv(no);
}
async function delAdd(id,no){ if (!confirm('Remove this charge?')) return; if (await act({action:'ledgerAddDel', id}, 'Charge removed')) openInv(no); }
async function openPdf(no){
  const w = window.open('', '_blank');   // open now so pop-up blockers allow it
  setDot('busy','Finding invoice PDF…');
  try{
    const d = await api({action:'ledgerPdf', invoiceNo:no});
    if (d.files && d.files.length){ setDot('ok','Opened '+d.files[0].name); if (w) w.location = d.files[0].url; else location.href = d.files[0].url; }
    else { if (w) w.close(); setDot('err','No PDF found in Drive for '+no); alert('No PDF found in Drive for '+no+'.\n\nRe-download it from Team Availability: tap the booked team, then 📄 Invoice.'); }
  }catch(e){ if (w) w.close(); setDot('err', e.message); alert(e.message); }
}
function dedForm(i){
  return '<div class="sec"><div class="sl">Add deduction</div><div class="g2">'
   + '<div class="fd s2"><label>Type</label><select id="dType">'+DED_TYPES.map(t=>'<option value="'+t.v+'">'+t.l+'</option>').join('')+'</select></div>'
   + '<div class="fd"><label id="dQl">Sq.ft</label><input type="number" step="0.01" id="dQty" value="'+i.sqft.toFixed(2)+'"></div>'
   + '<div class="fd"><label>Amount</label><input type="number" step="0.01" id="dAmt"></div>'
   + '<div class="fd s2"><label>Reason (shows on statement)</label><input id="dWhy" placeholder="e.g. silicone redone at bedroom windows"></div>'
   + '</div><div class="acts"><button class="btn go" onclick="addDed(\''+esc(i.invoiceNo)+'\')">Add deduction</button></div></div>';
}
function wireDed(i){
  const t=$('dType'), q=$('dQty'), a=$('dAmt'), ql=$('dQl');
  const calc = () => { const T = DED_TYPES.find(x=>x.v===t.value); if (T.per==='fixed'){ return; } a.value = (Number(q.value||0)*T.rate).toFixed(2); };
  t.onchange = () => { const T = DED_TYPES.find(x=>x.v===t.value);
    ql.textContent = T.per==='sqft' ? 'Sq.ft' : T.per==='cost' ? 'Actual glass cost ₹' : 'Qty';
    q.value = T.per==='sqft' ? i.sqft.toFixed(2) : T.per==='cost' ? '' : '1'; a.value=''; calc(); };
  q.oninput = calc; calc();
}
async function addDed(no){
  const i = D.invoices.find(x=>x.invoiceNo===no), T = DED_TYPES.find(x=>x.v===$('dType').value);
  const amt = Number($('dAmt').value||0); if (!(amt>0)){ alert('Enter the deduction amount'); return; }
  if (amt > i.net && !confirm('This deduction is more than the net payable ('+inr(i.net)+'). Add anyway?')) return;
  const ok = await act({action:'ledgerDeduct', invoiceNo:no, offer:i.offer, contractor:i.contractor, code:i.code, type:T.v,
    qty:$('dQty').value||'', rate:T.per==='fixed'?'':T.rate, amount:amt, reason:$('dWhy').value.trim(), by:supName()}, 'Deduction added');
  if (ok) openInv(no);
}
async function delDed(id,no){ if (!confirm('Remove this deduction?')) return; if (await act({action:'ledgerDeductDel', id}, 'Deduction removed')) openInv(no); }
async function pay(no){ if (await act({action:'ledgerPay', invoiceNo:no, paidOn:$('pDate').value, ref:$('pRef').value.trim()}, 'Marked paid')) openInv(no); }
async function unpay(no){ if (!confirm('Mark this invoice unpaid again?')) return; if (await act({action:'ledgerUnpay', invoiceNo:no}, 'Marked unpaid')) openInv(no); }
function closeM(){ $('modal').hidden = true; }

/* ---------- KYC ---------- */
const KYC = [['Account Holder','As on bank account'],['Bank','e.g. HDFC Bank, Sohna Road'],['A/C No','Account number'],['IFSC','e.g. HDFC0001234'],['PAN','ABCDE1234F'],['GSTIN','If registered'],['Aadhaar Last 4','Last 4 digits only'],['KYC Folder','Private Drive folder link']];
function openKyc(ix){
  const c = D.contractors[ix];
  const rows = [['Account Holder','Account Holder'],['Bank','Bank'],['A/C No','A/C No.'],['IFSC','IFSC'],['PAN','PAN'],['Aadhaar Last 4','Aadhaar'],['GSTIN','GSTIN']];
  $('mbox').innerHTML = '<div class="mh"><div><h2>'+esc(c.name)+'</h2><div class="sub">Payment details · from the Contractors sheet</div></div><button class="x" onclick="closeM()">✕</button></div>'
   + '<div class="sec">'+rows.map(([k,l])=>'<div class="line"><span style="color:var(--muted)">'+l+'</span><span>'+(c[k]?esc(c[k]):'<span style="color:var(--red)">missing</span>')+'</span></div>').join('')+'</div>'
   + '<div style="font-size:12px;color:var(--muted)">To add or change these, edit this contractor\'s row in the <b>Contractors</b> tab of the Invoice sheet, then tap ↻ Refresh.</div>';
  $('modal').hidden = false;
}

/* ---------- payment statement ---------- */
function stmRows(){
  const c = $('sCon').value;
  return D.invoices.filter(i => i.contractor===c && (sWhich==='ready' ? stateOf(i)==='ready' : stateOf(i)!=='paid'));
}
function statementHTML(){
  const c = $('sCon').value, con = D.contractors.find(x=>x.name===c) || {}, L = stmRows();
  const ad = L.reduce((s,i)=>s+(i.additions||0),0), g = L.reduce((s,i)=>s+i.gross,0), sh = L.reduce((s,i)=>s+i.shifting,0), od = L.reduce((s,i)=>s+i.other,0), n = L.reduce((s,i)=>s+i.net,0);
  const td = 'padding:7px 8px;border-bottom:1px solid #e5e5e5;font-size:12px';
  const dedLines = L.flatMap(i => D.deductions.filter(d=>String(d['Invoice No']).trim()===i.invoiceNo).map(d => '<tr><td style="'+td+'">'+esc(i.invoiceNo)+'</td><td style="'+td+'">'+esc(d.Type)+'</td><td style="'+td+'">'+esc(d.Reason)+'</td><td style="'+td+';text-align:right">'+inr(d.Amount)+'</td></tr>'));
  return '<div style="font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;background:#fff;padding:32px 36px;max-width:820px;margin:0 auto">'
   + '<div style="display:flex;justify-content:space-between;border-bottom:2px solid #1a1a1a;padding-bottom:12px;margin-bottom:16px"><div><div style="font-size:22px;font-weight:900;letter-spacing:1px">PAYMENT STATEMENT</div><div style="font-size:12px;color:#666;margin-top:4px">Lingel Windows &amp; Doors · contractor settlement</div></div>'
   + '<div style="text-align:right;font-size:12px"><div><span style="color:#888">Date</span> <b>'+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+'</b></div><div><span style="color:#888">Invoices</span> <b>'+L.length+'</b></div></div></div>'
   + '<div style="display:flex;gap:24px;margin-bottom:16px;font-size:12px;line-height:1.7"><div style="flex:1"><div style="color:#888;text-transform:uppercase;font-size:10px;letter-spacing:1px">Contractor</div><b style="font-size:14px">'+esc(c)+'</b> ('+esc(con.code||'')+')<br>'+esc(con.addr||'')+' '+esc(con.phone||'')+'</div>'
   + '<div style="flex:1;background:#f6f7f8;border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px"><div style="color:#888;text-transform:uppercase;font-size:10px;letter-spacing:1px">Pay to</div>'
   + (con['A/C No'] ? '<b>'+esc(con['Account Holder'])+'</b><br>'+esc(con['Bank'])+'<br>A/C '+esc(con['A/C No'])+' · IFSC '+esc(con['IFSC'])+'<br>PAN '+esc(con['PAN'])+(con['GSTIN']?' · GSTIN '+esc(con['GSTIN']):'') : '<span style="color:#c00">Bank / KYC details missing</span>')+'</div></div>'
   + '<table style="width:100%;border-collapse:collapse"><tr style="background:#1a1a1a;color:#fff">'+['Invoice','Offer · Customer','Handover','Gross','Additions','Shifting 50%','Deductions','Net'].map((h,k)=>'<th style="padding:8px;font-size:10px;text-transform:uppercase;text-align:'+(k>2?'right':'left')+'">'+h+'</th>').join('')+'</tr>'
   + (L.length ? L.map(i => '<tr><td style="'+td+'">'+esc(i.invoiceNo)+'<br><span style="color:#888">'+esc(i.date)+'</span></td><td style="'+td+'">#'+esc(i.offer)+'<br><span style="color:#888">'+esc(i.customer)+'</span></td><td style="'+td+'">'+(/done/i.test(i.handover)?'Done '+esc(i.handoverDate):'Pending')+'</td><td style="'+td+';text-align:right">'+inr(i.gross)+'</td><td style="'+td+';text-align:right">+'+inr(i.additions||0)+'</td><td style="'+td+';text-align:right">−'+inr(i.shifting)+'</td><td style="'+td+';text-align:right">−'+inr(i.other)+'</td><td style="'+td+';text-align:right;font-weight:700">'+inr(i.net)+'</td></tr>').join('') : '<tr><td colspan="8" style="'+td+';text-align:center;color:#888">Nothing to pay</td></tr>')
   + '<tr style="font-weight:700"><td colspan="3" style="padding:10px 8px;font-size:13px">TOTAL</td><td style="padding:10px 8px;text-align:right">'+inr(g)+'</td><td style="padding:10px 8px;text-align:right">+'+inr(ad)+'</td><td style="padding:10px 8px;text-align:right">−'+inr(sh)+'</td><td style="padding:10px 8px;text-align:right">−'+inr(od)+'</td><td style="padding:10px 8px;text-align:right;font-size:16px">'+inr(n)+'</td></tr></table>'
   + (dedLines.length ? '<div style="margin-top:16px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#888">Deduction details</div><table style="width:100%;border-collapse:collapse">'+dedLines.join('')+'</table>' : '')
   + '<div style="margin-top:10px;font-size:11px;color:#666">Shifting share = 50% of shifting labour recorded in the Labour Log for each offer.</div>'
   + '<div style="margin-top:44px;display:flex;justify-content:space-between;font-size:11px;color:#888"><div style="border-top:1px solid #999;padding-top:6px;width:200px;text-align:center">Prepared by</div><div style="border-top:1px solid #999;padding-top:6px;width:200px;text-align:center">Approved by</div><div style="border-top:1px solid #999;padding-top:6px;width:200px;text-align:center">Contractor</div></div></div>';
}
function renderStatement(){ if ($('sCon').value) $('stmPreview').innerHTML = '<div style="border-radius:10px;overflow:hidden;border:1px solid var(--line)">'+statementHTML()+'</div>'; }
function printStatement(){ if (!$('sCon').value) return; $('printArea').innerHTML = statementHTML(); window.print(); }

/* ---------- wiring ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x===b));
  ['inv','con','stm'].forEach(v => $('v-'+v).hidden = v!==b.dataset.v);
});
function segWire(id, fn){ $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b)); fn(b.dataset.v); }); }
segWire('fStat', v => { fStat=v; renderInv(); });
segWire('sWhich', v => { sWhich=v; renderStatement(); });
$('fCon').onchange = renderInv; $('fQ').oninput = renderInv; $('sCon').onchange = renderStatement;
$('invTbl').addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) openInv(tr.dataset.no); });
$('modal').addEventListener('click', e => { if (e.target.id==='modal') closeM(); });
$('keyIn').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
if (key()){ $('gate').hidden = true; $('app').hidden = false; const c = JSON.parse(localStorage.getItem(CACHE_LS)||'null'); if (c){ D=c; renderAll(); } load(); }
</script>
</body>
